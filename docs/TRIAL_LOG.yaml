  lesson: L073
  refs: [tools/plot_stinger.py, rebuild/tests/test_plot_placement.py]

- id: T027
  date: 2026-09-29
  goal: >-
    Split generating a result from drawing it, so a figure reads an artifact
    instead of re-running the analysis. Asked why plotting two cases took so
    long and why it did not follow the agreed schema route, the answer was
    that it did not -- and that the schema route could not have worked, since
    the case-row contract deliberately excludes profiles and no per-position
    artifact existed.
  action: >-
    Declared a second contract, slay.report.profile_schema 1.0.0 -- three
    tables, one per grain: geometry (per sample per position), sections (per
    element per position), stations (per roller, fixed). Added Field.per so
    the grain is machine-readable, and slay.report.profile to build and write
    the tables with the grain ENFORCED. tools/emit_profile.py solves and
    writes; tools/plot_from_schema.py --profile draws all five panels and
    imports nothing from slay. Made the split guardrail G13.
  case: 'R=85, spacing 9, 120 MT, 406.4x21; ILS-TP (7 positions) and ILS-SH (13 positions)'
  outcome: success
  evidence: >-
    Peak strain read from the artifact equals the solver envelope EXACTLY:
    0.572688 pct vs 0.572688, diff 0.000e+00. Geometry agrees with the solved
    nodes to 3.303e-04 m at 1200 samples and 9.209e-05 m at 4800 -- a 3.6x
    reduction for a 4x refinement, so it is resampling residual and not a
    mis-recorded value. ILS-TP wrote 8400 geometry + 896 section + 12 station
    rows, ILS-SH 15600 + 1729 + 12. The figure finds 2 junctions for ILS-TP
    and 0 for ILS-SH from the FILE, and takes the stiffener and shroud
    drawing paths accordingly. 562 passed (was 528), layer linter clean at 34
    modules.
  verdict: >-
    A figure that re-runs the analysis cannot be checked against the run it
    claims to show, cannot be pointed at an older result, and has no way to
    fail loudly -- it draws whatever it just computed. Split, a wrong figure
    is either a wrong file, which profile.write's own checks refuse, or a
    wrong plotter, which a reader can see. The first draw from the artifact
    had two panels mirrored and the rollers hidden under a fill (L077), both
    of which look entirely plausible -- which is the argument for the checks
    being in the writer rather than in the eye.
  lesson: L075
  refs: [rebuild/slay/report/profile_schema.py, rebuild/slay/report/profile.py, tools/emit_profile.py, tools/plot_from_schema.py, docs/SLAY_BUILD_INSTRUCTION.md]

- id: T028
  date: 2026-09-30
  goal: >-
    Give GD-SH the five-region strain scheme of the reference (Series 4, Type
    B1, Table XXIX), so an offset body has a reporting unit at all. It steps
    no section, so it has no junction to probe and every junction column in
    its case row was empty -- body_peak_strain read 0.0 for the family with
    the highest strain in the dataset.
  action: >-
    slay.report.regions measures the offset body off the SOLVED contact
    profile -- not from the archetype spec -- and divides the pipe into X1
    (catenary-side taper and beyond), X2/X3/X4 (deep section in thirds from
    the catenary side) and X5 (vessel-side taper and beyond). Case schema to
    1.2.0 with measured offset_L1/L2/V and patterned x1..x5 peaks; profile
    schema to 1.1.0 with a region column on both tables; body_peak_* for an
    offset body now taken over its footprint. Mesh refined 2x and 4x to test
    the ratios.
  case: 'ILS-SH, R=85, spacing 9, 120 MT, 406.4x21, L1=10D L2=2.5D V=1D'
  outcome: success
  evidence: >-
    Geometry recovered from the contact profile to the sampling pitch: L1 =
    4.062 against a defined 4.064, L2 = 1.015 / 1.015 against 1.016, V =
    0.4064 exactly, lift = V - OD/2 = 0.2032. Region ordering reproduces the
    reference: X2 is the peak (0.6868 pct), then X3 (0.784 of X2), then X4
    (0.702), X4 lowest of the three. body_peak_strain now 0.6868 pct at
    s_material 6.833, SR2, step 4 -- was 0.0 with step -1. GD-TP unchanged at
    0.1336 pct and carries NO region columns, so the change is scoped to
    bodies that step no section. Mesh study 2xOD / 1xOD / 0.5xOD: X3/X2 runs
    0.784 / 0.749 / 0.744 and X4/X2 0.702 / 0.712 / 0.691.
  verdict: >-
    The scheme reproduces the reference at the reference's own mesh, and the
    apparent disagreement on X3/X2 was mesh rather than physics -- refined,
    it converges to 0.744, inside the stated 65-75 pct band. Two cautions are
    now recorded in the data rather than in anyone's memory. Each region
    carries n_elements, because at 2xOD the deep thirds hold 2, 2 and 1
    elements and a ratio between them is reporting a mesh (L079). And each
    region peak carries peak_on_shroud, because X1 lumps the catenary-side
    taper together with the plain pipe beyond it -- at 0.5xOD the model peak
    moves onto that taper, 0.395 m outboard of the deep section, at 1.022x
    the X2 peak, which the reference's "governed by the plain-pipe catenary"
    does not anticipate.
  lesson: L078
  refs: [rebuild/slay/report/regions.py, rebuild/slay/report/schema.py, rebuild/slay/report/profile_schema.py, rebuild/tests/test_regions.py, tools/dataset.py]

- id: T029
  date: 2026-09-30
  goal: >-
    Fix the convergence corner that lost three of the 200 matrix cases --
    168.3 mm pipe, 12 m spacing, 160 MT, R = 60-70 m -- all reporting
    CUTBACK EXHAUSTED at lam=0.0000.
  action: >-
    Diagnosed first rather than assumed. lam=0.0000 means the FIRST
    increment was already beyond reach, and since the kernel applies loads
    at full value while only the contact targets are ramped, cutback had
    nothing left to shrink. Added study.sweep.seed_state -- three elastic
    steps carrying state forward (every roller held with no loads, then the
    ruled one-sided set with gravity, then tension) -- and chained the real
    solve onto it. Applied ONLY where the direct solve failed and only where
    there is no carried state. scene.all_bidirectional moved into the scene
    layer from the tool that had it.
  case: 'P042 (R=70) and T060 (R=60), both spacing 12 m, 160 MT, 168.3x11.0; regression sample of 7 converging cases'
  outcome: success
  evidence: >-
    Both failing cases now converge 3/3 positions, seeded=1 (only position
    0), peaks 1.5360 pct and 1.9030 pct. Seven previously-converging cases
    spanning radius, spacing, pipe, tension and both families reproduce to
    0.00e+00 pct -- bit for bit, so the fallback moved nothing that was
    already right. Direct solve still fails with seed=False, pinned by
    test_the_hard_corner_fails_without_a_seed. 585 passed, linter clean.
  verdict: >-
    The order is the whole fix: bend first, load second. The opposite order
    -- settle the loads with targets held, then ramp -- is a documented dead
    end that diverges above about 15 MT (L050/L051), and reading that before
    building anything is what stopped a day being spent re-deriving it. The
    three frame archetypes share the failure MESSAGE and are a different
    defect: ILS-EAST fails at seeding step 1 with no loads at all and a
    singular stiffness matrix, which is a mechanism in the model rather than
    a load out of reach (L082). They stay FAILED and are not claimed as
    fixed.
  lesson: L081
  refs: [rebuild/slay/study/sweep.py, rebuild/slay/scene/scene.py, rebuild/tests/test_seed_state.py, rebuild/slay/report/schema.py]

- id: T030
  date: 2026-09-30
  goal: >-
    Account for the one corner case seeding did not rescue, T060, rather
    than leaving it as an unexplained FAILED row.
  action: >-
    Diagnosed it. An earlier check had seemed to show T060 converging; that
    check ran PLAIN PIPE with T060's stinger parameters while T060 is a
    gd-tp case, so it was not T060 at all. Re-ran the real configuration:
    seeding steps 1-3 converge and step 4, switching plasticity on, does
    not. Raising the increment count to 600 does not help, nor does turning
    J2 on during the tension step, which makes the seed itself fail. Added
    slay.physics.capacity to compute the membrane utilisation and annotate a
    failure with it.
  case: 'T060: gd-tp, R=60, spacing 12 m, 160 MT, 168.3x11.0, L_OD 5.0, t_ratio 2.0'
  outcome: success
  evidence: >-
    Lay tension alone is 80.2 pct of first yield, 289 of 360 MPa, on a 54.36
    cm2 section. With the bending a 60 m radius imposes the elastic demand is
    162 pct of yield. The baseline case is at 12.9 pct. n_increments 20, 60,
    200 and 600 all give CUTBACK EXHAUSTED at lam=0.0000. The failure row
    now carries the reason; the three frame archetypes, at 12.9 pct, carry
    no such message and stay visible as a model defect.
  verdict: >-
    T060 is not a convergence defect and forcing it to converge would have
    been the wrong outcome -- the section is fully plastic under tension
    before any bending is applied. The screen exists to tell that apart from
    a load path badly sequenced, and its SILENCE matters as much as its
    message: a screen that explained every failure would have retired the
    frame archetypes as physics when they are a mechanism in the model.
  lesson: L083
  refs: [rebuild/slay/physics/capacity.py, rebuild/tests/test_capacity.py, tools/dataset.py]

- id: T031
  date: 2026-09-30
  goal: >-
    Make EA-ST with an F2 connection analysable at all, then run the
    reference's two published F2 cases against it.
  action: >-
    Diagnosed the singular matrix rather than guessing. The EA frame was
    assembled attached to NOTHING: Problem splits connectors out of
    `elements` and mesh_of_problem never put them back, and the associations
    that fasten a connector's own two nodes to the real pipe and frame nodes
    were applied by solve.newton but never by solve.passage. Added
    kernel.problem_connectors, carried part_index onto the Problem, split
    constraint_rows so a Problem can resolve ties through the SAME code the
    static solver uses, and applied both in the Newton loop. Then built
    tools/study_f2.py for the two cases with the X_c / X_i / X_e regions.
  case: 'ILS-EAST F2, R=85, spacing 9 m, 120 MT, 406.4x21; Case 1 P_c1=10D kT=2.22, Case 2 P_c1=20D kT=2.85'
  outcome: partial
  evidence: >-
    All three EA archetypes now converge where none ever had: ILS-EAST 14/14
    positions, ILS-EASB 8/9, ILS-ILT 13/13. Both F2 cases run 19/19. Case 1
    X_c envelope 0.923 pct against the reference's 0.936 pct, -1.4 pct.
    Case 2 X_c 1.615 pct against 1.410, +14.5 pct, though position 5 of the
    passage reads 1.414 pct. The ORDERING is reproduced in both cases:
    X_c > X_e >> X_i, with X_i an order of magnitude below the others, which
    is the reference's actual finding. The peak sits 1.00 D from the nearest
    connector at every mesh and every L_top tried, matching Fig 33. L_top
    sensitivity is small -- Case 1 moves 0.6 pct between 22 D and 30 D, Case
    2 about 2 pct -- so the one assumed dimension is not what decides the
    answer. Connector-free cases reproduce to 0.00e+00 pct, so nothing else
    moved. 609 passed.
  verdict: >-
    The machinery works and Case 1 lands within 1.4 pct. TWO DISCREPANCIES
    ARE NOT YET EXPLAINED and the outcome is recorded as partial for that
    reason. X_e runs 27-34 pct LOW in both cases, consistently, which a
    single sign of error suggests is systematic rather than noise -- the
    reporting band excludes the last three stinger rollers and the reference
    may not. X_i runs 65-74 pct high, though on values of 0.04-0.12 pct
    where a 2xOD element is a coarse instrument. Case 2's X_c being high is
    at least partly the comparison being unlike: the reference reports ONE
    position and an envelope over a passage cannot be below it.
  lesson: L084
  refs: [rebuild/slay/solve/passage.py, rebuild/slay/solve/kernel.py, rebuild/slay/solve/constraints.py, rebuild/slay/physics/problem.py, tools/study_f2.py, rebuild/tests/test_passage_connectors.py]

- id: T032
  date: 2026-09-30
  goal: >-
    Run EA-SB with an F2 connection and with an F1, now that the EA frame is
    fastened to the pipe at all, and draw both.
  action: >-
    Emitted both as profile artifacts and drew them from the files.
    emit_profile gained --system, so the connection system is declared on
    the archetype rather than constructed in a tool. Swept the step at 2, 1
    and 0.5 x OD because both passages truncated at the default.
  case: 'ILS-EASB, R=85, spacing 9 m, 120 MT, 406.4x21; F2 (2 connectors at the inner slots, 5.33 D apart) and F1 (1 connector at the centre)'
  outcome: partial
  evidence: >-
    Both solve and draw. F2 at 1xOD step runs the FULL sweep, 30/30
    positions to shift 10.128 m, envelope 2.0818 pct. F1 reaches shift 3.251
    m at best (2xOD, 7/8), envelope 1.8230 pct. GD-SB is an OFFSET body as
    well as a framed one: it holds the pipe 1.4224 m -- 3.5 x OD -- off the
    arc over a 6.502 m deep section with 0.709 m tapers, which is why its
    strains are around 2 pct where GD-ST's are around 1.
  verdict: >-
    The envelopes are LOWER BOUNDS, not answers, and the reason is recorded
    rather than smoothed over. Every configuration except F2 at 1xOD
    truncates mid-passage on CUTBACK EXHAUSTED at lam=0.0000 with carried
    state and deep plasticity around 2 pct; raising n_increments to 600 does
    not help, and refining the sweep step is NOT monotonic -- F2 goes
    4.064 m at 2xOD, the whole 10.128 m at 1xOD, then back to 1.829 m at
    0.5xOD. A finer path is not a safer one here, so this is not the
    increment-size problem that L081 was, and seeding does not apply because
    the failures are mid-passage where re-seeding would discard the carried
    plastic state that mode A exists to keep.
  lesson: L084
  refs: [tools/emit_profile.py, docs/diagrams/easb_f2.png, docs/diagrams/easb_f1.png]

- id: T033
  date: 2026-09-30
  goal: >-
    Run the reference's four published EA-SB cases -- F1 Case 1 and F2 Cases
    1 to 3 -- at their stated parameters.
  action: >-
    Built tools/study_easb.py. The parameters map one for one onto
    component_spec.BaseStructure's own field names (P_l1, P_l2, P_v, P_c1,
    kB_ratio), so the cases are set by editing the archetype definition
    rather than by constructing geometry. The region classifier is IMPORTED
    from study_f2 rather than restated, so the EA-ST and EA-SB studies
    cannot drift apart on what X_c means.
  case: 'ILS-EASB, R=85, spacing 9 m, 120 MT, 406.4x21, sweep step 1xOD; P_v = 2D in every case'
  outcome: partial
  evidence: >-
    All four converge over the FULL passage, where the archetype as shipped
    had truncated. The shipped P_v is 1.6256 m = 4 D, giving a 3.5 D lift;
    every published case is 2 D, a 1.5 D lift, and the difference is what
    was driving the earlier truncations. Against the reference, X_c reads
    -58.7, -43.7, -6.8 and -41.8 pct for F1 C1 and F2 C1-C3; X_e -19.4,
    -10.1, -45.0, -10.5; X_i about +50 pct on values of 0.09-0.14 pct. The
    ORDERING X_c > X_e >> X_i is reproduced in every case.
  verdict: >-
    A real disagreement, and one candidate explanation is ELIMINATED rather
    than left open: we are LOW while taking a passage envelope, and an
    envelope cannot be below a single position, so unlike EA-ST Case 2 this
    is not an unlike-comparison artefact. Our model is also far more
    sensitive to connector placement than the reference's -- F2 Case 2, the
    only case whose connectors sit exactly at the deep section's edges, is
    the only one that lands close at -6.8 pct, while the two cases with
    connectors 2.5 D inboard both read about -42 pct. Re-defining X_c at the
    body's taper instead of at the connector was tested and does not explain
    it: the values move by at most 0.19 pct. P_l2 was checked and IS applied
    -- the built extent is P_l1 + 2*P_l2 to the millimetre -- so the cases
    are what they claim to be. F1D and F2D are NOT run: they carry D
    connectors and the passage solver implements F only, which G9 requires
    be refused rather than approximated.
  lesson: L084
  refs: [tools/study_easb_cases.py, tools/emit_profile.py, docs/diagrams/easb_f2_case2.png, docs/diagrams/easb_f1_case1.png]

- id: T034
  date: 2026-10-01
  goal: >-
    Check, when asked, whether the X_c / X_i / X_e regions actually follow
    the reference's stated convention rather than our reading of its
    pictures.
  action: >-
    Compared the implementation against sections VII.B and VIII.B word by
    word. Found X_c implemented at a half width of 1.5 D against a stated
    2 x Pipe OD. Found the reference's prose and its own figures disagreeing
    about where X_e stops, implemented the prose, measured the result, and
    reverted to the figure's reading when the numbers refused it.
  case: 'EA-ST F2 Cases 1-2 and EA-SB F1/F2 Cases 1-3, R=85, spacing 9 m, 120 MT'
  outcome: success
  evidence: >-
    The X_c width was wrong and changes NOTHING -- every peak already sat
    within 1.5 D of a connector, so all eight case results are identical at
    2 D. On X_e, bucketing the under-structure pipe separately gives, against
    the reference's own X_e: abutting X_c -19.4 / -10.1 / -10.5 pct on the
    three cases that can distinguish the readings, against -48.4 / -44.3 /
    -45.0 pct for X_e outside the body. F2 Case 2 cannot distinguish them at
    all, because its connectors sit on the body's own edges and leave no
    under-structure pipe. 623 passed.
  verdict: >-
    Two different kinds of error, and only one of them had a symptom. The
    width was a band sized for the discretisation rather than read from the
    source, and because it changed no number it would have survived
    indefinitely (L089). The X_e boundary was worse: the prose reading is
    the one I implemented first, and it was the published numbers that said
    so, not any reasoning about what 'outside the structures' ought to mean
    (L090). Where a source contradicts itself, measure both readings and let
    its own results decide -- and say which cases are evidence, since one of
    the four is not.
  lesson: L089
  refs: [tools/study_f2.py, tools/study_easb_cases.py, rebuild/tests/test_regions.py]

- id: T035
  date: 2026-10-06
  goal: >-
    Run EA-ST and EA-SB with a PS connection -- a PIN and a ROLLER rather
    than two fixed connectors.
  action: >-
    Found it blocked by a declared absence rather than a bug: an S releases
    the translation along its slot, so its constraint belongs in an axis
    that turns with the pipe, and no such frame existed. Measured the stakes
    before building -- the lay path turns 1.0 to 9.5 deg over the EA
    connectors' own travel and 30 deg by the last roller, so a global row
    leaks sin(theta), up to 16.5 pct over that travel. Built the frame in
    solve.passage as a single general constraint rebuilt from the current
    displacement each iteration, let P and S through the solver, and took on
    the mesher's opt-in for S rather than evading it.
  case: 'ILS-EAST and ILS-EASB on PS, R=85, spacing 9 m, 120 MT, 406.4x21, step 1xOD'
  outcome: success
  evidence: >-
    The joint behaves as a bolt in a slot: at the envelope the slot slides
    10.3 mm ALONG itself and is held to -4.6e-15 m ACROSS it, with its axis
    at 2.53 deg -- the local pipe slope, not a global axis. ILS-EAST PS runs
    24/24 positions, ILS-EASB PS 9/10. Against the same archetypes on F2:

      ILS-EAST  F2  X_c 0.607  X_i 0.062  X_e 0.483
                PS  X_c 0.360  X_i 0.358  X_e 0.420
      ILS-EASB  F2  X_c 1.185  X_i 0.142  X_e 2.082
                PS  X_c 0.481  X_i 0.243  X_e 1.986

    Peak strain is IDENTICAL to four decimals whether the frame co-rotates
    or is forced to global axes, on both archetypes, even though the slot
    reaches 8.2 deg off horizontal by the last position.
  verdict: >-
    PS RELIEVES THE CONNECTOR AND REMOVES THE SHIELDING, which is what a pin
    and a roller should do. X_c falls by 41 pct on EA-ST and 59 pct on
    EA-SB, because a statically determinate pair cannot restrain the pipe
    the way two fixed connectors do. And X_i, an order of magnitude below
    X_c under F2, rises to EQUAL it on EA-ST -- with the slot free to slide,
    the frame can no longer hold the pipe it spans, so the shielding that is
    F2's whole signature is gone. The frame itself buys correctness and not
    a number (L092): it is required, because without it an S is an F in all
    but name, but it moves neither archetype's peak. ILS-EASB PS truncates
    at 9/10, so that envelope is a lower bound.
  lesson: L091
  refs: [rebuild/slay/solve/passage.py, rebuild/slay/solve/constraints.py, rebuild/tests/test_skew_frame.py, docs/diagrams/east_ps.png]

- id: T036
  date: 2026-10-06
  goal: Establish whether a single comparison exists between the two source
    papers, the original toolchain and the rebuild -- and assemble one if not.
  action: >-
    Surveyed what comparison material exists before running anything. Then
    closed the one gap that was a measurement rather than a missing run:
    ILS-SH ships V = 1.0 D, L1 = 10 D, L2 = 2.5 D, which is EXACTLY Paper 1's
    Series 4 R = 85 / 100 MT row at a published X2 of 0.70 pct, and that
    comparison had never been made. Ran it at the paper's own tension at
    three mesh densities.
  case: ILS-SH, R=85, spacing 9 m, 100 MT, 406.4x21, mesh 2xOD / 1xOD / 0.5xOD
  outcome: measurement
  evidence: "NO consolidated table existed. Material sat in RESULTS.md 1.1    \ (rebuild vs run_slay), T5 5e (the same table again), T9_components_spec    \ 6b (run_slay vs Paper 1 on GD-TP), T9_physics_sequence (six EA cases vs    \ Paper 2), and two study tools that printed comparisons at runtime and    \ persisted nothing. The repo also called both papers \"the reference\"    \ and distinguished them nowhere.\n\nSeries 4, ILS-SH at 100 MT against    \ the published 0.70 pct:\n\n  2xOD (ruled)  X2 0.6318  -9.7 pct   X3/X2    \ 0.800\n  1xOD          X2 0.6625  -5.4 pct   X3/X2 0.770\n  0.5xOD        \    X2 0.7164  +2.3 pct   X3/X2 0.767\n\nRefinement carries X2 THROUGH    \ the published value, crossing it between 1xOD and 0.5xOD."
  verdict: >-
    The ledger is docs/validation/VALIDATION_v1.0_2026-10-06.md,
    one row per published case naming the
    program that produced each number. Assembling it established three
    things. The strongest result in the repo is rebuild against run_slay on
    plain pipe, within 1.7 pct at every radius. Three published series have
    no rebuild column at all -- Series 3 at the paper's configuration (nine
    values, the highest-value run outstanding), 12 of 13 Series 4 cases (a V
    sweep, the cheapest, needing three names added to emit_profile's
    dimension passthrough first), and both Series 5 cases (blocked on region
    reporting for ILS-SHTP, not on physics). And the reason the exercise paid
    for itself: the Series 4 mesh table in T9_physics_sequence was run at 120
    MT against a 100 MT target and carried no tension label, so the X3/X2
    conclusion drawn from it does not survive -- 0.767, just OUTSIDE the
    paper's 65-75 pct band, not 0.744 inside it. It looked tension-insensitive
    at the ruled mesh (0.800 vs 0.784), which is why it went unnoticed; the
    gap holds under refinement and 0.75 is where the band's edge sits.
    Corrected in both files.

    Two gaps recorded rather than fixed. Paper 2 has no citation in this
    repo, so every EA number is checked against a transcription from supplied
    figures -- which matters most for the EA-SB rows 40-60 pct out, where a
    transcription error would read exactly like a physics disagreement. And
    we report extreme-fibre strain per element while both papers report
    nominal strain at integration points: expected to coincide for a B31 beam
    in bending, never checked against the kernel, and a systematic offset
    candidate under EVERY row of the ledger.
  lesson: L093
  refs: [docs/validation/VALIDATION_v1.0_2026-10-06.md, docs/RESULTS.md, docs/modules/T9_physics_sequence.md, docs/modules/T9_components_spec.md]

- id: T037
  date: 2026-10-06
  goal: Give Paper 1 Series 3 Study 1 a rebuild column -- the nine
    wall-thickness cases that had none -- at the paper's own configuration.
  action: >-
    Read Paper 1 in full (52 pp) BEFORE running, so the configuration came
    from the source rather than a transcription. That turned up three facts
    the transcriptions lacked: roller spacing is 9 m c/c throughout (our
    earlier GD-TP comparison used 8 m), Series 4 and 5 are governed by Phase
    2 rather than Phase 1, and TABLE XXXIV exists and gives the X3/X4
    absolutes we did not have. Then ran the nine cases through emit_profile.
  case: ILS-TP, R=70/85/100 m, 100 MT, 9 m spacing, L=1000 mm,
    t=32/42/53 mm, 406.4x21, 2xOD mesh, envelope with edge crossings
  outcome: measurement
  evidence: |-
    FIRST ATTEMPT WAS WORTHLESS AND LOOKED FINE: all nine converged and
    reported three numbers repeated three times, because emit_profile's CLI
    had been dropping --t-ratio and --L-OD and every case ran the
    archetype's default 42 mm wall (L094). Caught only because the nine
    were printed together -- read one at a time each was plausible.

    After the fix, against paper TABLE XX:

      A1 32mm  0.6421 / 0.4875 / 0.3815   paper 0.562 / 0.473 / 0.339
      A2 42mm  0.7132 / 0.5546 / 0.4214   paper 0.647 / 0.508 / 0.358
      A3 53mm  0.7857 / 0.6237 / 0.4519   paper 0.727 / 0.556 / 0.425

    +3.1 to +17.7 pct, mean about +10 pct, ALL NINE HIGH. Every case put the
    envelope at shift 1.000 m -- the travel where the component's leading
    edge sits on SR2, which is where the paper says Phase 1 peaks.
  verdict: >-
    Series 3 Study 1 now has a rebuild column at the paper's own
    configuration. Two readings, kept apart. The one-sided agreement is what
    the envelope offset predicts -- we take a peak across the passage, the
    paper reports a single analysis, so we cannot read low, and +10 pct is
    the right order; our own sliding study reads 24.6 pct above a
    single-position solve of the same case, which is that effect measured
    directly.

    Separately, the R-trend divergence is ABSENT here: the deltas do not flip
    sign across the radii the way plain pipe's +17.9 / +5.6 / -8.1 does. The
    run_slay column, run at 8 m against a 9 m paper, DOES flip. So the
    "+19 to +26 pct at R = 70" recorded against Paper 1 for GD-TP was partly
    a spacing mismatch rather than toolchain divergence; at the paper's own
    9 m the rebuild is +14.3 pct there. run_slay stays as a program-to-program
    check -- we sit within 9.5 pct of it everywhere -- but it is not a
    like-for-like comparison against Paper 1 and must not be read as one.
  lesson: L094
  refs: [docs/validation/VALIDATION_v1.0_2026-10-06.md, tools/emit_profile.py, rebuild/tests/test_emit_profile_cli.py]

- id: T038
  date: 2026-10-06
  goal: Run Paper 1's Series 4 V sweep -- all twelve published X2 values, the
    largest block of comparison material in the paper.
  action: >-
    The generator could not express the sweep: `_extra` carried GD-SB's four
    dimensions and none of GD-SH's, so V, L1 and L2 were unreachable from the
    command line. Added them under component_spec's own names, with tests
    that separate parsing from reaching the built geometry (the distinction
    L094 was about). Then ran the twelve cases at 2xOD, the paper's own mesh
    density, and read every region from the saved profile artifacts rather
    than from stdout.
  case: ILS-SH, 9 m spacing, 2xOD mesh, 406.4x21; R=85/T=100MT/L1=10D/L2=2.5D
    at V=0.75..3.0D, R=70/T=120MT/L1=5D/L2=2.5D and R=70/T=100MT/L1=10D/L2=5D
    at V=1.0/1.5/2.0D
  outcome: partial
  evidence: |-
    X2 against paper TABLE XXXI:

      R=85 T=100  0.75D 0.5347 (-13.8)  1.0D 0.6318 ( -9.7)  1.5D 0.7917 (-16.7)
                  2.0D  0.9636 (-19.7)  2.5D 1.1421 (-24.4)  3.0D 1.3163 (-26.9)
      R=70 T=120  1.0D  0.8466 ( +4.8)  1.5D 1.0015 ( +3.2)  2.0D 0.8592 (-25.3)
      R=70 T=100  1.0D  0.7399 ( -2.6)  1.5D 0.6704 (-34.9)  2.0D 0.7510 (-38.9)

    Per-region peaks, R=85 series, showing the break between 1.5D and 2.0D:

      V      X1       X2       X3       X4     peak
      0.75  0.5163   0.5347   0.4703   0.4397   X2
      1.0   0.6086   0.6318   0.5053   0.4550   X2
      1.5   0.7272   0.7917   0.5790   0.5043   X2
      2.0   0.8500   0.9636   0.4074   0.2356   X2
      2.5   0.9781   1.1421   0.4366   0.2421   X2
      3.0   1.1106   1.3163   0.4631   0.2469   X2

    At R=70 X1 exceeds X2 in all six cases, on the shroud footprint, so the
    peak is on the TAPER: 0.8641 / 1.0766 / 1.2204 and 0.7864 / 0.8792 /
    1.0000 pct. Paper says X2 governs in every case it ran.

    dX2/dV ours (R=85): 0.388 0.320 0.344 0.357 0.348 -- constant.
    dX2/dV paper:       0.320 0.500 0.500 0.620 0.580 -- rising.
  verdict: >-
    REPRODUCED: X2 rises monotonically with V and X2 governs at R = 85, which
    is Series 4's actual finding -- offset depth is the dominant parameter.

    THREE STRUCTURAL DISAGREEMENTS, not scatter. We under-amplify with depth:
    our X2 is linear in V at a constant 0.35 pct per diameter while the
    paper's slope rises, so the delta grows steadily from -13.8 pct at 0.75 D
    to -26.9 pct at 3.0 D. At R = 70 the peak sits on the taper rather than
    the deep section. And X3/X4 do not plateau, they COLLAPSE past a depth
    threshold -- X3 0.5790 -> 0.4074 and X4 0.5043 -> 0.2356 between 1.5 D and
    2.0 D, where the paper has X3 rising and X4 plateauing. A plateau and a
    collapse are different mechanisms.

    ONE HYPOTHESIS WOULD ACCOUNT FOR ALL THREE and is recorded as a
    hypothesis, not a result: beyond a threshold depth our deep section lifts
    clear of the rollers, so the midspan and vessel thirds unload while the
    catenary-side edge takes everything. That fits X2 rising while X3 and X4
    drop, the peak migrating to the taper at the tighter radius, and the
    under-amplification -- a bridged deep section cannot transmit the
    curvature the paper's contact does. The check is the station contact
    state at V=1.5D against V=2.0D, and the profile artifacts already hold
    it. Not done.

    Caveat on all twelve: the paper marks every Series 4 case Ph2, the
    elastic bend-unload cycle over the mid-stinger rollers carrying residual
    plastic curvature from Phase 1. Our envelope lands at step 3-5 of the
    passage. Whether those are the same mechanical state is unsettled and is
    the first thing to resolve before reading any of these deltas as physics.
  lesson: '-'
  refs: [docs/validation/VALIDATION_v1.0_2026-10-06.md, tools/emit_profile.py, rebuild/tests/test_emit_profile_cli.py]

- id: T039
  date: 2026-10-06
  goal: Put the pipeline contact surface at the BOTTOM of the pipe OD by
    default, so the stinger radius carries the roller offset r_roller + OD/2,
    and measure what it does to the plain pipe case.
  action: >-
    Confirmed first that ils_builder already owns the contact surface either
    side of a component: assembly.contact_at(x) returns y = OD/2 with owner
    'pipe' outside the component extent, lift exactly 0.0, and the
    component's own surface takes over inside it -- one continuous
    bottom-surface profile, no second implementation. effective_radius was
    then found to already compute R + r_roller + OD/2 for 'bottom', so both
    requested changes are one switch. Set DEFAULT_SURFACE = 'bottom' in
    physics.contact and wired it through problem, sweep, stage_run and slide.
  case: plain pipe 406.4x21, R=70/85/105 m, 120 MT, 8 m and 9 m spacing,
    staged four-step J2; plus the 6 in / 12 m / 160 MT seeding corner
  outcome: partial
  evidence: |-
    Peak in zone, centreline -> bottom, and where the peak sits:

      sp=8  R= 70  0.5179 -> 0.5197  +0.36 pct   s 8.06 -> 8.26
      sp=8  R= 85  0.3884 -> 0.3885  +0.02 pct   s 8.06 -> 8.22
      sp=8  R=105  0.2879 -> 0.2877  -0.10 pct   s 8.06 -> 8.19
      sp=9  R= 70  0.5423 -> 0.5373  -0.91 pct   s 8.99 -> 9.57
      sp=9  R= 85  0.4014 -> 0.4032  +0.45 pct   s 8.99 -> 9.53
      sp=9  R=105  0.2942 -> 0.2954  +0.42 pct   s 8.99 -> 9.49

    All twelve converge. An earlier version of this table read -0.8 to
    -1.5 pct at every radius and was WRONG -- it was measured before L095
    was found, with SR7's slot clamped onto the wrong node.
  verdict: >-
    The switch is small and NOT a uniform reduction: -0.91 to +0.45 pct,
    inside mesh noise. The naive expectation is -0.59 pct everywhere, since
    R_eff/R = 1.00592 and strain goes as 1/R. It does not happen because the
    PEAK MOVES with the slots -- 0.2 m at 8 m spacing, 0.6 m at 9 m -- so the
    two numbers are the peak of a field sampled in different places, not the
    same quantity scaled. Reported as measured rather than as expected.

    TWO DEFECTS THE SWITCH EXPOSED, both of which were invisible under
    'centreline' because s_material IS s_arc there. L095: the terminal slot
    fell 0.32 m off the end of the mesh and `_bracket` clamped it silently,
    on the station that bears the lay tension. L096: the margin that fixes
    L095 is a hard pair with the OD, and TOO MUCH room is worse than too
    little -- a 6 in passage given a 16 in margin has unconstrained pipe past
    the last contact, which is the free cantilever D6 removed, and it took
    the seeding corner from 7/7 converged to failing at lam=0.0000. Both now
    refuse rather than approximate.

    The reference comparison stays on 'centreline' explicitly, because
    run_slay runs that surface; at R = 85 / 8 m the two differ by 0.02 pct
    (0.38839 against 0.38848), so M1's 1.3 pct agreement is unaffected
    either way.
  lesson: L095, L096
  refs: [rebuild/slay/physics/contact.py, rebuild/slay/study/sweep.py, rebuild/slay/scene/scene.py, tools/stage_run.py]
