- id: L044
  area: measure
  class: finding
  symptom: >-
    The reference Python program and the paper's Abaqus model agree at R = 70
    and diverge progressively with stinger radius, to -15% at R = 105.
  cause: >-
    Two separate effects, and only the first is a scale. (1) At R=70 the
    Python program runs a uniform +8.5 to +10% above Abaqus across a 3x
    diameter range (168/406/508 mm) and two tensions -- a stable offset
    consistent with the single-roller idealisation the paper flags as
    conservative, and with point contact against a finite 300 mm roller.
    (2) The amplification over the analytical D/2R moves the OPPOSITE way
    with R: Abaqus +58/+59/+65% at R=70/85/105, Python +65/+52/+38%. They
    cross near R=80.
  rule: >-
    Judge agreement against the benchmark with a STATED tolerance, not as
    equality -- the reference itself is +9% at R=70 and -15% at R=105. The
    R-trend mismatch is the thing to chase, not the offset. Also:
    config.ROLLER_SPACING is 8.0 m while the benchmark is 9 m c/c. Changing
