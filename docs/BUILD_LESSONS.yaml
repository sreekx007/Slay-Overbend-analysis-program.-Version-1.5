  detect: test_the_archetype_assembles_and_every_connector_is_zero_length, test_the_deadband_systems_build_here
  refs: [tools/study_east_full.py, tools/study_east_deadband.py, tools/study_easb.py]
  date: 2026-09-14

- id: L037
  area: model
  class: defect
  symptom: >-
    GD-SB accepted a negative P_c1 and built crossed, unordered connector
    slots. On ILS-EASB at 200 kN it built, validated and SOLVED clean at
    78.477 mm against the healthy component's 70.395 -- an 11.5% error with
    nothing objecting anywhere.
  cause: >-
    BaseStructure.validate() did not call super().validate(), discarding the
    inherited P_c1/P_c2/P_gap positivity checks. A negative P_c1 puts inL
    right of inR and places the outer slots relative to the swapped pair, so
    it is a DIFFERENT, SMALLER structure, not a relabelling
    (-1.0 -> slots at -0.5837, +0.50, 0, -0.50, +0.5837). The mesher then
    SORTS stations, which straightens the crossing out and erases it,
    leaving only connectors in the wrong places.
  rule: >-
    A subclass validate() that does not call super() silently drops every
    inherited check; the reason for skipping must be re-checked whenever the
    parent changes. Fixed upstream as Slay-ILS-Designer-V1.0 PR #2 (one line
    plus a test). Until that merges AND the mirror is re-synced, a negative
    P_c1 is still accepted here -- do not assume the check exists.
  detect: upstream:test_base_structure_inherits_the_connector_span_checks
  refs: [rebuild/component_spec.py, docs/SLAY_BUILD_INSTRUCTION.md]
  date: 2026-09-14

- id: L038
  area: process
  class: finding
  symptom: >-
    The mirrored component_spec.py is BEHIND upstream main and nothing
    noticed. Upstream e7e0e80 carries a Boss/GD-BOSS component (89 lines)
    that our copy does not have, plus a changed docstring.
  cause: >-
    test_shared_constants_still_agree_with_upstream checks the five shared
    VALUES, not the mirrored FILES. A local edit to a mirrored file -- the
    thing G7 forbids outright -- also passed silently.
  rule: >-
    fixtures/mirror_provenance.json records each mirrored file's sha256 and
    what is known about its upstream origin; the hash guard catches a LOCAL
    edit (a G7 violation). Upstream drift is still caught by nothing and
    needs a deliberate check. Re-syncing is a DECISION, not a refresh: it
    pulls GD-BOSS in, which D4 puts out of scope. Update the recorded hash
    and the upstream sha in the same commit as any re-sync.
  detect: test_the_mirrored_files_have_not_been_edited_here, test_the_provenance_record_covers_every_mirrored_file
  refs: [rebuild/fixtures/mirror_provenance.json, rebuild/tests/test_config_ownership.py]
  date: 2026-09-14

- id: L039
  area: solve
  class: defect
  symptom: >-
    Every study's Newton loop was `for _it in range(max_iter): ... break` with
    NO `else`. An engaged deadband silently exhausted all 30 iterations on
    every run and nothing said so.
  cause: >-
    A penalty formulation has a residual FLOOR below the tolerance the F-only
    cases reach. k_pen is ~1e15, so round-off in U at ~1e-2 m leaves a
    fraction of a newton no iteration can remove. Measured on ILS-EAST F2D
    with both D engaged: quadratic convergence 2.3e-01 -> 4.9e-06 -> 4.3e-08,
    then STAGNATION at 2.5e-09 for as long as it is given.
  rule: >-
    Converge on tol OR on stagnation below STALL_BAND (1e-6), and RECORD
    which (SolveResult.stalled). Bound every loop and raise otherwise --
    L015's rule, applied to our own code rather than only to the kernel. The
    answers were never wrong (stagnation at the floor IS the answer) but
    nothing distinguished that from a case that failed to converge. Default
    tol 1e-8; F/W cases reach it outright, engaged deadbands stall.
  detect: test_the_penalty_floor_is_reported_not_hidden, test_a_non_converging_case_raises_rather_than_spinning
  refs: [rebuild/slay/solve/newton.py, rebuild/tests/test_solve.py]
  date: 2026-09-14

- id: L040
  area: solve
  class: ruling
  symptom: '-'
  cause: '-'
  rule: >-
    The solve machinery lives in slay/, not in tools/. slay/physics/connector
    (the prescribed-stiffness element, both branches), slay/solve/constraints
    (rows from associations + the active set), slay/solve/penalty (local-
    diagonal MPCs, ALPHA = 1e5), slay/solve/kernel (the nlfea_v4 boundary and
    the dof permutation), slay/solve/newton (bounded increments). The studies
    IMPORT them -- L013's rule, that a second copy of the joint physics is a
    second thing to correct. Verification is that the package reproduces all
    nine measured study figures across both archetypes, both deadband
    systems, engaged and open, and the tie-override path. NOT solve(problem):
    Problem is T4's artifact. SUPPORTED_CONN_TYPES widened to {F, W, P} --
    a revolute frees rz alone, which is frame-independent; S and D still
    refused because their rows need the co-rotating axis.
  detect: test_the_package_reproduces_the_studies, test_p_is_supported_now_that_the_solver_applies_it, test_unsupported_connector_type_is_refused
  refs: [rebuild/slay/solve/newton.py, rebuild/slay/physics/connector.py, rebuild/tests/test_solve.py]
  date: 2026-09-14

- id: L041
  area: physics
  class: defect
  symptom: >-
    Contact targets came out at -1485 m, +1896 m, non-monotone, and non-zero
    at deck stations whose target is exactly zero.
  cause: >-
    `arc_target(R, theta)` takes an ANGLE and was called with the station's
    ARC LENGTH. Reading 40 m as 40 radians is off by three orders of
    magnitude. The helper was right and verified; the call site was wrong.
  rule: >-
    Caught immediately ONLY because the magnitude was absurd. A
    wrong-but-plausible number in a contact target is a wrong model that
    converges -- which is the whole reason tracker item 16 exists. Any
    quantity with an angle/length pair of forms gets the conversion at the
    call site named, and the result checked against an independent
    computation (`arc_target_by_projection`) rather than against itself.
  detect: test_the_target_takes_an_angle_not_an_arc_length, test_targets_match_the_closed_form_at_every_station
  refs: [rebuild/slay/physics/contact.py, rebuild/tests/test_physics.py]
