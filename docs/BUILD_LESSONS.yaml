  date: 2026-09-14

- id: L036
  area: process
  class: defect
  symptom: >-
    Three separate crashes moving ILS-EAST code to ILS-EASB: a zero-size
    array from frame_ix, a KeyError on 'ST:connector2', and a
    ZeroDivisionError in the deflected-shape plot.
  cause: >-
    Each was a hardcoded assumption about ILS-EAST. The EA owner tag is 'ST'
    there and 'SB' here, so both `e.owner == 'ST'` filters and rebuilt
