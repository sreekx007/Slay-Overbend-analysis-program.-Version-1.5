- id: L046
  area: solve
  class: finding
  symptom: >-
    passage.solve cannot reach the benchmark case: CUTBACK EXHAUSTED on the
    FIRST increment at 30 MT of tension as readily as at 120.
  cause: >-
    The benchmark's load path is STAGED -- pretension with the vessel end
    fixed, then a rotation-driven bend, then gravity, then lay tension, then
    translation -- while solve ramps contact targets, gravity and tension
    together on one lam. At the first increment that puts a fraction of
    1.18 MN on the tip of a 9 m overhang past SR6, on a pipe still straight
    and anchored 99 m away, with nothing to react it.
  rule: >-
    A proportional ramp is not a substitute for a staged one when the later
    loads need geometry the earlier steps create. solve must take a SEQUENCE
    of steps, each ramping its own subset and carrying state -- which is what
    SolveState already exists for. Corollary measured: without tension the
    one-sided stinger rollers cannot pull the pipe onto the arc, so only 4-5
    of 10 carry, strain barely varies with R (0.2617/0.2704/0.2428 at
    70/85/105) and stinger radius stops governing. Tension is not a load on
    the benchmark case, it is what makes it the benchmark case.
  detect: '-'
  refs: [rebuild/slay/solve/passage.py, docs/modules/T5_solve_spec.md]
  date: 2026-09-21

- id: L047
  area: measure
  class: finding
  symptom: >-
    Every contact target met to 1e-13 m, and the material point that should
    sit at SR6 ends up 2.21 m from the arc (5.2 m in the one-sided gravity
    case). Miss grows monotonically down the stinger and is invisible to the
    residual.
  cause: >-
    A contact slot fixes the NORMAL component of an interpolated displacement
    and leaves the tangent free, so the residual reports on one direction
    only. The first diagnosis written here -- tangential indeterminacy for
    want of tension -- was WRONG, and the arc-position check is what proved
    it: the true cause was a mirrored contact normal (L048), and the miss
    drops to 2.7 mm with that fixed and still no tension.
  rule: >-
    A converged residual on a partial constraint is evidence about the
    constrained direction and nothing else. Under arc-length positioning the
    material point at arc s must land at path.position(s) -- both components,
    no projection, nothing the constraint itself supplies. Measure that
    before theorising about what is missing; a plausible story about
    under-constraint is cheaper to write than a position to measure, and it
    was wrong.
  detect: test_the_material_point_lands_on_its_own_arc_station
  refs: [tools/plot_stinger.py, docs/modules/T5_solve_spec.md, docs/diagrams/stinger_pipe.png, rebuild/tests/test_passage.py]
  date: 2026-09-21

- id: L048
  area: physics
  class: defect
  symptom: >-
    Contact normals carried the world-frame sign into model DOFs. Arc
    stations missed their own arc point by up to 2.21 m at SR6 (R=85) while
    every target was met to 1e-13 m. Rebuild peak strain barely moved with
    stinger radius -- 0.2617/0.2704/0.2428 pct at R=70/85/105 -- when it must
    fall like D/2R.
  cause: >-
    scene speaks WORLD (x toward the vessel); model, physics and solve speak
    MODEL (s toward the stinger, x_world = -(s + u_s)). path.normal returns a
    world vector and contact_targets handed it straight to the solver as
    coefficients on (u_s, u_y), so the s component had the wrong sign. dn was
    unaffected -- flipping both u_s and n_s leaves the dot product alone --
    so the target matched to machine precision and the constraint was still
    wrong. The reference program has no such boundary: its nodal coordinate
    IS world x (slay_sliding_v0_4.py:235, "decreasing with node id"), so its
    nx = -sin(theta) was right there and is wrong here.
  rule: >-
    A formula ported across a frame change is not a formula that survived the
    port. Every world vector entering model/physics/solve passes through one
    named conversion (physics.contact.to_model_frame) and no other place
    flips a sign. A quantity that is invariant under the error -- here dn,
    because both factors flip -- cannot be used to check the error.
  detect: test_the_material_point_lands_on_its_own_arc_station
  refs: [rebuild/slay/physics/frame.py, rebuild/slay/physics/contact.py, rebuild/slay/scene/path.py, slay_sliding_v0_4.py, docs/modules/T5_solve_spec.md]
  date: 2026-09-21

- id: L049
  area: physics
  class: defect
  symptom: >-
    Lay tension pointed the wrong way along the pipe. Measured through the
    solve at R=85: 10 MT of declared lay tension put 5.27 MT of COMPRESSION
    through the straight deck run instead of ~10 MT of tension. Peak strain
    at 10 MT read 0.2595 pct against 0.2904 pct with the direction corrected.
  cause: >-
    Same defect as L048 at a second site. path.tangent returns a WORLD vector
    and lay_tension used it as a model-frame (fx, fy), so the s component had
    the wrong sign and the tip was pulled back toward the vessel instead of
    down the catenary. The existing test asserted fx == T*tx against the same
    world tangent, so it restated the implementation and ratified the defect
    rather than catching it.
  rule: >-
    A test that restates the implementation cannot fail with it. Name the
    physics instead: tension pulls the cut end away from the vessel and down,
    so fx > 0 and fy > 0 in model components, and the deck carries tension,
    not compression. Every world vector entering model/physics/solve goes
    through physics.frame.to_model_frame; grep path.tangent and path.normal
    outside scene to find the sites -- there were exactly two.
  detect: test_tension_pulls_the_tip_away_from_the_vessel, test_lay_tension_puts_the_deck_in_tension
  refs: [rebuild/slay/physics/frame.py, rebuild/slay/physics/loads.py, slay_sliding_v0_4.py, docs/modules/T5_solve_spec.md]
  date: 2026-09-21

- id: L050
  area: solve
  class: finding
  symptom: >-
    CUTBACK EXHAUSTED at lam=0.0000 on every tension case, and a 64x cutback
    barely moved the first Newton step -- 3.674 m at lam=1/40 against 3.232 m
    at lam=1/2560, threshold 1.0 m.
  cause: >-
    nlfea_v4.assemble takes lam and never applies it to dist_loads or
    joint_loads (nlfea_v4.py:1419-1429); only the assemble_at wrapper at line
    1693 scales them, and no solver in this project calls it. Both
    passage.solve and the reference _solve_state_sliding pass raw dist and jl
    through, so gravity and tension are at FULL value on the first Newton
    iteration of the first increment. lam ramps the contact targets alone.
  rule: >-
    Cutback cannot reduce a load that lam does not scale. A divergence whose
    first-iteration dU is insensitive to dlam is a LOAD or a model problem,
    never a step-size problem, and cutting further is wasted work. Read what
    the kernel does with lam before writing a load-path diagnosis: the first
    one written here assumed a proportional ramp that does not exist.
  detect: test_assemble_does_not_scale_loads_by_lam
  refs: [nlfea_v4.py, rebuild/slay/solve/passage.py, slay_sliding_v0_4.py, docs/modules/T5_solve_spec.md]
  date: 2026-09-21

- id: L051
  area: physics
  class: finding
  symptom: >-
    120 MT lay tension diverged on the first Newton iteration at every
    stinger radius. Applied at SR6 instead of SR7, with nothing else changed,
    it converges: 0.5467/0.3985/0.2845 pct at R=70/85/105 against the
    reference program's 0.5274/0.3882/0.2790 and the paper's 0.46/0.38/0.32.
  cause: >-
    Our SR7 is a LOAD station with NO contact constraint, so the tension is
    applied to a free cantilever tip 9 m past the last roller on a straight
    unstressed pipe -- first Newton step 3.2 m. The reference applies its
    joint load at the last mesh node, at the last SR station's angle
    (slay_sliding_v0_4.py:541-544), and exempt_set makes that station a
    permanently active contact slot, so the tension lands on a held node.
  rule: >-
    A load applied at a free end of an initially straight geometrically
    nonlinear model has no stiffness to react it on iteration one. Check
    where the reference APPLIES a load, not just its magnitude and direction.
    The case-construction gap list had already recorded this end-condition
    difference as a thing to settle; it was not a detail, it was the blocker.
  detect: '-'
  refs: [rebuild/slay/physics/loads.py, rebuild/slay/scene/rollers.py, slay_sliding_v0_4.py, slay_overbend_v1_50.py, docs/modules/T5_solve_spec.md]
  date: 2026-09-21

- id: L052
  area: physics
  class: ruling
  symptom: >-
    D6 taken: the terminal stinger station is a bidirectional contact slot
    that also bears the lay tension. 120 MT converges at every radius.
    ORIGINALLY RECORDED as "does NOT reproduce -- +15 to +21 pct with the
    peak at SR6 instead of SR2". THAT COMPARISON WAS WRONG (see L062): it
    put the single solve's WHOLE-MODEL peak against the staged sequence's
    BAND peak. At the band metric D6 reads 0.5165/0.3876/0.2879 pct at
    R=70/85/105 against run_slay's 0.5271/0.3937/0.2903 -- about 1.5 pct
    low, and it does reproduce.
  cause: >-
    Removing the free cantilever removed the divergence. The terminal
    contact slot DOES over-constrain the tip -- the whole-model peak sits at
    SR6 (0.6290/0.4590/0.3320 pct, all at s=39.60) -- which is precisely why
    the reported band excludes the last three stinger rollers. Inside the
    band the tip artefact is not present and the result is sound.
  rule: >-
    bears_tension is ORTHOGONAL to role: a station may bear contact and
    carry the load, and load_station selects on the attribute -- a role test
    would match nothing and apply no load silently. Quote D6 results at the
    band metric; the whole-model peak is the tip artefact the band exists to
    exclude, and the two must never be compared with each other.
  detect: test_the_tension_station_is_also_a_contact_slot, test_there_is_no_unconstrained_overhang
  refs: [rebuild/slay/scene/rollers.py, rebuild/slay/physics/loads.py, slay_overbend_v1_50.py, docs/modules/T5_solve_spec.md]
  date: 2026-09-21

- id: L053
  area: solve
  class: finding
  symptom: >-
    A four-step staged solve -- displacements with all rollers
    bidirectional, then gravity with lift-off, then tension, then J2 --
    reproduces run_slay to within 1.7 pct at R=70/85/105 (0.5179/0.3884/
    0.2879 against 0.5271/0.3937/0.2903, 8 m, 120 MT, J2, band metric).
    ORIGINALLY RECORDED as beating a single proportional solve by +15 to
    +21 pct. IT DOES NOT: at the same band metric the single solve gives
    0.5165/0.3876/0.2879, within 0.3 pct of the staged result at every
    radius. The comparison was against a different metric (L062).
  cause: >-
    The staging matters for CONVERGENCE, not accuracy, and only where the
    geometry cannot react the load yet: 120 MT on a straight unstressed pipe
    with a free tip diverged on the first Newton iteration (L050, L051).
    Once D6 gave the terminal station a contact slot, the cold single solve
    converges too, and lands in the same place.
  rule: >-
    Build the geometry before applying the load that the geometry has to
    carry -- that is a convergence rule, not an accuracy claim, and it must
    not be quoted as one. The reported zone travels with the number: this
    result excludes SR5/SR6/SR7, SR6 carries MORE strain than the reported
    peak, so the headline is wrong without the zone beside it.
  detect: test_it_reproduces_the_reference_program, test_the_excluded_zone_is_load_bearing
  refs: [tools/stage_run.py, rebuild/tests/test_stage_run.py, slay_overbend_v1_50.py, docs/modules/T5_solve_spec.md]
  date: 2026-09-21

- id: L054
  area: process
  class: finding
  symptom: >-
    Read TABLE XIX's "OD (mm) 406.4" column as the COMPONENT's OD and
    concluded the paper thickens inward at fixed OD while ThickPipeBody
    thickens outward at fixed bore -- a 19-64 pct stiffness conflict. WRONG.
    406.4 is the PIPELINE OD, repeated across the case rows as a fixed
    parameter. Corrected by the user, same day, before any run.
  cause: >-
    A fixed parameter repeated in every row of a case table looks like a
    varying one. The disconfirming evidence was already in hand and in the
    paper: the computed constant-bore I/Ip for the 53 mm case is 3.248, and
    the paper states "approximately 3.2x the pipeline stiffness" and
    "WT = 53 mm, OD = 471 mm at constant ID = 364 mm. The 2.54x wall
    thickness increase is entirely outward". The number that would have
    caught it was sitting in the comparison table as the supposed error.
  rule: >-
    Check a derived quantity against the source's OWN stated derived value
    before calling it a discrepancy -- the paper quotes 3.2x stiffness and
    471 mm OD, both of which match constant bore. A column that does not
    change across the cases of a case table is a fixed parameter, not the
    variable. And a conflict found while scoping is a hypothesis: confirm it
    against prose, not against a table header.
  detect: '-'
  refs: [rebuild/component_spec.py, docs/modules/T9_components_spec.md]
  date: 2026-09-21

- id: L055
  area: process
  class: finding
  symptom: >-
    Paper Series 4 (GD-SH) and Series 5 (GD-TP + GD-SH) report Phase 2
    results in EVERY row; Series 3 (GD-TP) reports Phase 1.
  cause: >-
    Phase 1 is plastic bending at the first two roller boxes -- a single lay
    position, which T5 already solves. Phase 2 is elastic bend-unload as the
    pipe SLIDES over the mid-stinger rollers, which needs the sweep: T6, the
    L7 study layer, M5. Not built.
  rule: >-
    Read the PHASE label on a benchmark row before targeting it. A
    single-position solve compared against a Phase 2 target produces a wrong
    answer that converges. Order: GD-TP now, then T6, then GD-SH and the
    combination.
  detect: '-'
  refs: [docs/modules/T9_components_spec.md, docs/SLAY_BUILD_INSTRUCTION.md]
  date: 2026-09-21

- id: L056
  area: solve
  class: finding
  symptom: >-
    Sweeping the sliding passage BACKWARDS (negative shift) returns status
    'ok' with a 6.3-6.8 pct peak at x=-42.01, beyond SR6 in the free-tip
    region. The same shift=0 reads 0.5715 pct from a cold start and 6.3032
    pct after one backward step.
  cause: >-
    p = bn - shift, so a negative shift moves the roller's target toward the
    stinger and the model into a configuration it cannot reach. The sweep
    carries state forward and only breaks on status != 'ok', which never
    trips, so one bad step contaminates every later one. Step 0 also gets
    n_increments_step0=40 and pen_step0=1e8 against 20 and 1e4 later, so a
    backward first step is solved with the loose settings too.
  rule: >-
    The sliding sweep is FORWARD ONLY and must start from a cold state. A
    peak reported outside the roller span is the signature to check: the
    free tip is where a corrupted state shows first. Status 'ok' is not
    evidence -- G8 -- and a stateful sweep needs a per-step sanity bound on
    WHERE the peak is, not just whether it converged.
  detect: '-'
  refs: [slay_sliding_v0_4.py, docs/modules/T9_components_spec.md]
  date: 2026-09-21

- id: L057
  area: measure
  class: finding
  symptom: >-
    Series 3 thick-pipe cases peak at SR2 (x=-7.98) at every shift, and the
    peak falls monotonically over the reference program's default schedule:
    0.5715/0.5530/0.5273/0.5168/0.5074 pct over shifts 0-4 (A3, R=85,
    100 MT).
  cause: >-
    The default placement puts the component's stinger-side edge exactly on
    SR2 and SR2 is where the Phase 1 peak lives, so advancing the pipe moves
    the component away from it. BUT the schedule covers 3.195 m, only 40 pct
    of one 7.988 m roller spacing, and the program refuses a shift large
    enough to reach the next roller. Whether the peak rises again as the
    component approaches SR3 was never observed because the run cannot get
    there.
  rule: >-
    A monotonic trend over 40 pct of a span is not a maximum. RULED 21 Sep
    2026: sequential sliding IS part of the physics sequence (Step 6), and
    the reported peak is taken across the whole passage, not at the start
    position. An earlier version of this lesson concluded no sweep was
    needed; that conclusion was drawn from the truncated schedule and is
    withdrawn. State the sweep's reach beside any passage result.
  detect: '-'
  refs: [docs/modules/T9_physics_sequence.md, docs/modules/T9_components_spec.md, slay_sliding_v0_4.py]
  date: 2026-09-21

- id: L058
  area: measure
  class: finding
  symptom: >-
    The paper's 1000 mm thick component meshes as ONE element at the
    standard 2xOD element length. Refining raises the peak monotonically and
    it has not converged: 1 elem 0.5715, 2 elems 0.6118, 3 elems 0.6458,
    5 elems 0.6640, 7 elems 0.6739 pct (A3, R=85, 100 MT, shift 0).
  cause: >-
    A single element cannot represent bending WITHIN the component, and the
    component exists to create a bending-stiffness discontinuity. The repo's
    own M3 note already required at least 3 elements across a component; the
    reference program's default mesh does not meet it, and neither does the
    paper's, which states its mesh is for relative comparison only.
  rule: >-
    Count the elements INSIDE a component before quoting its number. Two
    claims must be kept apart: reproducing the reference (run at the
    reference's own 2xOD mesh) and predicting the strain (needs refinement
    and a convergence check). Agreement at a coarse mesh can owe something
    to both sides being under-resolved. RULED 21 Sep 2026: 2 elements across
    the component, element length not below 1xOD -- 0.4993 m at 1.23xOD --
    accepted as roughly 10 pct below the converging trend, deliberately.
  detect: '-'
  refs: [docs/modules/T9_physics_sequence.md, docs/modules/T9_components_spec.md, slay_sliding_v0_4.py]
  date: 2026-09-21

- id: L059
  area: model
  class: defect
  symptom: >-
    With a vessel-side sweep buffer, build_problem raised "VR5 is at
    s=-40.0000 and the nearest header node is at -39.8000. A restraint needs
    a node under it." Every prior model had worked.
  cause: >-
    build_model registers PIPE-LO at the Scene extent and does NOT register
    roller stations. At margin=0 the extent's vessel end coincided exactly
    with the FIXED station, so the anchor had a node BY COINCIDENCE. Adding
    margin_vessel moved the end and the mesh grid no longer landed on it.
    boundary_conditions demands a node within 1e-6 m.
  rule: >-
    A restraint's node must be REQUESTED, never inherited from a boundary
    that happens to coincide with it. study.sweep._required_stations passes
    every FIXED station through build_model's extra_stations, which is the
    documented route for a point an outside layer needs a node at. Contact
    stations are deliberately NOT included -- they are interpolated inside
    an element (G1).
  detect: test_the_anchor_keeps_a_node_once_the_end_moves
  refs: [rebuild/slay/study/sweep.py, rebuild/slay/model/assemble.py, rebuild/slay/physics/loads.py]
  date: 2026-09-22

- id: L060
  area: solve
  class: ruling
  symptom: >-
    Sweep length was previously chosen by hand (the reference's default
    d_shift=1.0, n_shifts=4 -- 3.195 m, 40 pct of a roller spacing) and the
    truncation twice produced a monotonic trend that was read as a maximum.
  cause: >-
    A passage length that does not follow from the component cannot be
    known to cover the traverse. The reference also caps at ~90 pct of one
    spacing regardless of n_vr, because its buffer is bought with roller
    count rather than length.
  rule: >-
    RULED 22 Sep 2026. sweep_length = L_comp + clear_before + clear_after,
    defaults 1.0 m each and adjustable: the component starts with its
    LEADING edge clear_before short of SR2 and finishes with its TRAILING
    edge clear_after past it. The swept length is added at the VESSEL end
    (build_scene(margin_vessel=)) and nowhere else -- material leaves the
    model at the stinger end and needs nothing there. check_reach refuses a
    sweep the model cannot feed rather than reporting a number for a station
    bearing on nothing.
  detect: test_sweep_length_is_the_component_plus_both_clearances, test_the_swept_length_is_added_at_the_vessel_end_only, test_a_sweep_the_model_cannot_feed_is_refused
  refs: [rebuild/slay/study/sweep.py, rebuild/slay/scene/scene.py, rebuild/tests/test_sweep.py]
  date: 2026-09-22

- id: L061
  area: physics
  class: ruling
  symptom: >-
    The first sweep buffer was bare pipe of length exactly sigma, hanging
    off the back of the fully-fixed anchor with nothing under it. At 20 m of
    feedstock that is a cantilever carrying real bending stress, and at
    exactly sigma the pipe's tail arrives at the last vessel roller as the
    sweep ends.
  cause: >-
    A buffer is feedstock, not structure. Left unsupported it develops
    stress of its own; left exactly sigma long it collides with the roller
    it was meant to feed past; left with the case material it can yield, and
    a plastic hinge in it is carried into every later position by the
    chained state.
  rule: >-
    RULED 22 Sep 2026, three parts. (1) Buffer = sweep + TAIL_CLEAR, default
    1.0 m, so the tail and its support stay clear of the last vessel roller
    for the whole passage. (2) A uy-ONLY support under the tail, standing
    for the deck rollers behind the tensioner -- ux and rz stay free or the
    support fights the feed it exists to allow. (3) elastic_spans forces the
    buffer to a linear elastic material whatever the case runs. Note
    elastic_spans is DISTINCT from elastic_zones, which is still only
    carried: applying those would move every validated number, so the two
    must be unified deliberately rather than by a rename.
  detect: test_the_buffer_is_the_sweep_plus_tail_clearance, test_the_buffer_tail_is_vertically_supported_and_free_to_feed, test_the_buffer_never_yields
  refs: [rebuild/slay/study/sweep.py, rebuild/slay/physics/loads.py, rebuild/slay/physics/problem.py, rebuild/slay/solve/kernel.py]
  date: 2026-09-22

- id: L062
  area: measure
  class: defect
  symptom: >-
    Recorded that the four-step staged sequence beat a single proportional
    solve by "+15 to +21 pct, with the peak displaced to SR6". Re-measured
    22 Sep at matched metrics the two agree within 0.3 pct at every radius.
    The claim propagated into L052, L053, RESULTS.md 1.1-1.2, T5 spec 5d
    and 5e, and TRIAL_LOG T010 and T012.
  cause: >-
    The single solve was reported with Result.peak_strain() -- the
    WHOLE-MODEL peak, which lands at s=39.60 inside the excluded tip where
    D6's terminal contact slot over-constrains -- and the staged sequence
    with peak_in_zone(), the BAND peak excluding SR5/SR6/SR7. Two different
    quantities, differing by exactly the tip artefact the band exists to
    remove. Both runs were correct; only the comparison was not.
  rule: >-
    A comparison is between two numbers computed the SAME way. Record the
    metric beside every peak -- whole-model or band, and which stations the
    band drops -- and refuse to difference two peaks whose zones differ. A
    15-21 pct discrepancy that happens to equal a known artefact is a
    reporting bug before it is a physics finding.
  detect: test_staged_and_single_solve_agree_at_the_same_metric
  refs: [docs/RESULTS.md, docs/modules/T5_solve_spec.md, tools/stage_run.py, rebuild/tests/test_stage_run.py]
  date: 2026-09-22

- id: L063
  area: measure
  class: ruling
  symptom: >-
    A plain-pipe passage read in MATERIAL coordinates appears to have its
    peak frozen at one element (s=9.28 at every position) while the value
    decays 13 pct over 4 m of travel. It reads as a solver defect. Chasing
    it cost four wrong hypotheses: a non-sliding tension point (disproved,
    identical to 4 decimals), a soft chained penalty (disproved, targets met
    to 1e-13 at 1e4, 1e6 and 1e8 alike), the terminal station's slot
    degenerating onto the tip node (disproved, survives a stinger margin),
    and the carried active set (disproved, reset changes nothing).
  cause: >-
    Model `s` is a MATERIAL coordinate: it labels a point on the pipe and
    travels with it. After the pipeline advances by `shift`, material `s`
    sits at station position `s + shift`, so a strain reported at material
    `s` is at a DIFFERENT PLACE ON THE STINGER at every position. A table of
    material-s peaks down a passage compares nothing to nothing. The real
    cause of the decay was the carried PLASTIC STATE -- isolated by resetting
    it, which flattens the passage -- i.e. accumulated yielding as material
    traverses the stinger, which is the effect sequential sliding exists to
    capture, not a defect at all.
  rule: >-
    Report every passage quantity in STATION coordinates, carry the material
    coordinate beside it, and apply the reporting zone on the station value.
    Before calling a passage trend a defect, reproduce it LINEAR ELASTIC:
    there a plain pipe on fixed rollers must be invariant, so anything left
    is either discretisation or real material history.
  detect: test_the_zone_cuts_on_station_not_material, test_station_strains_are_keyed_by_place_not_by_material, test_a_plain_elastic_passage_is_invariant_in_station_space
  refs: [rebuild/slay/report/passage.py, tools/slide.py]
  date: 2026-09-28

- id: L064
  area: measure
  class: finding
  symptom: >-
    The GD-TP passage envelope depended on the sweep step over a 20 pct
    range: 0.4715 pct at a 2.0-element step, 0.4772 at 1.0, 0.5482 at 0.5,
    0.5678 at 0.25. Refining the step moved the answer and gave no sign of
    having converged.
  cause: >-
    The envelope sits where the component's LEADING EDGE crosses a roller --
    peak location converging on lead = 9.016 m against SR2 at 9.000 -- which
    is not a step boundary. Any step steps over it; a coarse step misses it
    by 16 pct. Refining the step everywhere pays for resolution across the
    whole passage to buy it at one travel.
  rule: >-
    Solve the edge crossings exactly. `study.sweep.critical_shifts` returns
    the travels at which either component edge sits on a contact station and
    the schedule includes them whatever the step, on by default. Measured,
    that makes the envelope step-INDEPENDENT: 0.5731/0.5727/0.5722/0.5689 pct
    across the same 4x range of step, a 0.7 pct spread instead of 20, and
    found in 5 positions rather than 16.
  detect: test_critical_shifts_are_the_edge_crossings, test_the_schedule_carries_the_critical_shifts_whatever_the_step
  refs: [rebuild/slay/study/sweep.py, tools/slide.py]
  date: 2026-09-28

- id: L065
  area: physics
  class: finding
  symptom: >-
    Open item from the T4 spec: the contact slot interpolates LINEARLY
    between the two bracketing nodes, where a beam's transverse displacement
    is really cubic. Estimated at about 1 mm and raised rather than changed.
  cause: >-
    Now measured on a plain LINEAR ELASTIC passage, where station-space
    strain must be invariant. Stepped a WHOLE element it holds to 0.03-0.08
    pct at SR1-SR4. Stepped HALF an element the values alternate -- SR1
    0.1947, 0.1863, 0.1947, 0.1863, 0.1948 pct -- with no trend: a contact
    point interpolated to mid-element is softer than one sitting on a node.
    Worth 4.40 pct at SR1, 0.83 pct at SR2, 0.26 at SR3, 0.04 at SR4, at
    2xOD elements.
  rule: >-
    The linear slot costs up to 4.4 pct at the first stinger roller when the
    contact point falls mid-element, and that is now a number rather than an
    estimate. It is twenty times smaller than the 16 pct cost of
    undersampling the envelope (L064), so refining the step is right and
    Hermite interpolation stays an open item -- but a passage whose positions
    all sit mid-element carries this bias systematically.
  detect: test_a_plain_elastic_passage_is_invariant_in_station_space
  refs: [rebuild/slay/physics/contact.py, docs/modules/T4_physics_spec.md, tools/slide.py]
  date: 2026-09-28

- id: L066
  area: physics
  class: defect
  symptom: >-
    Adding contact_surface='bottom' moved the GD-TP passage envelope by
    -14.51 pct, against -1.2 pct at the start position of the same passage
    and -0.7 to -1.0 pct on plain pipe at three radii. The envelope also
    jumped from shift 1.000 to shift 2.000 -- from the LEADING edge crossing
    SR2 to the TRAILING edge crossing it.
  cause: >-
    study.sweep.critical_shifts computed the edge-crossing travels from the
    station's own s_arc, while the contact slots had moved to
    s_arc + (R_eff - R)*theta. Under 'bottom' the schedule therefore solved
    travels the contact never saw: at SR2 the crossing is 53 mm later than
    the schedule believed, the leading-edge peak was never sampled, and the
    max fell back to a different position. The physics change was about
    1 pct; the other 13 was a sampling artefact of my own making.
  rule: >-
    dn and the material position under a station are a HARD PAIR, and so is
    anything that SCHEDULES against that position. physics.contact.
    station_material is the single owner of the mapping; contact_targets and
    critical_shifts both read it, neither restates it. After the fix the
    envelope delta is -1.36 pct and lands at shift 1.053 = 1.000 + 0.053, the
    SR2 correction exactly.
  detect: test_the_edge_crossings_follow_the_contact_surface, test_the_crossing_offset_is_the_material_correction
  refs: [rebuild/slay/physics/contact.py, rebuild/slay/study/sweep.py]
  date: 2026-09-28

- id: L067
  area: measure
  class: defect
  symptom: >-
    The +/-2xOD junction probe returned the same element, and therefore
    exactly the same strain and moment, as the junction probe itself. A row
    labelled 2xOD carried the 1xOD number.
  cause: >-
    Probes were answered by "the element CONTAINING the requested point". At
    the ruled 2xOD mesh, element midpoints sit at ODD multiples of 1xOD from
    a junction, so no element centre is ever at 2, 4 or 6xOD from one and
    every requested offset falls between two midpoints. The containing
    element can be up to half an element away, which at 2xOD is a full
    diameter.
  rule: >-
    Interpolate between the two nearest element midpoints INSIDE the
    requested point's own contiguous section run -- never across the step,
    where strain is genuinely discontinuous. Where the run ends first (the
    junction itself, or an offset that overshoots a short body) clamp to the
    end midpoint and set `clamped`. Every probe carries `s_elem`, so a reader
    can always see where the number really came from.
  detect: test_a_probe_lands_at_the_offset_it_is_labelled_with, test_offsets_on_one_side_are_distinct_values
  refs: [rebuild/slay/report/junction.py]
  date: 2026-09-28

- id: L068
  area: solve
  class: ruling
  symptom: >-
    The rebuild had no bending-moment recovery at all -- Result carried
    strains only -- so nothing downstream could report a moment, and the
    junction dataset was blocked on it.
  cause: >-
    Ported from the reference _moment_profile, which carries a v1.48 fix
    worth knowing: M is evaluated at BOTH Gauss points, each with its OWN
    curvature kappa(xi_g) and its OWN stored plastic state. Pairing the
    element-mean curvature with the GP0-only plastic state gave a spurious
    single-element moment collapse -- about 500 kNm where ~1330 kNm was
    right -- because near a contact node the two Gauss points hold very
    different plastic strain. Strain never showed it: strain does not read
    the plastic state.
  rule: >-
    Element moment is the mean of the two self-consistent Gauss-point
    moments, reported at the element midpoint -- the same grid the strains
    use, so the two are comparable element for element. NOT nodal
    extrapolation: a section moment saturates plastically, so extrapolating
    past the Gauss points returns values above section capacity. An element
    whose constitutive law is unrecognised RAISES rather than falling back
    to E*I*kappa, which would be wrong where it mattered and plausible
    everywhere.
  detect: test_elastic_moment_is_EI_kappa_on_a_solved_arc, test_moment_and_strain_agree_through_the_curvature
  refs: [rebuild/slay/solve/passage.py]
  date: 2026-09-28

- id: L069
  area: plot
  class: ruling
  symptom: >-
    The first component-on-stinger figure drew the strain trace as one
    continuous line straight through each junction, so the 4.3x step read as
    a steep ramp into the component rather than as a discontinuity.
  cause: >-
    Strain STEPS across a section change -- the same moment on two section
    moduli gives two strains -- so a line drawn through it asserts a gradient
    the model does not have. report.junction already refuses to interpolate
    across the step for exactly this reason; the figure was doing what the
    extraction forbids.
  rule: >-
    Break every profile trace at a section change: group elements into
    contiguous runs of one OD and plot each run separately, so the gap in the
    line IS the discontinuity. A figure may not assert continuity the data
    layer declines to assert. Also shade the excluded reporting band -- the
    D6 tip artefact is the tallest feature on an unshaded plot and reads as
    the answer.
  detect: '-'
  refs: [tools/plot_stinger.py, rebuild/slay/report/junction.py]
  date: 2026-09-28

- id: L070
  area: plot
  class: defect
  symptom: >-
    In the component-on-stinger figure the component was drawn a full metre
    short of the roller it was sitting on. Read off the plot, the peak strain
    appeared to occur BEFORE the component reached SR2. Spotted by eye, from
    the figure, not by any check.
  cause: >-
    The world mapping was x = -(s + u_s), with no shift term. The solver
    never applies the rigid-body translation of a pipeline advancing down the
    stinger, and it is RIGHT not to: sliding a pipe along its own axis
    produces no strain, so nothing in the model drives it, and the shape and
    strain are correct without it. But the picture is in world coordinates,
    where that translation is exactly what puts the material under its
    roller. Measured at shift = 1.000 m: SR2 sits at x = -8.983 and the
    material it constrains was drawn at -7.998 -- every station off by the
    shift, to three decimal places.
  rule: >-
    A figure of a swept position maps material to world as
    x = -(s + shift + u_s). The shift is a property of the PICTURE, not of
    the solution, and its absence is invisible in every residual and every
    strain check -- only the drawing shows it. After the fix the leading edge
    draws at -8.998 against SR2 at -8.983, the 15 mm residual being the
    pipe's own tangential displacement.
  detect: test_the_drawn_material_sits_under_its_own_roller, test_omitting_the_shift_is_what_breaks_it, test_the_pipe_polyline_carries_the_shift_too
  refs: [tools/plot_stinger.py, rebuild/tests/test_plot_placement.py]
  date: 2026-09-29

- id: L071
  area: plot
  class: ruling
  symptom: >-
    Joining element strains at their MIDPOINTS left a half-element gap
    between the last element of a section run and the junction, so the
    discontinuity read as missing data rather than as a step.
  cause: >-
    Strain is piecewise constant per element, so a line through midpoints is
    already an interpolation, and it cannot reach the element boundary where
    the section changes.
  rule: >-
    Draw each element over its OWN EXTENT -- a staircase, not a polyline
    through midpoints. Adjacent runs then meet exactly at the junction and
    the only gap left is the vertical jump, which IS the discontinuity.
  detect: '-'
  refs: [tools/plot_stinger.py]
  date: 2026-09-29

- id: L072
  area: plot
  class: defect
  symptom: >-
    On the all-steps passage figure the "outside the reporting band" shading
    covered the entire VESSEL side of the model -- the half that is IN the
    band -- and left the excluded stinger tip unshaded.
  cause: >-
    The span was drawn from fx(min(s_material)) to the cut. Minimum MATERIAL
    s is the vessel end, which maps to the most POSITIVE world x, so the
    shading ran the wrong way across the model. The zone drops the last three
    STINGER rollers: high s, and therefore the most NEGATIVE x.
  rule: >-
    Take the drawn extreme in the coordinate being drawn: min over fx(s), not
    fx over min(s). The world mapping reverses sign, so an extremum in
    material coordinates is the opposite extremum in world coordinates.
  detect: test_the_excluded_band_covers_the_stinger_end_not_the_vessel_end
  refs: [tools/plot_stinger.py, rebuild/tests/test_plot_placement.py]
  date: 2026-09-29

- id: L073
  area: plot
  class: ruling
  symptom: >-
    The close-up drew the pipeline as a polyline with a thick coloured
    segment on it. That said nothing about how deep a component was, which
    side of the pipe it sat on, or -- for GD-SH -- that it hangs BELOW the
    pipe rather than replacing part of it. The shroud had no outline at all.
  cause: >-
    One drawing rule was being used for two physically different things. A
    body that changes the SECTION replaces the pipe wall over its span; a
    body that only changes the CONTACT sits outside the pipe and changes
    nothing structural.
  rule: >-
    Ask the assembly which kind it is and draw accordingly. section_at(x)
    with owner != pipe means a section-changing body: draw it at its own OD
    about the centreline. contact_at(x) with owner != pipe while section_at
    stays pipe means a contact-only body: draw it from the pipe's own bottom
    down to contact_at(x).y. Drawing a shroud at a section OD would invent a
    stiffness the model does not have -- its stiffness_ratio is 1.0 and says
    so. All offsets follow the pipe's LOCAL NORMAL, not the vertical: the
    pipe turns 0.64 rad over the stinger, so a wall drawn by adding OD/2 to
    y is 20 pct narrow at SR7.
  detect: test_a_section_changing_body_is_drawn_at_its_own_OD, test_a_contact_only_body_is_NOT_drawn_at_a_section_OD, test_the_offset_is_perpendicular_not_vertical
  refs: [tools/plot_stinger.py, rebuild/tests/test_plot_placement.py]
  date: 2026-09-29

- id: L074
  area: plot
  class: defect
  symptom: >-
    The first shroud outline had a 95 mm step where the geometry goes to
    zero, and the drawn body was visibly the wrong shape at its taper ends.
  cause: >-
    The outline was sampled at the STRUCTURAL mesh nodes. At the ruled 2xOD
    density a 6.096 m shroud spans seven nodes and its taper ends fall
    BETWEEN them, so the drawing interpolated straight past the geometry it
    was supposed to show.
  rule: >-
    A drawing grid is not the structural mesh. Interpolate the deformed
    centreline finely and ask the assembly at every sample, so an outline
    follows the component rather than the mesh that happens to carry it.
    After the fix the shroud ring runs 0.0036 to 0.2032 m against a true 0
    to 0.2032.
  detect: test_the_outline_is_resampled_off_the_component_not_the_mesh, test_a_contact_only_body_is_NOT_drawn_at_a_section_OD
  refs: [tools/plot_stinger.py]
  date: 2026-09-29

- id: L075
  area: process
  class: ruling
  symptom: >-
    Asked for two stinger figures, the route taken was the GENERATING plotter:
    it rebuilt the Scene and re-swept the whole passage for each figure, and
    then the scalars quoted beside them were solved a THIRD time. Every one of
    those scalars -- both envelopes, both shifts, both stiffness ratios, both
    junction counts -- was already sitting in dataset_components.csv. The user
    asked why it had taken so long and whether we were not supposed to be
    plotting from a fixed schema. We were.
  cause: >-
    Two causes, and only one was carelessness. The reflex reached for the tool
    that could already draw the figure. But the schema plotter could not have
    drawn it either: the case-row contract deliberately excludes profiles, and
    no per-position artifact existed. A rule that says "plot from the schema"
    with no schema for what is being plotted is not a rule anyone can follow.
  rule: >-
    G13. A figure reads an artifact and never generates one. Generating and
    drawing are separate programs -- tools/emit_profile.py solves and writes,
    tools/plot_from_schema.py reads and draws, importing nothing from slay. A
    quantity a figure needs and no contract carries is a MISSING COLUMN to be
    added to a schema, never a solver call added to a plotter. Where a rule
    cannot be followed, fix the gap rather than the person.
  detect: test_the_plotter_imports_nothing_from_slay, test_the_five_panel_figure_draws_from_the_files_alone
  refs: [docs/SLAY_BUILD_INSTRUCTION.md, tools/plot_from_schema.py, tools/emit_profile.py, rebuild/slay/report/profile_schema.py]
  date: 2026-09-29

- id: L076
  area: measure
  class: ruling
  symptom: >-
    Designing the profile artifact, the obvious move was one big table. It
    does not work: geometry belongs to samples along the pipe, strain belongs
    to ELEMENTS and is piecewise constant over their extents, and a roller
    belongs to neither and does not move when the pipe does. One table forces
    either a discriminator column -- three tables pretending to be one -- or
    duplicating a node's coordinates onto every element that touches it.
  cause: >-
    Treating "a profile" as a single grain when it is three.
  rule: >-
    One table per grain, one sidecar per table, one version across all three,
    joined by case_id. Declare the grain on every field (Field.per: case,
    position, sample) and make it CHECKABLE: profile.write refuses a file
    whose per=case column is not constant, or whose per=position column moves
    within a step. Both failures would otherwise parse cleanly and draw a
    plausible figure of the wrong thing.
  detect: test_write_refuses_a_case_column_that_moves, test_write_refuses_a_position_column_that_moves_within_a_step, test_grains_are_what_they_claim
  refs: [rebuild/slay/report/profile_schema.py, rebuild/slay/report/profile.py]
  date: 2026-09-29

- id: L077
  area: plot
  class: defect
  symptom: >-
    The first figure drawn from the artifact had panels 2 and 5 running
    right-to-left while panels 1, 3 and 4 ran left-to-right, and no roller
    appeared in the close-up at all.
  cause: >-
    set_xlim(max, min) reversed two panels, and the rollers were drawn at
    zorder 2, under the pipe-wall fill at zorder 3. Both looked entirely
    plausible: a mirrored close-up of a curve is still a curve, and "no roller
    in this window" is a thing that can legitimately happen.
  rule: >-
    Every panel on a shared quantity runs the same direction, and anything
    drawn ON the pipe goes ABOVE the fills that represent it. A mirrored axis
    is the same class of error as getting the world sign backwards (L070) --
    it produces a picture that cannot be told from the right one by eye.
  detect: test_every_panel_runs_the_same_way_along_x, test_the_rollers_are_drawn_above_the_pipe_fills
  refs: [tools/plot_from_schema.py, rebuild/tests/test_plot_from_profile.py]
  date: 2026-09-29

- id: L078
  area: measure
  class: ruling
  symptom: >-
    body_peak_strain was 0.0 for every GD-SH case, with step -1 and a blank
    station, for the family whose pipe carries the HIGHEST strain in the
    dataset. It parsed, it plotted, and it was wrong in the one direction
    nobody checks: a zero reads as nothing happening.
  cause: >-
    report.passage.body_peaks asks the junction rows which elements are on
    the body, because for a section-changing component that IS a question
    about sections. A shroud steps no section, so the answer was "none". The
    whole point-probe apparatus -- junction, +/- 2/4/6 x OD -- has nothing to
    probe AT on a body whose effect is spread over its length.
  rule: >-
    A body that steps no section needs a reporting unit that is a REGION, not
    a point. Five of them, after the reference: the catenary-side taper and
    beyond, the deep section in thirds from the catenary side, then the
    vessel-side taper and beyond. The body peak for such a body is taken over
    its FOOTPRINT, tapers included. GD-SH then reports 0.6868 pct instead of
    0.0.
  detect: test_the_peak_lands_in_X2, test_case_columns_are_all_declared, test_a_section_changing_body_has_no_regions
  refs: [rebuild/slay/report/regions.py, rebuild/tests/test_regions.py, tools/dataset.py]
  date: 2026-09-30

- id: L079
  area: measure
  class: finding
  symptom: >-
    The region ratios did not match the reference at first look. X3/X2 came
    out 0.784 against its stated 65-75 pct band, and it was tempting to
    report that as a disagreement.
  cause: >-
    Mesh, not physics. At the ruled 2xOD density (G10) a third of the deep
    section is 1.354 m and an element is 0.813 m, so X2 and X3 hold TWO
    elements each and X4 holds ONE. A ratio between regions of one and two
    elements is reporting the mesh.
  rule: >-
    A region scheme must carry its element count. Refined 2xOD -> 1xOD ->
    0.5xOD the ratio runs 0.784 -> 0.749 -> 0.744, converging INSIDE the
    reference band, and X4/X2 holds at about 0.70 throughout. Record
    n_elements per region and say so where it is thin, rather than quoting a
    ratio the mesh chose. Separately, refinement moves the model peak off X2
    onto the catenary-side taper inside X1 (frac_of_x2 1.022 at 0.5xOD),
    which is why each region peak also records whether it landed on the
    shroud footprint -- X1 lumps a taper together with plain pipe.
  detect: test_case_columns_are_all_declared
  refs: [rebuild/slay/report/regions.py, docs/TRIAL_LOG.yaml]
  date: 2026-09-30

- id: L080
  area: process
  class: defect
  symptom: >-
    DATASET.md stated "Date | 28 September 2026" on a file produced on the
    30th, and reported the matrix as taking 0.17 h when it had taken 1.06 h
    of solving. Both numbers were in the header a reader would quote.
  cause: >-
    The date was a hardcoded string. The elapsed time was wall clock of the
    run that happened to write the file, so every --resume reset it and the
    figure was wrong by however many times the run had been interrupted.
    Neither was noticed while the runner completed in one pass; resume made
    the second one visible and the first was never true.
  rule: >-
    A file states its own provenance from the run, never from a literal. Time
    that must survive a resume is summed from the per-case `seconds` column,
    which is carried forward with the rows, not measured from the start of
    the current process. A file that states its provenance wrongly is worse
    than one that omits it, because the wrong value gets quoted.
  detect: '-'
  refs: [tools/dataset.py, docs/dataset/DATASET.md]
  date: 2026-09-30

- id: L081
  area: solve
  class: ruling
  symptom: >-
    Three of the 200 matrix cases died with CUTBACK EXHAUSTED at lam=0.0000,
    all in one corner: 168.3 mm pipe, 12 m spacing, 160 MT, R = 60-70 m.
    Smallest pipe, widest spacing, highest tension, tightest radius -- every
    axis pushing the same way.
  cause: >-
    `solve` ramps the contact targets by lam but hands over tension and
    gravity at FULL VALUE from Newton iteration 1, because the kernel does
    not scale loads and that is deliberate (L050). So a cutback shrinks the
    targets and nothing else, and lam=0.0000 means the very first step was
    already beyond reach. On a straight unstressed pipe there is no
    geometric stiffness to react a lay tension with, and ramping cannot
    create any.
  rule: >-
    Bend the pipe onto the rollers FIRST, then load it. Three elastic steps
    carrying state forward -- every roller held with no loads, then the ruled
    one-sided set with gravity, then tension -- and chain the real solve onto
    that. This is the first three steps of the staged sequence that
    reproduces the reference to within 1.7 pct (T5 5e). The OPPOSITE order
    was tried and rejected: settling the loads first with the targets held
    diverges above about 15 MT (L050/L051). Seeding is a FALLBACK, applied
    only where the direct solve failed and only where there is no carried
    state, so a case that converged before keeps its exact load path -- 7
    sampled cases reproduce to 0.00e+00 pct. The seed is elastic throughout
    because J2 is path-dependent and yielding during seeding would write a
    history the real load path never took.
  detect: test_the_hard_corner_fails_without_a_seed, test_the_hard_corner_converges_with_a_seed, test_a_case_that_converges_directly_is_untouched, test_the_seed_is_elastic_throughout
  refs: [rebuild/slay/study/sweep.py, rebuild/slay/scene/scene.py, rebuild/tests/test_seed_state.py]
  date: 2026-09-30

- id: L082
  area: model
  class: finding
  symptom: >-
    The three frame archetypes -- ILS-EAST, ILS-EASB, ILS-ILT -- fail with
    the same CUTBACK EXHAUSTED message as the R=60/70 corner, which invited
    treating them as the same defect. Seeding does not fix them.
  cause: >-
    Not the same defect at all. ILS-EAST fails at seeding STEP 1, with every
    roller held, elastic, and NO LOADS APPLIED, and the kernel warns "Matrix
    is exactly singular". A singular stiffness matrix under zero load is a
    MECHANISM in the model -- an unconstrained degree of freedom -- not a
    load the solver cannot reach. Its model carries GD-Con connector and ST
    stalk elements that the pipeline-only archetypes do not.
  rule: >-
    Read the failure, not the message. Two defects sharing a status string
    are still two defects, and a fix aimed at the wrong one would have been
    reported as a partial success. The test that separates them is cheap:
    strip every load and see whether it still fails.
  detect: '-'
  refs: [rebuild/slay/study/sweep.py, docs/dataset/dataset_components.csv]
  date: 2026-09-30

- id: L083
  area: solve
  class: finding
  symptom: >-
    After seeding fixed two of the three corner cases, T060 still failed --
    and an earlier check had appeared to show it converging. That check was
    wrong: it ran PLAIN PIPE with T060's stinger parameters, while T060 is a
    gd-tp case with a component. The label said T060 and the run was not.
  cause: >-
    T060 is not reachable. At 160 MT on a 168.3 x 11.0 mm section the lay
    tension ALONE is 80.2 pct of first yield (289 of 360 MPa); add the
    bending a 60 m radius imposes and the elastic demand is 162 pct. The
    section is fully plastic and has no bending stiffness left to react the
    load. That is plastic collapse, a physical limit, not a solver defect.
    The baseline case sits at 12.9 pct for comparison.
  rule: >-
    Name a check after what it actually runs, and compute the physical
    reason rather than quoting the solver's. slay.physics.capacity annotates
    a failure with its membrane utilisation where that utilisation is high,
    and SAYS NOTHING where it is not -- the silence is the load-bearing
    half, because it keeps a genuine solver defect visible as one. The three
    frame archetypes fail at 12.9 pct and get no message, which is how they
    stay separated from this (L082).
  detect: test_the_hard_corner_gets_a_physical_explanation, test_a_comfortable_case_gets_NOTHING, test_the_threshold_separates_the_matrix_as_it_actually_ran
  refs: [rebuild/slay/physics/capacity.py, rebuild/tests/test_capacity.py, tools/dataset.py]
  date: 2026-09-30

- id: L084
  area: solve
  class: defect
  symptom: >-
    No lay position of any EA archetype had ever converged. ILS-EAST,
    ILS-EASB and ILS-ILT all reported CUTBACK EXHAUSTED at lam=0.0000 with
    the kernel warning "Matrix is exactly singular", even with every roller
    held, elastic, and no loads applied at all.
  cause: >-
    TWO defects stacked, either fatal alone and both looking identical from
    outside. First, Problem splits connectors out of `elements` into
    `connectors`, and mesh_of_problem builds the kernel mesh from `elements`
    alone -- correct, since a corotational beam would take its stiffness from
    its own length and a connector's length is geometry -- but nothing put
    the connectors back, so their 6x6 was never assembled. Second, a
    connector element has its OWN two nodes and ASSOCIATIONS are what fasten
    them to the real pipeline and frame nodes; solve.newton applies them and
    solve.passage never did. Between them the frame was 18 elements attached
    to nothing.
  rule: >-
    A Problem must carry everything a solver needs to pose it. It gained
    part_index so associations can be resolved into DOFs without a Model, and
    solve.passage now assembles connector stiffness and applies the declared
    ties through the SAME constraint_rows code the static solver uses -- one
    rule read once, rather than two solvers enforcing different joints on the
    same geometry. solve.newton already named the symptom in its own error
    text: "a Group B model with its associations unapplied looks exactly like
    this". Reading that would have saved the diagnosis.
  detect: test_every_EA_archetype_now_solves_its_first_position, test_the_ties_exist_and_reach_both_bodies, test_constraint_rows_agree_between_the_model_and_problem_paths, test_a_model_without_a_frame_has_neither_connectors_nor_ties
  refs: [rebuild/slay/solve/passage.py, rebuild/slay/solve/kernel.py, rebuild/slay/solve/constraints.py, rebuild/slay/physics/problem.py, rebuild/tests/test_passage_connectors.py]
  date: 2026-09-30

- id: L085
  area: solve
  class: defect
  symptom: >-
    Adding connector stiffness, the first attempt moved the penalty scale to
    AFTER the connectors -- "so the penalty is scaled against the stiffness
    the structure actually has". The first residual came out at 1.0e18 and
    the solve returned NaN.
  cause: >-
    A connector's 6x6 is built at 1 x OD, so its diagonal is about 1.3e10
    against the beams' 3e6. Folding it into p_scale multiplied the penalty by
    four orders of magnitude. penalty.py's multiplier was tuned by sweep
    against the BEAM stiffness and means nothing against any other basis.
  rule: >-
    A tuned constant carries its basis with it. Changing what a multiplier
    multiplies is changing the constant, even when the new basis is the more
    defensible one. p_scale is taken before the connectors are added.
  detect: test_the_penalty_is_scaled_on_the_BEAM_stiffness, test_every_EA_archetype_now_solves_its_first_position
  refs: [rebuild/slay/solve/passage.py, rebuild/slay/solve/penalty.py, rebuild/tests/test_passage_connectors.py]
  date: 2026-09-30

- id: L086
  area: plot
  class: defect
  symptom: >-
    The first EA-ST stinger figure had a strain trace that zig-zagged
    violently between 0 and 0.92 pct either side of the connectors, looking
    like a numerical instability in the solve.
  cause: >-
    Two structures drawn as one line. The sections table carried every
    element of the problem, and an EA frame's 18 members solve on the same
    axis as the pipe; sorted by material coordinate they interleave. The
    table had section_owner, which says whose SECTION an element carries,
    and a frame member carries the PIPE's section -- so the column that
    looked like it would separate them could not.
  rule: >-
    Whose section an element carries and which body it belongs to are two
    different questions, and a profile must answer both. The sections table
    gained `owner`, and a trace filters on that. The solve was never wrong;
    only the drawing was.
  detect: test_owner_and_section_owner_are_different_questions, test_a_trace_filtered_on_owner_drops_the_frame
  refs: [rebuild/slay/report/profile_schema.py, rebuild/slay/report/profile.py, tools/plot_from_schema.py, rebuild/tests/test_profile_schema.py]
  date: 2026-09-30

- id: L087
  area: measure
  class: defect
  symptom: >-
    The members table wrote every coordinate as the literal text
    np.float64(-9.619599858094242), and the plotter refused the file.
  cause: >-
    _fmt used repr() for floats, and under numpy 2 a numpy scalar's repr is
    np.float64(x) rather than x. Rows built from a displacement array carry
    numpy scalars without anyone noticing; the geometry table had escaped it
    only because its values happened to be cast through float() at the call
    site.
  rule: >-
    Coerce at the WRITER, once, not by remembering to call float() at every
    site that builds a row. A serialiser that trusts repr() is trusting
    every upstream type to have a stable one.
  detect: test_numpy_scalars_serialise_as_plain_numbers, test_a_members_row_round_trips_as_numbers
  refs: [rebuild/slay/report/profile.py, rebuild/tests/test_profile_schema.py]
  date: 2026-09-30

- id: L088
  area: process
  class: defect
  symptom: >-
    A new study for the reference's EA-SB cases was written to
    tools/study_easb.py, which ALREADY EXISTED and holds a different study
    -- ILS-EASB through every connection system, exercising the zero-length
    connector. The file was overwritten and four tests in test_easb.py broke.
  cause: >-
    Not checking whether the name was taken. The write tool reported
    "updated successfully" rather than "created", which said so plainly, and
    the docs/TOOLCHAIN.md tool table listed study_easb.py among the
    archetype studies. Both signals were there to read.
  rule: >-
    Before writing a new file, check the name is free -- and read what the
    write tool says it did. "Updated" for a file you meant to create is a
    destroyed file, and the only reason this one was recoverable is that it
    was committed. The new study is study_easb_cases.py and says in its own
    docstring which of the two it is not.
  detect: test_ps_is_a_passenger_here_too, test_ea_sb_shields_its_pipe_less_than_ea_st
  refs: [tools/study_easb.py, tools/study_easb_cases.py]
  date: 2026-09-30

- id: L089
  area: measure
  class: defect
  symptom: >-
    The X_c / X_i / X_e regions were implemented from the reference's
    FIGURES without checking its stated definitions. X_c was given a half
    width of 1.5 D, chosen as about two elements at the ruled mesh; sections
    VII.B and VIII.B both say "2 x Pipe OD on either side of the connector
    point".
  cause: >-
    A band width picked for the mesh rather than read from the source. It
    happened to change nothing -- every peak already sat within 1.5 D of a
    connector, so all eight case results are identical at 2 D -- which is
    exactly why it would have survived indefinitely.
  rule: >-
    A published convention is read from the publication, not inferred from
    its pictures or chosen to suit the discretisation. A definition that
    makes no difference today still has to be right, because the day it
    starts mattering is not announced.
  detect: test_X_c_is_two_diameters_either_side, test_a_single_connector_has_no_interior
  refs: [tools/study_f2.py, tools/study_easb_cases.py, rebuild/tests/test_regions.py]
  date: 2026-10-01

- id: L090
  area: measure
  class: finding
  symptom: >-
    The reference's prose and its own figures disagree about where X_e
    stops. The text says X_e "refers to pipeline outside the structures";
    Figs 27 and 38 draw X_e's arrow running right up to where X_c begins,
    which includes pipe lying UNDER the structure but outboard of its
    connectors -- for EA-SB, the taper, where strain concentrates.
  cause: >-
    Reading the prose literally and 'correcting' the implementation to
    match it. That moved X_e from -10 to -48 pct against the reference's own
    numbers.
  rule: >-
    Where a source contradicts itself, MEASURE BOTH READINGS and let its own
    published numbers decide. Bucketing the under-structure pipe separately:
    X_e abutting X_c gives -19.4 / -10.1 / -10.5 pct on the three cases that
    can tell the readings apart, against -48.4 / -44.3 / -45.0 for X_e
    outside the body. The figure wins. The fourth case cannot distinguish
    them -- its connectors sit on the body's own edges -- and saying which
    cases are evidence matters as much as the verdict.
  detect: '-'
  refs: [tools/study_f2.py]
  date: 2026-10-01

- id: L091
  area: solve
  class: ruling
  symptom: >-
    A PS layout could not be run at all. The S connector was kept out of
    build_model's supported set and refused by the passage solver, so EA-ST
    and EA-SB were F-only.
  cause: >-
    Not an oversight -- a declared absence. constraints.py carried it as
    "WHAT IS NOT HERE: the co-rotating frame", because an S restrains one
    translation and releases the perpendicular one, so its row belongs in an
    axis that turns with the pipe. Every rig solved before this was
    horizontal, where local IS global exactly, and G9 kept S out until the
    frame landed.
  rule: >-
    A joint that releases ONE translation needs a frame; one that ties
    everything (F, W) or frees only rotation (P) does not. The row is a
    single general constraint n.(u_a - u_b) = 0 along the local normal, NOT a
    set of per-component rows -- flattening it per component is exactly the
    error the frame exists to prevent, so skewed rows are produced
    separately from constraint_rows. The frame is rebuilt from the current
    displacement every Newton iteration: the undeformed pipe is straight, so
    the slope is something the SOLUTION creates, and a frame computed once
    from the mesh would be the identity.
  detect: test_the_slot_slides_along_and_is_held_across, test_the_frame_follows_the_displacement, test_the_skewed_tie_is_one_row_not_three, test_a_deadband_is_still_refused
  refs: [rebuild/slay/solve/passage.py, rebuild/slay/solve/constraints.py, rebuild/slay/solve/kernel.py, rebuild/tests/test_skew_frame.py]
  date: 2026-10-06

- id: L092
  area: measure
  class: finding
  symptom: >-
    The co-rotating frame was expected to move the answer, since the slot
    sits up to 8.2 deg off horizontal by the last position and a global row
    would misread sin(theta) = 14 pct of it. Peak strain is IDENTICAL to
    four decimals with the frame and with global axes, on both archetypes.
  cause: >-
    The frame is necessary for the JOINT to behave as a joint -- measured,
    the slot slides 10.3 mm along itself and is held to 5e-15 m across it --
    but the S connector's misalignment does not propagate to the governing
    pipe strain in these layouts. The P connector ties both translations and
    carries the restraint that sets the peak.
  rule: >-
    Measure what a correctness fix BUYS, and report zero when that is the
    answer. The frame is still required -- without it an S is an F in all
    but name, which is what G9 forbids -- but claiming it changed the
    numbers would have been false, and a reader deciding whether to trust
    earlier F-only results deserves to know these two are unaffected.
  detect: '-'
  refs: [rebuild/slay/solve/passage.py, rebuild/tests/test_skew_frame.py]
  date: 2026-10-06

- id: L093
  area: process
  class: defect
  symptom: >-
    Asked whether a comparison table against the source papers existed, the
    answer was no -- the material was spread over four documents and two
    tools that printed to stdout and persisted nothing. Consolidating it
    found a table whose tension was never stated, run at 120 MT and read
    against a 100 MT target, and the conclusion drawn from it reversed: the
    X3/X2 ratio converges to 0.767 at the paper's tension, just OUTSIDE the
    stated 65-75 pct band, not to 0.744 inside it.
  cause: >-
    The ratio looks tension-insensitive at the ruled 2xOD mesh -- 0.800
    against 0.784 -- so the substitution survived the obvious check. The gap
    holds under refinement and 0.75 is exactly where the band's edge sits,
    so the two tensions settle on opposite sides of it. Nothing about the
    wrong-tension comparison read as wrong; it read as agreement.
  rule: >-
    Keep ONE consolidated comparison, one row per published case, naming the
    program that produced each number -- and treat an unlabelled
    configuration as a defect, not untidiness. A missing tension does not
    leave a reader guessing, it silently recruits the wrong run into a
    comparison that still reads plausibly. Corollary: check a sensitivity
    claim at the REFINED mesh, not the ruled one, before relying on it.
  detect: test_the_header_count_matches
  refs: [docs/validation/VALIDATION_v1.0_2026-10-06.md, docs/modules/T9_physics_sequence.md, rebuild/tests/test_build_lessons.py]
  date: 2026-10-06

- id: L094
  area: process
  class: defect
  symptom: >-
    Nine Series 3 cases ran to convergence at the paper's configuration,
    wrote nine profile artifacts and reported nine peak strains. They were
    three numbers repeated three times -- 0.7132 / 0.5546 / 0.4214 pct at
    R = 70 / 85 / 100 for every wall thickness. --t-ratio and --L-OD had
    been silently dropped by emit_profile's command line for weeks.
  cause: >-
    `emit` picks between two builders by asking whether any EA dimension was
    supplied: any(v is not None for v in (P_c1, kT, L_top, system, extra)).
    `main` always built `extra` as a dict of four Nones, and a dict of Nones
    is TRUTHY, so the EA branch won on every invocation and the plain
    component branch -- the only one that reads t_ratio and L_OD -- was
    unreachable from the CLI. Every run used the archetype's default 42 mm
    wall.
  rule: >-
    A FLAG IS PART OF THE MODEL, so it gets a test like any other part of
    the model. And never let an emptiness test turn on a container's
    truthiness when the container is always constructed: collapse an
    all-None mapping to None at the boundary, where the decision is made.
  detect: test_no_EA_flags_means_None_not_a_dict_of_Nones, test_t_ratio_reaches_the_built_component, test_three_wall_thicknesses_build_three_different_stiffnesses
  refs: [tools/emit_profile.py, rebuild/tests/test_emit_profile_cli.py]
  date: 2026-10-06

- id: L095
  area: physics
  class: defect
  symptom: >-
    With contact_surface='bottom' made the default, SR7's contact slot asked
    for material at s = 54.3197 m in a model that ended at 54.0000 m.
    `_bracket` clamps at the ends, so it returned the last node's pair and
    the target was applied 0.32 m from the right steel. SR7 is the station
    that BEARS THE LAY TENSION.
  cause: >-
    `build_scene`'s own comment says the stinger end "needs nothing, because
    material LEAVES the model there", and under 'centreline' that is exactly
    right -- s_material IS s_arc, and the model is built to span exactly the
    stations. Under a surface that rides the pipe at R + r_roller + OD/2 the
    slot sits (R_eff - R) * theta outboard of its station, so the mesh has
    to be LONGER than the station span. Nothing enforced that, and clamping
    is silent.
  rule: >-
    A constraint whose position is computed must be CHECKED against the mesh
    it is applied to, not assumed inside it. `contact_targets` now refuses a
    slot outside the meshed span and names the margin it needs.
    `material_margin` sizes it, `build_scene` takes `margin_stinger`, and
    the scene layer takes the number as an argument because it sits below
    physics and cannot compute a contact property.
  detect: test_the_default_is_the_physical_surface, test_there_is_no_unconstrained_overhang
  refs: [rebuild/slay/physics/contact.py, rebuild/slay/scene/scene.py, rebuild/tests/test_contact_surface.py]
  date: 2026-10-06

- id: L096
  area: solve
  class: defect
  symptom: >-
    A 6 in passage (R = 70, 12 m, 160 MT) given a stinger margin sized for
    16 in pipe -- 0.32 m allocated where 0.17 m was needed -- went from 7/7
    positions converged to failing at position 0 with CUTBACK EXHAUSTED at
    lam=0.0000. The same case with a matched margin converges.
  cause: >-
    The margin exists to hold the terminal slot. Size it with a different OD
    than the targets use and the model no longer ends ON that slot. TOO
    LITTLE is caught outright by L095's guard. TOO MUCH is the dangerous
    one: the surplus is unconstrained pipe past the last contact, which is
    exactly the free cantilever D6 removed, and lay tension on a free
    cantilever is the original M1 divergence (L050, L051). It returns
    silently, as a convergence failure that looks like a hard corner.
  rule: >-
    The stinger margin and the OD are a HARD PAIR, like dn and the material
    position before them. `sweep.run` recomputes the required margin from the
    OD and surface it is about to use and REFUSES a scene that does not
    match, because `scene_for` and `run` are called separately and nothing
    else pairs their arguments. Too much room is not the safe direction.
  detect: test_the_hard_corner_converges_with_a_seed, test_the_swept_length_is_added_at_the_vessel_end_only
  refs: [rebuild/slay/study/sweep.py, rebuild/tests/test_seed_state.py]
  date: 2026-10-06

- id: L097
  area: measure
  class: defect
  symptom: >-
    Paper 1's Series 4 R = 70 / T = 120 MT configuration reported X3 =
    0.0000 pct in all three of its cases, while X2 and X4 either side read
    0.85 and 0.68 pct. It went into a comparison table as a measurement.
  cause: >-
    That configuration has L1 = 5 D, so each reporting third is 0.677 m
    against an 0.813 m element at the ruled 2xOD density -- X3 contains no
    element MIDPOINT at all. `region_peaks` initialises every region to 0.0
    and reports whatever it still holds, so an unmeasured region is
    indistinguishable from a quiet one.
  rule: >-
    AN ABSENCE IS NOT A ZERO. Every region now carries `measured`, false
    where it holds no elements or no position contributed, and readers print
    a dash rather than a number. `frac_of_x2` is suppressed when X2 itself is
    unmeasured, because a ratio against an absence reads as "this region is
    quiet". This is `body_peaks`' own defect in a second place -- its
    docstring already said why it matters: a zero reads as "nothing happening
    here", and nobody checks a quiet number.
  detect: test_an_unmeasured_region_is_flagged_not_zeroed, test_frac_of_x2_is_not_computed_against_an_unmeasured_X2, test_the_thirds_can_be_shorter_than_one_element
  refs: [rebuild/slay/report/regions.py, tools/emit_profile.py, rebuild/tests/test_region_empty.py]
  date: 2026-10-06
