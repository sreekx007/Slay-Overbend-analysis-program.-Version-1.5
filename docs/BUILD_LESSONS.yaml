    The §6 regression table's plain-pipe row (0.494/0.384/0.316 at R=70/85/100)
    could not be reproduced from the reference program under 12 configurations
    and is not the benchmark it was taken to be.
  cause: >-
    The real benchmark is the source paper's Abaqus TABLE X: 0.46/0.38/0.32 at
    R = 70/85/105, T = 120 MT, 9 m roller spacing, 406x21 pipe. The repo row is
    a Python result recorded without its configuration; it sits near but on
    neither the 8 m (0.4800/0.3626/0.2665) nor the 9 m (0.5081/0.3777/0.2733)
    run at T=120.
  rule: >-
    A baseline row states R AND tension AND roller spacing AND pipe geometry,
    or it cannot discriminate a rebuild defect from a configuration
    difference. Chasing this one produced a well-evidenced WRONG hypothesis:
    target/defaults = 1.371/1.362/1.346 is almost exactly 22in/16in = 1.375,
    and a 22in run reproduces R=70 to 0.3% -- but the paper says 406 mm, so
    it is a coincidence. A near-constant ratio is suggestive, never proof.
  detect: '-'
  refs: [docs/modules/T5_solve_spec.md, docs/SLAY_ARCHITECTURE_AND_RESTRUCTURING_PLAN.md]
