# SLAY Overbend -- build lessons register
# MACHINE REFERENCE. Terse by design. Not prose; do not expand.
#
# Purpose: every entry is a defect that produced RUNNING CODE WITH WRONG
# NUMBERS, or a measured fact that a later session would otherwise re-derive.
# Read before touching the area named in `area`. G8 ("it ran" is not
# verification) is why this file exists.
#
# schema:
#   id         L###                     stable, never reused
#   area       kernel|model|physics|solve|joint|plot|process|measure
#   class      defect|finding|ruling
#   symptom    what was OBSERVED (numbers, not adjectives)
#   cause      the actual mechanism
#   rule       the invariant to hold from now on
#   detect     test name / check that fails if it regresses ('-' = none yet)
#   refs       files that carry the fix or the evidence
#   date       when recorded
#
# version: 1
# entries: 116

- id: L001
  area: kernel
  class: defect
  symptom: >-
    ILS-EASB GD-SB slot3 node welded into the pipeline centreline at EVERY
    element size (4xOD..0.5xOD) and every pad length (5..8 m); DOF count short
    by 3 per straddle node.
  cause: >-
    nlfea_v4 MeshedStructure._mesh keyed mesh nodes by rounded coordinate
    (round(x,10), round(y,10)); GD-SB at P_vt=0 puts 7 part nodes exactly on
    the pipe centreline, so distinct part nodes collapsed into one.
  rule: >-
    Mesh nodes key on USER NODE ID, never on coordinate. Coincident nodes are
    legal and must stay distinct; physical connectivity comes only from
    explicit elements or penalty ties.
  detect: test_coincident_nodes_across_passes_stay_distinct, test_easb_straddle_does_not_weld_into_the_pipe, test_kernel_leaves_the_model_intact
  refs: [nlfea_v4.py::MeshedStructure._mesh, rebuild/tests/test_model.py]
  date: 2026-09-13
  note: G6 amended for this. Validated set re-run after patch -- every figure bit-identical.

- id: L002
  area: model
  class: defect
  symptom: ILS-ILT failed to assemble; GD-B tee had no header node to attach to.
  cause: >-
    GD-B declares a junction onto `pipeline` but owns no line ON the pipeline,
    so pass 1 (header) never created a station there.
  rule: >-
    Pass 0 collects junction targets AND connector stations before pass 1 lays
    the header, so every declared attachment has a station.
  detect: test_mandatory_stations_are_nodes, test_archetype_assembles
  refs: [rebuild/slay/model/assemble.py, docs/modules/T3_assembly_spec.md]
  date: 2026-09-13

- id: L003
  area: model
  class: defect
  symptom: Zero-length connector vanished -- both end nodes merged into one.
  cause: Connector part-node and connector element node fell in the same merge pass at 0.01 m.
  rule: >-
    PASS_CONN_P (4) and PASS_CONN_E (5) are separate passes. Merge WITHIN a
    pass at MERGE_TOL=0.01, NEVER across, one exception only: a declared junction.
  detect: test_zero_length_connector_is_still_an_element, test_declared_junction_does_cross_the_pass_boundary
  refs: [rebuild/slay/model/assemble.py]
  date: 2026-09-13

- id: L004
  area: model
  class: finding
  symptom: Spec claimed shift invariance of the discretisation; a +6 m shift changed the element count.
  cause: >-
    Component-owned elements ARE shift invariant (bit-identical at s_centre
    0, +6, -11.5). The plain-pipe filler is not: a 6 m shift is 7.38 elements
    at the current target length, so the filler re-divides.
  rule: >-
    State shift invariance only for component-owned elements. The filler
    absorbs the remainder by construction.
  detect: test_ils_discretisation_is_shift_invariant, test_plain_pipe_filler_absorbs_the_shift
  refs: [docs/modules/T3_model_spec.md, rebuild/tests/test_model.py]
  date: 2026-09-13

- id: L005
  area: joint
  class: ruling
  symptom: >-
    Zero-length connector had been written as "no element at all, only the
    penalty tie".
  cause: Treated the legal DEFAULT geometry as a degenerate case.
  rule: >-
    Connector stiffness == stiffness of a 1 x OD pipeline element, ALWAYS.
    Never derived from the connector's own length. A zero-length connector is
    still an element and still carries that stiffness. Connectors are routed
    PAST the line mesher.
  detect: test_connector_stiffness_is_a_rule_not_a_number, test_connector_stiffness_is_independent_of_length, test_connector_stiffness_ignores_its_own_length, test_nonzero_connector_becomes_an_element
  refs: [rebuild/slay/model/parts.py, tools/study_connectors.py::connector_k6]
  date: 2026-09-14

- id: L006
  area: model
  class: defect
  symptom: >-
    ILS-EAST showed exactly 12 zero modes = 4 dangling nodes x 3 DOF.
  cause: >-
    Frame-line filter used line_id.startswith('ST:'), which also matched
    'ST:connector2' and dragged 2 unattached connector stubs into the frame.
  rule: >-
    Match frame lines with endswith(':frame') AND e.connector is None.
    Prefix matching on composite ids is a defect.
  detect: test_frame_is_a_closed_ring, test_no_spurious_long_members, test_group_a_is_not_singular
  refs: [tools/study_ea_st.py, rebuild/tests/test_ea_st_frame.py]
  date: 2026-09-14

- id: L007
  area: kernel
  class: defect
  symptom: >-
    8.6e6 kN.m member moments, IDENTICAL under two different load levels;
    reactions 22% over the applied load; asymmetric response on a symmetric
    structure.
  cause: >-
    De Souza rotation unwrap was disabled because theta_states came in as NaN.
    Elements whose chain runs in -s read theta0 = +pi against an incoming
    ~-pi, so every increment unwrapped by 2*pi.
  rule: >-
    Unwrap explicitly in member_forces/recover, AND seed assemble with theta0
    (never NaN) in reactions. Moments that do not scale with load are the
    tell.
  detect: test_moments_scale_with_load, test_reactions_balance, test_reactions_balance_the_applied_load
  refs: [nlfea_v4.py, rebuild/tests/test_ea_st_frame.py]
  date: 2026-09-14

- id: L008
  area: solve
  class: defect
  symptom: >-
    Engaged D connector flipped state 4 times and never settled; reported
    state disagreed with the returned displacement.
  cause: >-
    Engaged D enforced u_a - u_b = 0, which dragged the gap back to
    coincidence -> released -> separated -> re-engaged (chatter).
  rule: >-
    Engaged D targets +/- P_gap, not 0. Release on FORCE DIRECTION -- the tie
    would have to PULL in the direction it engaged -- never on separation
    distance, which sits at the gap edge by construction and so can never
    release. study_connectors.py used the separation SIGN until 14 Sep; the
    force test replaced it with bit-identical output on every row.
  detect: test_deadband_engages_and_stiffens, test_open_deadbands_change_nothing, test_the_active_set_settles_without_chatter, test_constraints_are_satisfied_at_the_gap_edge
  refs: [tools/study_connectors.py, tools/study_east_deadband.py, rebuild/tests/test_connectors.py]
  date: 2026-09-14

- id: L009
  area: kernel
  class: defect
  symptom: >-
    Exactly 12 zero diagonals in K; 4 frame nodes had empty stiffness rows.
  cause: >-
    Connector stiffness written at 3*node_id. MeshedStructure._mesh assigns
    mesh indices in ELEMENT-ENCOUNTER order, so user_node_to_mesh is a
    PERMUTATION, not the identity.
  rule: >-
    Every external write into K/f goes through dof(ms, node, comp) =
    3*ms.user_node_to_mesh[node] + comp. Never 3*node_id.
  detect: test_node_map_is_not_the_identity, test_it_solves
  refs: [tools/study_east_full.py::dof, rebuild/tests/test_east_full.py]
  date: 2026-09-14

- id: L010
  area: measure
  class: defect
  symptom: >-
    "Everything stays elastic" was asserted without connector stress ever
    being computed. Connectors are the SECOND most stressed part of the model.
  cause: nlfea member_stress covers kernel beams only; connectors are not kernel beams.
  rule: >-
    Any elastic/utilisation claim enumerates connectors explicitly. A stress
    report that silently omits a part class is a G8 violation.
  detect: test_connector_stress_is_reported_and_elastic, test_everything_stays_elastic
  refs: [tools/study_east_full.py::connector_forces]
  date: 2026-09-14

- id: L011
  area: plot
  class: defect
  symptom: >-
    Chord plots could not distinguish a rotation-tied connector from an
    untied one -- both draw as the same straight line. First Hermite inset
    came out EMPTY.
  cause: >-
    Chords show end translations only. Empty inset: x400 magnification put a
    50 mm sag 20 m off-screen.
  rule: >-
    Rotation ties are shown with Hermite deflected shapes, drawn RELATIVE to
    the member base (ref offset), never in absolute magnified coordinates.
  detect: test_rotations_are_tied_not_just_translations, test_connector_bends_because_pipe_and_frame_rotate_differently
  refs: [tools/study_east_full.py::deflected, docs/diagrams/east_full_study.png]
  date: 2026-09-14

- id: L012
  area: joint
  class: defect
  symptom: 146 kN.m moment residual -- the connector element was not self-equilibrating.
  cause: >-
    Element stiffness built at L = OD while spanning L_real = 0.6096 m. Rigid
    body rotation was not in the null space of the 6x6.
  rule: >-
    Build the connector as a 3-DOF COROTATIONAL basis: k at L = OD (per
    L005), kinematics T at L_real. Section scaling CANNOT fix this -- matching
    EA/L and 4EI/L leaves 12EI/L^3 at 0.444x; matching 12EI/L^3 leaves 4EI/L
    at 2.25x.
  detect: test_reactions_balance, test_constraints_are_satisfied
  refs: [tools/study_connectors.py::connector_k6]
  date: 2026-09-14

- id: L013
  area: joint
  class: defect
  symptom: >-
    On PS, the S connector carried a PURE COUPLE of 338.79 kN.m at exactly
    zero shear. A bolt in a slot cannot provide a couple.
  cause: S was tying rz. S = (False, True, True) instead of (False, True, False).
  rule: >-
    S = (False, True, False) -- slides along the EA-ST local x AND turns.
    TIES_OPEN/TIES_SHUT/SKEWED live ONLY in slay/model/parts.py; studies
    import them. A duplicate table in a tool is a defect by itself.
  detect: test_s_is_a_roller_not_a_prismatic_pair, test_ps_connectors_carry_neither_moment_nor_shear, test_p_connector_carries_no_moment, test_d_is_a_pure_support
  refs: [rebuild/slay/model/parts.py:149, tools/study_connectors.py]
  date: 2026-09-14

- id: L014
  area: process
  class: defect
  symptom: Background job died with exit 144; long-running job output never appeared.
  cause: >-
    pkill -f "rig.py" matched its OWN command line and killed the job.
    `| tail -N` buffers, so a long background job shows nothing until exit.
  rule: >-
    Never pkill on a pattern that matches the killing command. Do not pipe a
    long background job through tail; redirect to a file and read it.
  detect: '-'
  refs: []
  date: 2026-09-13

- id: L015
  area: solve
  class: finding
  symptom: A 0.02 s solve ran for 15 minutes and returned nothing.
  cause: >-
    solve_step halves the increment and retries WITHOUT BOUND, raising
    nothing. Requested tolerance was below the reachable plateau.
  rule: >-
    Tolerance landscape: default 5e-4 UNDER-CONVERGES; 1e-5..1e-7 is a flat
    plateau; below that is unreachable. Fixture: tol=1e-6, n_increments=20.
    Any new solve loop must bound its retries and raise.
  detect: test_layout_solves, test_it_solves
  refs: [nlfea_v4.py::solve_step, docs/modules/T3_mesher_test_plan.md:494]
  date: 2026-09-14

- id: L016
  area: solve
  class: finding
  symptom: Penalty ALPHA chosen by sweep, not by guess.
  cause: '-'
  rule: >-
    ALPHA = 1e5, scaled to the LOCAL diagonal (not the kernel's global max).
    At 1e5: displacement converged to six figures, constraint violation
    4.8e-7 mm, cond(K) 3.9e13.
  detect: test_constraints_are_satisfied
  refs: [tools/study_connectors.py, docs/modules/T3_assembly_spec.md:403]
  date: 2026-09-14

- id: L017
  area: solve
  class: finding
  symptom: Group B layouts are mechanisms, and the eigenvalues say so.
  cause: Support-only layouts have rigid body modes with all gaps open.
  rule: >-
    Singularity is PROVED with measured eigenvalues, never inferred from a
    solver error. Group A: 5.6e2..6.7e2. Group B: 1.7e-7, 2.8e-7; EASB
    exactly 0.0.
  detect: test_group_a_is_not_singular, test_group_b_is_a_mechanism_without_its_associations, test_a_support_only_layout_is_a_mechanism
  refs: [rebuild/tests/test_connectors.py, rebuild/slay/model/parts.py::layout_is_adequate]
  date: 2026-09-14

- id: L018
  area: joint
  class: finding
  symptom: >-
    PS connectors carry ZERO shear and ZERO moment; ILS deflection
    65.47250 mm == exactly the bare pipe; frame carries no bending.
  cause: >-
    Correct and expected. A rigid frame held at two points by a pin and a
    roller is statically determinate against any motion of those points --
    the ILS rides as a passenger.
  rule: >-
    PS is the null case. If PS shows bending moment or shear, the joint table
    or the connector element is wrong (see L012, L013). F2 must show
    substantially more than PS.
  detect: test_ps_makes_the_ils_a_passenger, test_ps_does_not_shield_the_pipe_at_all, test_f2_connectors_carry_far_more_than_ps, test_f2_stiffens_where_ps_does_not
  refs: [tools/study_east_full.py, rebuild/tests/test_east_full.py]
  date: 2026-09-14

- id: L019
  area: measure
  class: finding
  symptom: Fibre integration count changes I non-monotonically.
  cause: '-'
  rule: >-
    n_fibres error on I: 20 -> +0.397%, 30 -> +6.587%, 40 -> +0.007%.
    NON-MONOTONE. Never pick n_fibres by "more is better"; measure.
  detect: '-'
  refs: [nlfea_v4.py]
  date: 2026-09-13

- id: L020
  area: model
  class: finding
  symptom: NodeReason has no member for a load point or a restraint.
  cause: Taxonomy was written for geometry provenance only.
  rule: >-
    Load and restraint stations are carried via extra_stations, not as a
    NodeReason. Do not invent a NodeReason member for them without a ruling.
  detect: test_the_tension_station_is_also_a_contact_slot, test_fixed_station_is_not_a_contact_slot
  refs: [rebuild/slay/model/parts.py, rebuild/slay/model/assemble.py]
  date: 2026-09-13

- id: L021
  area: model
  class: finding
  symptom: Merge tolerance margin was never measured.
  cause: '-'
  rule: >-
    Tightest DISTINCT part-node spacing in the published archetype set is
    0.176 m = 17.6 x MERGE_TOL (0.01). Raising MERGE_TOL erodes that margin;
    it does NOT fix cross-pass welds (see L001, L003) and makes them worse.
  detect: test_merge_tolerance_has_margin_over_the_published_set
  refs: [rebuild/slay/model/parts.py::MERGE_TOL, rebuild/tests/test_model.py]
  date: 2026-09-13

- id: L022
  area: model
  class: ruling
  symptom: '-'
  cause: '-'
  rule: >-
    Node identity is TWO LAYERS. Part nodes are named and physical. Mesh
    nodes are integer indices assigned by the mesher. Coincident mesh nodes
    getting separate numbers is correct -- they occupy separate stiffness
    rows, and connect only through penalty constraints where physically
    joined.
  detect: test_part_node_produces_exactly_one_model_node, test_coincident_nodes_across_passes_stay_distinct
  refs: [docs/modules/T3_assembly_spec.md, rebuild/slay/model/parts.py]
  date: 2026-09-13

- id: L023
  area: model
  class: ruling
  symptom: '-'
  cause: '-'
  rule: >-
    Frame: +x toward the vessel, +y down, +z into the page (right-handed).
    s increases toward the STINGER, so ds/dx < 0. ILS placement is a PURE
    TRANSLATION: s = s_centre - x_local, y_offset = y_local. No reflection.
    The meshed pipe is STRAIGHT -- bending onto the arc is the solver's job.
  detect: test_frame_is_right_handed_with_z_into_the_page, test_stinger_appears_left_and_vessel_right_without_an_axis_flip, test_tangent_points_toward_the_stinger_tip
  refs: [rebuild/slay/model/assemble.py, rebuild/tests/test_scene.py]
  date: 2026-09-13

- id: L024
  area: joint
  class: ruling
  symptom: '-'
  cause: '-'
  rule: >-
    G9 stands: never substitute F for P/S/D -- refuse, do not approximate.
    SUPPORTED_CONN_TYPES in assemble.py is currently {F, W}; P/S/D are
    refused there by name until the co-rotating (skewed) constraint lands.
    S and D need it before anything sits on the stinger arc (local axis turns
    up to 32.4 deg).
  detect: test_unsupported_connector_type_is_refused, test_refusal_names_the_valid_set
  refs: [rebuild/slay/model/assemble.py::SUPPORTED_CONN_TYPES, rebuild/slay/model/parts.py::SKEWED]
  date: 2026-09-14

- id: L025
  area: process
  class: defect
  symptom: >-
    An F2 model with stations added at the outer slots deflected 48.398 mm
    against F2D's 49.429 -- a 2% gap that looked like physics on identical
    pipeline meshes.
  cause: >-
    study_east_full.solve picked the load node with
    next(n for n in m.nodes if n.part_id.startswith('PIPE-X')) -- the FIRST
    externally-requested station in node order. With one extra_station that is
    the layout midpoint; with three it was s = -2.1675, so the load silently
    moved off-centre and every number in the run was for a different problem.
  rule: >-
    Name the load position and take the nearest matching station; raise if
    none is within 1e-6. A load location selected by iteration order is a
    defect even when it happens to be right.
  detect: test_open_is_the_base_system_exactly
  refs: [tools/study_east_full.py, rebuild/tests/test_east_deadband.py]
  date: 2026-09-14

- id: L026
  area: model
  class: finding
  symptom: >-
    ILS-EAST declared with connection_system='F2D' and NO P_gap builds,
    validates and assembles. Association.gap comes through as None.
  cause: >-
    component_spec states the "P_gap required when D" check "lives in
    ils_builder.validate()". It is not there -- grep for P_gap in
    ils_builder.py returns nothing.
  rule: >-
    Never rely on that check. Any consumer of a D connector verifies
    Association.gap is not None and refuses otherwise -- P_gap has no default
    BY DESIGN, because a deadband redistributes strain and the gap decides
    where it goes. Both files are MIRRORED (G7), so the gap cannot be closed
    here; RAISED UPSTREAM 14 Sep 2026 as CUN-001 in Slay-ILS-Designer-V1.0
    (docs/CRITICAL_UPDATE_NOTES.md, branch
    critical-update/p-gap-not-enforced, PR #1), with a verified patch. The
    PR is DOCS ONLY -- it raises the defect, it does not fix it. Still OPEN
    upstream -- do not assume the check exists until CUN-001 says RESOLVED.
  detect: test_the_gap_is_component_data
  refs: [rebuild/component_spec.py:2582, rebuild/ils_builder.py]
  date: 2026-09-14

- id: L027
  area: model
  class: finding
  symptom: >-
    F2D with every deadband open came out 3.79e-04 mm off plain F2 at 200 kN,
    not zero, though an open D restrains nothing.
  cause: >-
    Not the joint -- the mesh. A connector forces a header STATION at its
    slot, so F2D discretises the pipeline at +/-2.1675 m where F2 does not.
  rule: >-
    Compare like with like: F2 given the same two stations matches F2D-open to
    every digit printed (49.42922334 mm both). A residual that small is still
    a claim; identify it, never call it tolerance.
  detect: test_open_is_the_base_system_exactly
  refs: [tools/study_east_deadband.py, rebuild/tests/test_east_deadband.py]
  date: 2026-09-14

- id: L028
  area: joint
  class: ruling
  symptom: '-'
  cause: '-'
  rule: >-
    G9 is not widened by emit_unenforced_conn_types. It grants GEOMETRY ONLY
    -- nodes, connector element, declared Association (type, ties, gap,
    skewed) -- for a type this layer cannot enforce, records every one in
    Model.warnings, and defaults empty. The CALLER owes the enforcement and
    must report it: the F2D study carries an active-set deadband and prints
    the engaged state of every D at every gap. A D emitted this way and solved
    without a deadband is an F in all but name, which is the substitution G9
    forbids.
  detect: test_the_d_geometry_is_opt_in_and_says_so, test_unsupported_connector_type_is_refused
  refs: [rebuild/slay/model/assemble.py, tools/study_east_deadband.py]
  date: 2026-09-14

- id: L029
  area: joint
  class: finding
  symptom: >-
    Deadband engagement is decided by ONE measured number per load, and it
    calls every cell of the sweep.
  cause: '-'
  rule: >-
    Free separation at the outer slots with all D open decides engagement.
    F2D: 0.3002 mm at 20 kN, 3.0041 mm at 200 kN. F1D: 0.9220 / 9.1049 mm.
    A gap wider than that cannot close; narrower must. Engagement is a
    property of the gap AND the load, never the gap alone (F2D 1 mm and F1D
    3 mm are each open at 20 kN, shut at 200 kN). F2D 200 kN deflection
    against gap (mm): 5.00/3.50 -> 49.4292 (= F2), 2.50 -> 47.5135,
    1.00 -> 41.8067, 0.25 -> 38.9502; rigid-roller limit 38.0014. F1D:
    15.0/10.0 -> 65.4687 (= F1), 7.50 -> 61.4748, 3.00 -> 50.2199,
    0.75 -> 44.5648; limit 42.6787. A shut D is a ROLLER, not an F -- it ties
    the perpendicular and nothing else, and a zero gap is refused by the
    component as a different system. Sweep each system against its OWN
    threshold; a shared gap set measures nothing on one of them.
  detect: test_the_threshold_predicts_every_cell, test_engagement_is_load_dependent, test_engagement_stiffens_monotonically
  refs: [tools/study_east_deadband.py, docs/diagrams/east_deadband_study.png]
  date: 2026-09-14

- id: L030
  area: joint
  class: finding
  symptom: >-
    F1 leaves the pipe at its bare-beam deflection (65.4708 mm at 200 kN) and
    every F1D connector carries exactly zero moment and zero shear at every
    gap, engaged or not.
  cause: >-
    F1's single F sits at slot 3 = the layout midpoint. At the midspan of a
    symmetric fixed-fixed beam the rotation is zero, so the tie transmits no
    moment and the frame only translates -- a PASSENGER, the same outcome as
    PS by a different mechanism.
  rule: >-
    F1 is a null case like PS. Consequences that follow and must hold
    together: F1D starts softer than F2D (65.47 vs 49.43 mm), its frame
    travels 3x further before the D pair touches (9.105 vs 3.004 mm), and the
    deadband buys it more (31.9% vs 21.2%) without overtaking F2D
    (44.56 vs 38.95 mm at the tightest gap). Report connector AXIAL as well
    as moment -- an F1D table of moments alone is all zeros and cannot tell a
    working strut from a connector doing nothing.
  detect: test_f1_is_a_passenger_and_every_f1d_connector_is_a_strut, test_f1d_starts_softer_and_gains_more
  refs: [tools/study_east_deadband.py, rebuild/tests/test_east_deadband.py]
  date: 2026-09-14

- id: L031
  area: joint
  class: finding
  symptom: >-
    Frame vertical equilibrium reads straight off the connector axials, and
    its SHAPE differs by system.
  cause: '-'
  rule: >-
    F2D hangs the frame on 2 D + 2 F, symmetric, so N_F == N_D exactly.
    F1D hangs it on 2 D + 1 F, so N_F == 2 * N_D exactly. Cheapest available
    check that load goes where the layout says, and it cannot pass by
    accident because the two ratios differ. With every D open both are 0 --
    a symmetric pair summing to zero means each is zero, which is what
    "passenger" looks like numerically.
  detect: test_the_load_path_has_the_shape_the_layout_implies, test_open_d_carries_no_force
  refs: [tools/study_east_deadband.py, rebuild/tests/test_east_deadband.py]
  date: 2026-09-14

- id: L032
  area: process
  class: defect
  symptom: >-
    F1D raised "no externally-requested pipeline station to load" -- the
    model had no PIPE-X node at all.
  cause: >-
    F1D's single F is at slot 3, which IS the layout midpoint, so the
    connector claimed that station and the requested one merged into it. The
    load still had a node; it was just not named the way the search expected.
    Two nodes then sit at (s=0, y=0) in different passes, deliberately
    unmerged -- the header's and the connector's C-P.
  rule: >-
    Find the load node by POSITION among the pipeline's own element
    endpoints, never by part-id prefix. Loading the C-P node instead would
    push the load through the connector into the frame and bypass the pipe.
    Second correction to the same line -- see L025.
  detect: test_the_load_lands_on_the_header_not_the_connector
  refs: [tools/study_east_full.py, rebuild/tests/test_east_deadband.py]
  date: 2026-09-14

- id: L033
  area: joint
  class: ruling
  symptom: >-
    ILS-EASB's connectors are ALL zero length (GD-SB sets P_vt = 0, putting
    its top chord on the pipe centreline). connector_k6 raised ValueError --
    the corotational basis divides by the chord length.
  cause: >-
    A zero-length connector is NOT the limit of a beam. A beam's transverse
    stiffness is entirely a moment arm: rigid rotation moves its ends L*phi
    apart, so Delta_transverse is not a deformation of a beam, only
    Delta_transverse - L*phi is. At L = 0 that mode ceases to exist.
  rule: >-
    At L = 0 use a relative-DOF spring K = [[k,-k],[-k,k]], which annihilates
    both rigid-body modes by construction (equal translation -> Delta u = 0;
    equal rotation of COINCIDENT nodes -> Delta rz = 0), so it is
    self-equilibrating however k is chosen. Three stiffnesses, all at
    L0 = OD per pass 4's rule, each the beam's own stiffness in that mode
    with the other two relative freedoms restrained:
    k_axial = EA/L0, k_transverse = 12EI/L0^3, k_rotation = EI/L0.
    k_rotation is EI/L0 and NOT 4EI/L0 -- 4EI/L0 is the stiffness against ONE
    end's rotation with the other held, which is not a relative mode and
    would make the connector 4x too stiff in bending.
  detect: test_the_zero_length_element_is_a_relative_dof_spring, test_the_three_stiffnesses_come_from_the_rule, test_the_rotation_stiffness_is_the_relative_mode_not_one_end
  refs: [tools/study_connectors.py, rebuild/tests/test_easb.py]
  date: 2026-09-14

- id: L034
  area: joint
  class: ruling
  symptom: >-
    k_axial and k_transverse differ by 1.35x, so which global direction each
    acts in has to be stated for a connector with no chord to read.
  cause: '-'
  rule: >-
    A zero-length connector's axis is the P_vt DIRECTION -- the component's
    local y, the direction a connector runs from the pipe to the structure.
    P_vt = 0 means the structure sits ON the centreline, not that the
    connector points elsewhere, so the zero-length case keeps the same axis
    convention as every other connector. Sign is irrelevant (the stiffness is
    even in the axis); a zero axis vector refuses. On the stinger arc this
    axis turns with the slope -- the same co-rotating frame S and D need.
  detect: test_the_axis_is_the_pvt_direction_and_its_sign_does_not_matter
  refs: [tools/study_connectors.py, tools/study_east_full.py]
  date: 2026-09-14

- id: L035
  area: joint
  class: finding
  symptom: >-
    EA-SB's connectors carry ZERO vertical force, equal-and-opposite
    horizontal force (112.343 kN) and equal-and-opposite moment
    (281.528 kN.m) under F2 at 200 kN.
  cause: >-
    GD-SB's top chord is COINCIDENT with the pipe and its body is below, so
