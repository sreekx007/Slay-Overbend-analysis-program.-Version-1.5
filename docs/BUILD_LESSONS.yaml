- id: L042
  area: physics
  class: ruling
  symptom: '-'
  cause: '-'
  rule: >-
    T4 artifacts. Section rules: declared | ratio (same section at ratio*E,
    EA and EI scaling together) | section_at (per ELEMENT at its own
    midpoint, assembly is the single source) | pipe. Frame conversion
    x_local = s_centre - s lives in slay/physics/sections and nowhere else.
    Contact target dn = R(1-cos t - t sin t) + lift, lift =
    contact_at(x).y - OD/2, checked against the direct projection to 1e-15
    at every station. Old dn = arc_y*ny errs 0.662 m at SR6 (R=85), 1.158 at
    R=70. Weight in +y, half-half lumping, total rho*A*g*L. Tension at the
    LOAD station along ITS OWN tangent (SR7, not SR6 -- a 3x strain error).
    Problem carries NO shift index, NO sweep length, NO live Scene; DONE
