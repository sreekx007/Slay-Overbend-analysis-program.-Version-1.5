  detect: test_two_shifts_differ_only_in_contact, test_the_problem_carries_no_shift_no_sweep_and_no_scene, test_keeping_the_old_formula_would_be_metres_wrong
  refs: [docs/modules/T4_physics_spec.md, rebuild/slay/physics/problem.py]
