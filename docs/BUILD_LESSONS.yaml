- id: L046
  area: solve
  class: finding
  symptom: >-
    passage.solve cannot reach the benchmark case: CUTBACK EXHAUSTED on the
    FIRST increment at 30 MT of tension as readily as at 120.
  cause: >-
    The benchmark's load path is STAGED -- pretension with the vessel end
    fixed, then a rotation-driven bend, then gravity, then lay tension, then
    translation -- while solve ramps contact targets, gravity and tension
    together on one lam. At the first increment that puts a fraction of
    1.18 MN on the tip of a 9 m overhang past SR6, on a pipe still straight
    and anchored 99 m away, with nothing to react it.
  rule: >-
    A proportional ramp is not a substitute for a staged one when the later
    loads need geometry the earlier steps create. solve must take a SEQUENCE
    of steps, each ramping its own subset and carrying state -- which is what
    SolveState already exists for. Corollary measured: without tension the
    one-sided stinger rollers cannot pull the pipe onto the arc, so only 4-5
    of 10 carry, strain barely varies with R (0.2617/0.2704/0.2428 at
    70/85/105) and stinger radius stops governing. Tension is not a load on
    the benchmark case, it is what makes it the benchmark case.
  detect: '-'
  refs: [rebuild/slay/solve/passage.py, docs/modules/T5_solve_spec.md]
  date: 2026-09-21

- id: L047
  area: measure
  class: finding
  symptom: >-
    Every contact target met to 1e-13 m, and the material point that should
    sit at SR6 ends up 2.21 m from the arc (5.2 m in the one-sided gravity
    case). Miss grows monotonically down the stinger and is invisible to the
    residual.
  cause: >-
    A contact slot fixes the NORMAL component of an interpolated displacement
    and leaves the tangent free, so the residual reports on one direction
    only. The first diagnosis written here -- tangential indeterminacy for
    want of tension -- was WRONG, and the arc-position check is what proved
    it: the true cause was a mirrored contact normal (L048), and the miss
    drops to 2.7 mm with that fixed and still no tension.
  rule: >-
    A converged residual on a partial constraint is evidence about the
    constrained direction and nothing else. Under arc-length positioning the
    material point at arc s must land at path.position(s) -- both components,
    no projection, nothing the constraint itself supplies. Measure that
    before theorising about what is missing; a plausible story about
    under-constraint is cheaper to write than a position to measure, and it
    was wrong.
  detect: test_the_material_point_lands_on_its_own_arc_station
  refs: [tools/plot_stinger.py, docs/modules/T5_solve_spec.md, docs/diagrams/stinger_pipe.png, rebuild/tests/test_passage.py]
  date: 2026-09-21

- id: L048
  area: physics
  class: defect
  symptom: >-
    Contact normals carried the world-frame sign into model DOFs. Arc
    stations missed their own arc point by up to 2.21 m at SR6 (R=85) while
    every target was met to 1e-13 m. Rebuild peak strain barely moved with
    stinger radius -- 0.2617/0.2704/0.2428 pct at R=70/85/105 -- when it must
    fall like D/2R.
  cause: >-
    scene speaks WORLD (x toward the vessel); model, physics and solve speak
    MODEL (s toward the stinger, x_world = -(s + u_s)). path.normal returns a
    world vector and contact_targets handed it straight to the solver as
    coefficients on (u_s, u_y), so the s component had the wrong sign. dn was
    unaffected -- flipping both u_s and n_s leaves the dot product alone --
    so the target matched to machine precision and the constraint was still
    wrong. The reference program has no such boundary: its nodal coordinate
    IS world x (slay_sliding_v0_4.py:235, "decreasing with node id"), so its
    nx = -sin(theta) was right there and is wrong here.
  rule: >-
    A formula ported across a frame change is not a formula that survived the
    port. Every world vector entering model/physics/solve passes through one
    named conversion (physics.contact.to_model_frame) and no other place
    flips a sign. A quantity that is invariant under the error -- here dn,
    because both factors flip -- cannot be used to check the error.
  detect: test_the_material_point_lands_on_its_own_arc_station
  refs: [rebuild/slay/physics/frame.py, rebuild/slay/physics/contact.py, rebuild/slay/scene/path.py, slay_sliding_v0_4.py, docs/modules/T5_solve_spec.md]
  date: 2026-09-21

- id: L049
  area: physics
  class: defect
  symptom: >-
    Lay tension pointed the wrong way along the pipe. Measured through the
    solve at R=85: 10 MT of declared lay tension put 5.27 MT of COMPRESSION
    through the straight deck run instead of ~10 MT of tension. Peak strain
    at 10 MT read 0.2595 pct against 0.2904 pct with the direction corrected.
  cause: >-
    Same defect as L048 at a second site. path.tangent returns a WORLD vector
    and lay_tension used it as a model-frame (fx, fy), so the s component had
    the wrong sign and the tip was pulled back toward the vessel instead of
    down the catenary. The existing test asserted fx == T*tx against the same
    world tangent, so it restated the implementation and ratified the defect
    rather than catching it.
  rule: >-
    A test that restates the implementation cannot fail with it. Name the
    physics instead: tension pulls the cut end away from the vessel and down,
    so fx > 0 and fy > 0 in model components, and the deck carries tension,
    not compression. Every world vector entering model/physics/solve goes
    through physics.frame.to_model_frame; grep path.tangent and path.normal
    outside scene to find the sites -- there were exactly two.
  detect: test_tension_pulls_the_tip_away_from_the_vessel, test_lay_tension_puts_the_deck_in_tension
  refs: [rebuild/slay/physics/frame.py, rebuild/slay/physics/loads.py, slay_sliding_v0_4.py, docs/modules/T5_solve_spec.md]
  date: 2026-09-21

- id: L050
  area: solve
  class: finding
  symptom: >-
    CUTBACK EXHAUSTED at lam=0.0000 on every tension case, and a 64x cutback
    barely moved the first Newton step -- 3.674 m at lam=1/40 against 3.232 m
    at lam=1/2560, threshold 1.0 m.
  cause: >-
    nlfea_v4.assemble takes lam and never applies it to dist_loads or
    joint_loads (nlfea_v4.py:1419-1429); only the assemble_at wrapper at line
    1693 scales them, and no solver in this project calls it. Both
    passage.solve and the reference _solve_state_sliding pass raw dist and jl
    through, so gravity and tension are at FULL value on the first Newton
    iteration of the first increment. lam ramps the contact targets alone.
  rule: >-
    Cutback cannot reduce a load that lam does not scale. A divergence whose
    first-iteration dU is insensitive to dlam is a LOAD or a model problem,
    never a step-size problem, and cutting further is wasted work. Read what
    the kernel does with lam before writing a load-path diagnosis: the first
    one written here assumed a proportional ramp that does not exist.
  detect: test_assemble_does_not_scale_loads_by_lam
  refs: [nlfea_v4.py, rebuild/slay/solve/passage.py, slay_sliding_v0_4.py, docs/modules/T5_solve_spec.md]
  date: 2026-09-21

- id: L051
  area: physics
  class: finding
  symptom: >-
    120 MT lay tension diverged on the first Newton iteration at every
    stinger radius. Applied at SR6 instead of SR7, with nothing else changed,
    it converges: 0.5467/0.3985/0.2845 pct at R=70/85/105 against the
    reference program's 0.5274/0.3882/0.2790 and the paper's 0.46/0.38/0.32.
  cause: >-
    Our SR7 is a LOAD station with NO contact constraint, so the tension is
    applied to a free cantilever tip 9 m past the last roller on a straight
    unstressed pipe -- first Newton step 3.2 m. The reference applies its
    joint load at the last mesh node, at the last SR station's angle
    (slay_sliding_v0_4.py:541-544), and exempt_set makes that station a
    permanently active contact slot, so the tension lands on a held node.
  rule: >-
    A load applied at a free end of an initially straight geometrically
    nonlinear model has no stiffness to react it on iteration one. Check
    where the reference APPLIES a load, not just its magnitude and direction.
    The case-construction gap list had already recorded this end-condition
    difference as a thing to settle; it was not a detail, it was the blocker.
  detect: '-'
  refs: [rebuild/slay/physics/loads.py, rebuild/slay/scene/rollers.py, slay_sliding_v0_4.py, slay_overbend_v1_50.py, docs/modules/T5_solve_spec.md]
  date: 2026-09-21

- id: L052
  area: physics
  class: ruling
  symptom: >-
    D6 taken: the terminal stinger station is a bidirectional contact slot
    that also bears the lay tension. 120 MT converges at every radius.
    ORIGINALLY RECORDED as "does NOT reproduce -- +15 to +21 pct with the
    peak at SR6 instead of SR2". THAT COMPARISON WAS WRONG (see L062): it
    put the single solve's WHOLE-MODEL peak against the staged sequence's
    BAND peak. At the band metric D6 reads 0.5165/0.3876/0.2879 pct at
    R=70/85/105 against run_slay's 0.5271/0.3937/0.2903 -- about 1.5 pct
    low, and it does reproduce.
  cause: >-
    Removing the free cantilever removed the divergence. The terminal
    contact slot DOES over-constrain the tip -- the whole-model peak sits at
    SR6 (0.6290/0.4590/0.3320 pct, all at s=39.60) -- which is precisely why
    the reported band excludes the last three stinger rollers. Inside the
    band the tip artefact is not present and the result is sound.
  rule: >-
    bears_tension is ORTHOGONAL to role: a station may bear contact and
    carry the load, and load_station selects on the attribute -- a role test
    would match nothing and apply no load silently. Quote D6 results at the
    band metric; the whole-model peak is the tip artefact the band exists to
    exclude, and the two must never be compared with each other.
  detect: test_the_tension_station_is_also_a_contact_slot, test_there_is_no_unconstrained_overhang
  refs: [rebuild/slay/scene/rollers.py, rebuild/slay/physics/loads.py, slay_overbend_v1_50.py, docs/modules/T5_solve_spec.md]
  date: 2026-09-21

- id: L053
  area: solve
  class: finding
  symptom: >-
    A four-step staged solve -- displacements with all rollers
    bidirectional, then gravity with lift-off, then tension, then J2 --
    reproduces run_slay to within 1.7 pct at R=70/85/105 (0.5179/0.3884/
    0.2879 against 0.5271/0.3937/0.2903, 8 m, 120 MT, J2, band metric).
    ORIGINALLY RECORDED as beating a single proportional solve by +15 to
    +21 pct. IT DOES NOT: at the same band metric the single solve gives
    0.5165/0.3876/0.2879, within 0.3 pct of the staged result at every
    radius. The comparison was against a different metric (L062).
  cause: >-
    The staging matters for CONVERGENCE, not accuracy, and only where the
    geometry cannot react the load yet: 120 MT on a straight unstressed pipe
    with a free tip diverged on the first Newton iteration (L050, L051).
    Once D6 gave the terminal station a contact slot, the cold single solve
    converges too, and lands in the same place.
  rule: >-
    Build the geometry before applying the load that the geometry has to
    carry -- that is a convergence rule, not an accuracy claim, and it must
    not be quoted as one. The reported zone travels with the number: this
    result excludes SR5/SR6/SR7, SR6 carries MORE strain than the reported
    peak, so the headline is wrong without the zone beside it.
  detect: test_it_reproduces_the_reference_program, test_the_excluded_zone_is_load_bearing
  refs: [tools/stage_run.py, rebuild/tests/test_stage_run.py, slay_overbend_v1_50.py, docs/modules/T5_solve_spec.md]
  date: 2026-09-21

- id: L054
  area: process
  class: finding
  symptom: >-
    Read TABLE XIX's "OD (mm) 406.4" column as the COMPONENT's OD and
    concluded the paper thickens inward at fixed OD while ThickPipeBody
    thickens outward at fixed bore -- a 19-64 pct stiffness conflict. WRONG.
    406.4 is the PIPELINE OD, repeated across the case rows as a fixed
    parameter. Corrected by the user, same day, before any run.
  cause: >-
    A fixed parameter repeated in every row of a case table looks like a
    varying one. The disconfirming evidence was already in hand and in the
    paper: the computed constant-bore I/Ip for the 53 mm case is 3.248, and
    the paper states "approximately 3.2x the pipeline stiffness" and
    "WT = 53 mm, OD = 471 mm at constant ID = 364 mm. The 2.54x wall
    thickness increase is entirely outward". The number that would have
    caught it was sitting in the comparison table as the supposed error.
  rule: >-
    Check a derived quantity against the source's OWN stated derived value
    before calling it a discrepancy -- the paper quotes 3.2x stiffness and
    471 mm OD, both of which match constant bore. A column that does not
    change across the cases of a case table is a fixed parameter, not the
    variable. And a conflict found while scoping is a hypothesis: confirm it
    against prose, not against a table header.
  detect: '-'
  refs: [rebuild/component_spec.py, docs/modules/T9_components_spec.md]
  date: 2026-09-21

- id: L055
  area: process
  class: finding
  symptom: >-
    Paper Series 4 (GD-SH) and Series 5 (GD-TP + GD-SH) report Phase 2
    results in EVERY row; Series 3 (GD-TP) reports Phase 1.
  cause: >-
    Phase 1 is plastic bending at the first two roller boxes -- a single lay
    position, which T5 already solves. Phase 2 is elastic bend-unload as the
    pipe SLIDES over the mid-stinger rollers, which needs the sweep: T6, the
    L7 study layer, M5. Not built.
  rule: >-
    Read the PHASE label on a benchmark row before targeting it. A
    single-position solve compared against a Phase 2 target produces a wrong
    answer that converges. Order: GD-TP now, then T6, then GD-SH and the
    combination.
  detect: '-'
  refs: [docs/modules/T9_components_spec.md, docs/SLAY_BUILD_INSTRUCTION.md]
  date: 2026-09-21

- id: L056
  area: solve
  class: finding
  symptom: >-
    Sweeping the sliding passage BACKWARDS (negative shift) returns status
    'ok' with a 6.3-6.8 pct peak at x=-42.01, beyond SR6 in the free-tip
    region. The same shift=0 reads 0.5715 pct from a cold start and 6.3032
    pct after one backward step.
  cause: >-
    p = bn - shift, so a negative shift moves the roller's target toward the
    stinger and the model into a configuration it cannot reach. The sweep
    carries state forward and only breaks on status != 'ok', which never
    trips, so one bad step contaminates every later one. Step 0 also gets
    n_increments_step0=40 and pen_step0=1e8 against 20 and 1e4 later, so a
    backward first step is solved with the loose settings too.
  rule: >-
    The sliding sweep is FORWARD ONLY and must start from a cold state. A
    peak reported outside the roller span is the signature to check: the
    free tip is where a corrupted state shows first. Status 'ok' is not
    evidence -- G8 -- and a stateful sweep needs a per-step sanity bound on
    WHERE the peak is, not just whether it converged.
  detect: '-'
  refs: [slay_sliding_v0_4.py, docs/modules/T9_components_spec.md]
  date: 2026-09-21

- id: L057
  area: measure
  class: finding
  symptom: >-
    Series 3 thick-pipe cases peak at SR2 (x=-7.98) at every shift, and the
    peak falls monotonically over the reference program's default schedule:
    0.5715/0.5530/0.5273/0.5168/0.5074 pct over shifts 0-4 (A3, R=85,
    100 MT).
  cause: >-
    The default placement puts the component's stinger-side edge exactly on
    SR2 and SR2 is where the Phase 1 peak lives, so advancing the pipe moves
    the component away from it. BUT the schedule covers 3.195 m, only 40 pct
    of one 7.988 m roller spacing, and the program refuses a shift large
    enough to reach the next roller. Whether the peak rises again as the
    component approaches SR3 was never observed because the run cannot get
    there.
  rule: >-
    A monotonic trend over 40 pct of a span is not a maximum. RULED 21 Sep
    2026: sequential sliding IS part of the physics sequence (Step 6), and
    the reported peak is taken across the whole passage, not at the start
    position. An earlier version of this lesson concluded no sweep was
    needed; that conclusion was drawn from the truncated schedule and is
    withdrawn. State the sweep's reach beside any passage result.
  detect: '-'
  refs: [docs/modules/T9_physics_sequence.md, docs/modules/T9_components_spec.md, slay_sliding_v0_4.py]
  date: 2026-09-21

- id: L058
  area: measure
  class: finding
  symptom: >-
    The paper's 1000 mm thick component meshes as ONE element at the
    standard 2xOD element length. Refining raises the peak monotonically and
    it has not converged: 1 elem 0.5715, 2 elems 0.6118, 3 elems 0.6458,
    5 elems 0.6640, 7 elems 0.6739 pct (A3, R=85, 100 MT, shift 0).
  cause: >-
    A single element cannot represent bending WITHIN the component, and the
    component exists to create a bending-stiffness discontinuity. The repo's
    own M3 note already required at least 3 elements across a component; the
    reference program's default mesh does not meet it, and neither does the
    paper's, which states its mesh is for relative comparison only.
  rule: >-
    Count the elements INSIDE a component before quoting its number. Two
    claims must be kept apart: reproducing the reference (run at the
    reference's own 2xOD mesh) and predicting the strain (needs refinement
    and a convergence check). Agreement at a coarse mesh can owe something
    to both sides being under-resolved. RULED 21 Sep 2026: 2 elements across
    the component, element length not below 1xOD -- 0.4993 m at 1.23xOD --
    accepted as roughly 10 pct below the converging trend, deliberately.
  detect: '-'
  refs: [docs/modules/T9_physics_sequence.md, docs/modules/T9_components_spec.md, slay_sliding_v0_4.py]
  date: 2026-09-21

- id: L059
  area: model
  class: defect
  symptom: >-
    With a vessel-side sweep buffer, build_problem raised "VR5 is at
    s=-40.0000 and the nearest header node is at -39.8000. A restraint needs
    a node under it." Every prior model had worked.
  cause: >-
    build_model registers PIPE-LO at the Scene extent and does NOT register
    roller stations. At margin=0 the extent's vessel end coincided exactly
    with the FIXED station, so the anchor had a node BY COINCIDENCE. Adding
    margin_vessel moved the end and the mesh grid no longer landed on it.
    boundary_conditions demands a node within 1e-6 m.
  rule: >-
    A restraint's node must be REQUESTED, never inherited from a boundary
    that happens to coincide with it. study.sweep._required_stations passes
    every FIXED station through build_model's extra_stations, which is the
    documented route for a point an outside layer needs a node at. Contact
    stations are deliberately NOT included -- they are interpolated inside
    an element (G1).
  detect: test_the_anchor_keeps_a_node_once_the_end_moves
  refs: [rebuild/slay/study/sweep.py, rebuild/slay/model/assemble.py, rebuild/slay/physics/loads.py]
  date: 2026-09-22

- id: L060
  area: solve
  class: ruling
  symptom: >-
    Sweep length was previously chosen by hand (the reference's default
    d_shift=1.0, n_shifts=4 -- 3.195 m, 40 pct of a roller spacing) and the
    truncation twice produced a monotonic trend that was read as a maximum.
  cause: >-
    A passage length that does not follow from the component cannot be
    known to cover the traverse. The reference also caps at ~90 pct of one
    spacing regardless of n_vr, because its buffer is bought with roller
    count rather than length.
  rule: >-
    RULED 22 Sep 2026. sweep_length = L_comp + clear_before + clear_after,
    defaults 1.0 m each and adjustable: the component starts with its
    LEADING edge clear_before short of SR2 and finishes with its TRAILING
    edge clear_after past it. The swept length is added at the VESSEL end
    (build_scene(margin_vessel=)) and nowhere else -- material leaves the
    model at the stinger end and needs nothing there. check_reach refuses a
    sweep the model cannot feed rather than reporting a number for a station
    bearing on nothing.
  detect: test_sweep_length_is_the_component_plus_both_clearances, test_the_swept_length_is_added_at_the_vessel_end_only, test_a_sweep_the_model_cannot_feed_is_refused
  refs: [rebuild/slay/study/sweep.py, rebuild/slay/scene/scene.py, rebuild/tests/test_sweep.py]
  date: 2026-09-22

- id: L061
  area: physics
  class: ruling
  symptom: >-
    The first sweep buffer was bare pipe of length exactly sigma, hanging
    off the back of the fully-fixed anchor with nothing under it. At 20 m of
    feedstock that is a cantilever carrying real bending stress, and at
    exactly sigma the pipe's tail arrives at the last vessel roller as the
    sweep ends.
  cause: >-
    A buffer is feedstock, not structure. Left unsupported it develops
    stress of its own; left exactly sigma long it collides with the roller
    it was meant to feed past; left with the case material it can yield, and
    a plastic hinge in it is carried into every later position by the
    chained state.
  rule: >-
    RULED 22 Sep 2026, three parts. (1) Buffer = sweep + TAIL_CLEAR, default
    1.0 m, so the tail and its support stay clear of the last vessel roller
    for the whole passage. (2) A uy-ONLY support under the tail, standing
    for the deck rollers behind the tensioner -- ux and rz stay free or the
    support fights the feed it exists to allow. (3) elastic_spans forces the
    buffer to a linear elastic material whatever the case runs. Note
    elastic_spans is DISTINCT from elastic_zones, which is still only
    carried: applying those would move every validated number, so the two
    must be unified deliberately rather than by a rename.
  detect: test_the_buffer_is_the_sweep_plus_tail_clearance, test_the_buffer_tail_is_vertically_supported_and_free_to_feed, test_the_buffer_never_yields
  refs: [rebuild/slay/study/sweep.py, rebuild/slay/physics/loads.py, rebuild/slay/physics/problem.py, rebuild/slay/solve/kernel.py]
  date: 2026-09-22

- id: L062
  area: measure
  class: defect
  symptom: >-
    Recorded that the four-step staged sequence beat a single proportional
    solve by "+15 to +21 pct, with the peak displaced to SR6". Re-measured
    22 Sep at matched metrics the two agree within 0.3 pct at every radius.
    The claim propagated into L052, L053, RESULTS.md 1.1-1.2, T5 spec 5d
    and 5e, and TRIAL_LOG T010 and T012.
  cause: >-
    The single solve was reported with Result.peak_strain() -- the
    WHOLE-MODEL peak, which lands at s=39.60 inside the excluded tip where
    D6's terminal contact slot over-constrains -- and the staged sequence
    with peak_in_zone(), the BAND peak excluding SR5/SR6/SR7. Two different
    quantities, differing by exactly the tip artefact the band exists to
    remove. Both runs were correct; only the comparison was not.
  rule: >-
    A comparison is between two numbers computed the SAME way. Record the
    metric beside every peak -- whole-model or band, and which stations the
    band drops -- and refuse to difference two peaks whose zones differ. A
    15-21 pct discrepancy that happens to equal a known artefact is a
    reporting bug before it is a physics finding.
  detect: test_staged_and_single_solve_agree_at_the_same_metric
  refs: [docs/RESULTS.md, docs/modules/T5_solve_spec.md, tools/stage_run.py, rebuild/tests/test_stage_run.py]
  date: 2026-09-22

- id: L063
  area: measure
  class: ruling
  symptom: >-
    A plain-pipe passage read in MATERIAL coordinates appears to have its
    peak frozen at one element (s=9.28 at every position) while the value
    decays 13 pct over 4 m of travel. It reads as a solver defect. Chasing
    it cost four wrong hypotheses: a non-sliding tension point (disproved,
    identical to 4 decimals), a soft chained penalty (disproved, targets met
    to 1e-13 at 1e4, 1e6 and 1e8 alike), the terminal station's slot
    degenerating onto the tip node (disproved, survives a stinger margin),
    and the carried active set (disproved, reset changes nothing).
  cause: >-
    Model `s` is a MATERIAL coordinate: it labels a point on the pipe and
    travels with it. After the pipeline advances by `shift`, material `s`
    sits at station position `s + shift`, so a strain reported at material
    `s` is at a DIFFERENT PLACE ON THE STINGER at every position. A table of
    material-s peaks down a passage compares nothing to nothing. The real
    cause of the decay was the carried PLASTIC STATE -- isolated by resetting
    it, which flattens the passage -- i.e. accumulated yielding as material
    traverses the stinger, which is the effect sequential sliding exists to
    capture, not a defect at all.
  rule: >-
    Report every passage quantity in STATION coordinates, carry the material
    coordinate beside it, and apply the reporting zone on the station value.
    Before calling a passage trend a defect, reproduce it LINEAR ELASTIC:
    there a plain pipe on fixed rollers must be invariant, so anything left
    is either discretisation or real material history.
  detect: test_the_zone_cuts_on_station_not_material, test_station_strains_are_keyed_by_place_not_by_material, test_a_plain_elastic_passage_is_invariant_in_station_space
  refs: [rebuild/slay/report/passage.py, tools/slide.py]
  date: 2026-09-28

- id: L064
  area: measure
  class: finding
  symptom: >-
    The GD-TP passage envelope depended on the sweep step over a 20 pct
    range: 0.4715 pct at a 2.0-element step, 0.4772 at 1.0, 0.5482 at 0.5,
    0.5678 at 0.25. Refining the step moved the answer and gave no sign of
    having converged.
  cause: >-
    The envelope sits where the component's LEADING EDGE crosses a roller --
    peak location converging on lead = 9.016 m against SR2 at 9.000 -- which
    is not a step boundary. Any step steps over it; a coarse step misses it
    by 16 pct. Refining the step everywhere pays for resolution across the
    whole passage to buy it at one travel.
  rule: >-
    Solve the edge crossings exactly. `study.sweep.critical_shifts` returns
    the travels at which either component edge sits on a contact station and
    the schedule includes them whatever the step, on by default. Measured,
    that makes the envelope step-INDEPENDENT: 0.5731/0.5727/0.5722/0.5689 pct
    across the same 4x range of step, a 0.7 pct spread instead of 20, and
    found in 5 positions rather than 16.
  detect: test_critical_shifts_are_the_edge_crossings, test_the_schedule_carries_the_critical_shifts_whatever_the_step
  refs: [rebuild/slay/study/sweep.py, tools/slide.py]
  date: 2026-09-28

- id: L065
  area: physics
  class: finding
  symptom: >-
    Open item from the T4 spec: the contact slot interpolates LINEARLY
    between the two bracketing nodes, where a beam's transverse displacement
    is really cubic. Estimated at about 1 mm and raised rather than changed.
  cause: >-
    Now measured on a plain LINEAR ELASTIC passage, where station-space
    strain must be invariant. Stepped a WHOLE element it holds to 0.03-0.08
    pct at SR1-SR4. Stepped HALF an element the values alternate -- SR1
    0.1947, 0.1863, 0.1947, 0.1863, 0.1948 pct -- with no trend: a contact
    point interpolated to mid-element is softer than one sitting on a node.
    Worth 4.40 pct at SR1, 0.83 pct at SR2, 0.26 at SR3, 0.04 at SR4, at
    2xOD elements.
  rule: >-
    The linear slot costs up to 4.4 pct at the first stinger roller when the
    contact point falls mid-element, and that is now a number rather than an
    estimate. It is twenty times smaller than the 16 pct cost of
    undersampling the envelope (L064), so refining the step is right and
    Hermite interpolation stays an open item -- but a passage whose positions
    all sit mid-element carries this bias systematically.
  detect: test_a_plain_elastic_passage_is_invariant_in_station_space
  refs: [rebuild/slay/physics/contact.py, docs/modules/T4_physics_spec.md, tools/slide.py]
  date: 2026-09-28

- id: L066
  area: physics
  class: defect
  symptom: >-
    Adding contact_surface='bottom' moved the GD-TP passage envelope by
    -14.51 pct, against -1.2 pct at the start position of the same passage
    and -0.7 to -1.0 pct on plain pipe at three radii. The envelope also
    jumped from shift 1.000 to shift 2.000 -- from the LEADING edge crossing
    SR2 to the TRAILING edge crossing it.
  cause: >-
    study.sweep.critical_shifts computed the edge-crossing travels from the
    station's own s_arc, while the contact slots had moved to
    s_arc + (R_eff - R)*theta. Under 'bottom' the schedule therefore solved
    travels the contact never saw: at SR2 the crossing is 53 mm later than
    the schedule believed, the leading-edge peak was never sampled, and the
    max fell back to a different position. The physics change was about
    1 pct; the other 13 was a sampling artefact of my own making.
  rule: >-
    dn and the material position under a station are a HARD PAIR, and so is
    anything that SCHEDULES against that position. physics.contact.
    station_material is the single owner of the mapping; contact_targets and
    critical_shifts both read it, neither restates it. After the fix the
    envelope delta is -1.36 pct and lands at shift 1.053 = 1.000 + 0.053, the
    SR2 correction exactly.
  detect: test_the_edge_crossings_follow_the_contact_surface, test_the_crossing_offset_is_the_material_correction
  refs: [rebuild/slay/physics/contact.py, rebuild/slay/study/sweep.py]
  date: 2026-09-28

- id: L067
  area: measure
  class: defect
  symptom: >-
    The +/-2xOD junction probe returned the same element, and therefore
    exactly the same strain and moment, as the junction probe itself. A row
    labelled 2xOD carried the 1xOD number.
  cause: >-
    Probes were answered by "the element CONTAINING the requested point". At
    the ruled 2xOD mesh, element midpoints sit at ODD multiples of 1xOD from
    a junction, so no element centre is ever at 2, 4 or 6xOD from one and
    every requested offset falls between two midpoints. The containing
    element can be up to half an element away, which at 2xOD is a full
    diameter.
  rule: >-
    Interpolate between the two nearest element midpoints INSIDE the
    requested point's own contiguous section run -- never across the step,
    where strain is genuinely discontinuous. Where the run ends first (the
    junction itself, or an offset that overshoots a short body) clamp to the
    end midpoint and set `clamped`. Every probe carries `s_elem`, so a reader
    can always see where the number really came from.
  detect: test_a_probe_lands_at_the_offset_it_is_labelled_with, test_offsets_on_one_side_are_distinct_values
  refs: [rebuild/slay/report/junction.py]
  date: 2026-09-28

- id: L068
  area: solve
  class: ruling
  symptom: >-
    The rebuild had no bending-moment recovery at all -- Result carried
    strains only -- so nothing downstream could report a moment, and the
    junction dataset was blocked on it.
  cause: >-
    Ported from the reference _moment_profile, which carries a v1.48 fix
    worth knowing: M is evaluated at BOTH Gauss points, each with its OWN
    curvature kappa(xi_g) and its OWN stored plastic state. Pairing the
    element-mean curvature with the GP0-only plastic state gave a spurious
    single-element moment collapse -- about 500 kNm where ~1330 kNm was
    right -- because near a contact node the two Gauss points hold very
    different plastic strain. Strain never showed it: strain does not read
    the plastic state.
  rule: >-
    Element moment is the mean of the two self-consistent Gauss-point
    moments, reported at the element midpoint -- the same grid the strains
    use, so the two are comparable element for element. NOT nodal
    extrapolation: a section moment saturates plastically, so extrapolating
    past the Gauss points returns values above section capacity. An element
    whose constitutive law is unrecognised RAISES rather than falling back
    to E*I*kappa, which would be wrong where it mattered and plausible
    everywhere.
  detect: test_elastic_moment_is_EI_kappa_on_a_solved_arc, test_moment_and_strain_agree_through_the_curvature
  refs: [rebuild/slay/solve/passage.py]
  date: 2026-09-28

- id: L069
  area: plot
  class: ruling
  symptom: >-
    The first component-on-stinger figure drew the strain trace as one
    continuous line straight through each junction, so the 4.3x step read as
    a steep ramp into the component rather than as a discontinuity.
  cause: >-
    Strain STEPS across a section change -- the same moment on two section
    moduli gives two strains -- so a line drawn through it asserts a gradient
    the model does not have. report.junction already refuses to interpolate
    across the step for exactly this reason; the figure was doing what the
    extraction forbids.
  rule: >-
    Break every profile trace at a section change: group elements into
    contiguous runs of one OD and plot each run separately, so the gap in the
    line IS the discontinuity. A figure may not assert continuity the data
    layer declines to assert. Also shade the excluded reporting band -- the
    D6 tip artefact is the tallest feature on an unshaded plot and reads as
    the answer.
  detect: '-'
  refs: [tools/plot_stinger.py, rebuild/slay/report/junction.py]
  date: 2026-09-28

- id: L070
  area: plot
  class: defect
  symptom: >-
    In the component-on-stinger figure the component was drawn a full metre
    short of the roller it was sitting on. Read off the plot, the peak strain
    appeared to occur BEFORE the component reached SR2. Spotted by eye, from
    the figure, not by any check.
  cause: >-
    The world mapping was x = -(s + u_s), with no shift term. The solver
    never applies the rigid-body translation of a pipeline advancing down the
    stinger, and it is RIGHT not to: sliding a pipe along its own axis
    produces no strain, so nothing in the model drives it, and the shape and
    strain are correct without it. But the picture is in world coordinates,
    where that translation is exactly what puts the material under its
    roller. Measured at shift = 1.000 m: SR2 sits at x = -8.983 and the
    material it constrains was drawn at -7.998 -- every station off by the
    shift, to three decimal places.
  rule: >-
    A figure of a swept position maps material to world as
    x = -(s + shift + u_s). The shift is a property of the PICTURE, not of
    the solution, and its absence is invisible in every residual and every
    strain check -- only the drawing shows it. After the fix the leading edge
    draws at -8.998 against SR2 at -8.983, the 15 mm residual being the
    pipe's own tangential displacement.
  detect: test_the_drawn_material_sits_under_its_own_roller, test_omitting_the_shift_is_what_breaks_it, test_the_pipe_polyline_carries_the_shift_too
  refs: [tools/plot_stinger.py, rebuild/tests/test_plot_placement.py]
  date: 2026-09-29

- id: L071
  area: plot
  class: ruling
  symptom: >-
    Joining element strains at their MIDPOINTS left a half-element gap
    between the last element of a section run and the junction, so the
    discontinuity read as missing data rather than as a step.
  cause: >-
    Strain is piecewise constant per element, so a line through midpoints is
    already an interpolation, and it cannot reach the element boundary where
    the section changes.
  rule: >-
    Draw each element over its OWN EXTENT -- a staircase, not a polyline
    through midpoints. Adjacent runs then meet exactly at the junction and
    the only gap left is the vertical jump, which IS the discontinuity.
  detect: '-'
  refs: [tools/plot_stinger.py]
  date: 2026-09-29

- id: L072
  area: plot
  class: defect
  symptom: >-
    On the all-steps passage figure the "outside the reporting band" shading
    covered the entire VESSEL side of the model -- the half that is IN the
    band -- and left the excluded stinger tip unshaded.
  cause: >-
    The span was drawn from fx(min(s_material)) to the cut. Minimum MATERIAL
    s is the vessel end, which maps to the most POSITIVE world x, so the
    shading ran the wrong way across the model. The zone drops the last three
    STINGER rollers: high s, and therefore the most NEGATIVE x.
  rule: >-
    Take the drawn extreme in the coordinate being drawn: min over fx(s), not
    fx over min(s). The world mapping reverses sign, so an extremum in
    material coordinates is the opposite extremum in world coordinates.
  detect: test_the_excluded_band_covers_the_stinger_end_not_the_vessel_end
  refs: [tools/plot_stinger.py, rebuild/tests/test_plot_placement.py]
  date: 2026-09-29

- id: L073
  area: plot
  class: ruling
  symptom: >-
    The close-up drew the pipeline as a polyline with a thick coloured
    segment on it. That said nothing about how deep a component was, which
    side of the pipe it sat on, or -- for GD-SH -- that it hangs BELOW the
    pipe rather than replacing part of it. The shroud had no outline at all.
  cause: >-
    One drawing rule was being used for two physically different things. A
    body that changes the SECTION replaces the pipe wall over its span; a
    body that only changes the CONTACT sits outside the pipe and changes
    nothing structural.
  rule: >-
    Ask the assembly which kind it is and draw accordingly. section_at(x)
    with owner != pipe means a section-changing body: draw it at its own OD
    about the centreline. contact_at(x) with owner != pipe while section_at
    stays pipe means a contact-only body: draw it from the pipe's own bottom
    down to contact_at(x).y. Drawing a shroud at a section OD would invent a
    stiffness the model does not have -- its stiffness_ratio is 1.0 and says
    so. All offsets follow the pipe's LOCAL NORMAL, not the vertical: the
    pipe turns 0.64 rad over the stinger, so a wall drawn by adding OD/2 to
    y is 20 pct narrow at SR7.
  detect: test_a_section_changing_body_is_drawn_at_its_own_OD, test_a_contact_only_body_is_NOT_drawn_at_a_section_OD, test_the_offset_is_perpendicular_not_vertical
  refs: [tools/plot_stinger.py, rebuild/tests/test_plot_placement.py]
  date: 2026-09-29

- id: L074
  area: plot
  class: defect
  symptom: >-
    The first shroud outline had a 95 mm step where the geometry goes to
    zero, and the drawn body was visibly the wrong shape at its taper ends.
  cause: >-
    The outline was sampled at the STRUCTURAL mesh nodes. At the ruled 2xOD
    density a 6.096 m shroud spans seven nodes and its taper ends fall
    BETWEEN them, so the drawing interpolated straight past the geometry it
    was supposed to show.
  rule: >-
    A drawing grid is not the structural mesh. Interpolate the deformed
    centreline finely and ask the assembly at every sample, so an outline
    follows the component rather than the mesh that happens to carry it.
    After the fix the shroud ring runs 0.0036 to 0.2032 m against a true 0
    to 0.2032.
  detect: test_the_outline_is_resampled_off_the_component_not_the_mesh, test_a_contact_only_body_is_NOT_drawn_at_a_section_OD
  refs: [tools/plot_stinger.py]
  date: 2026-09-29

- id: L075
  area: process
  class: ruling
  symptom: >-
    Asked for two stinger figures, the route taken was the GENERATING plotter:
    it rebuilt the Scene and re-swept the whole passage for each figure, and
    then the scalars quoted beside them were solved a THIRD time. Every one of
    those scalars -- both envelopes, both shifts, both stiffness ratios, both
    junction counts -- was already sitting in dataset_components.csv. The user
    asked why it had taken so long and whether we were not supposed to be
    plotting from a fixed schema. We were.
  cause: >-
    Two causes, and only one was carelessness. The reflex reached for the tool
    that could already draw the figure. But the schema plotter could not have
    drawn it either: the case-row contract deliberately excludes profiles, and
    no per-position artifact existed. A rule that says "plot from the schema"
    with no schema for what is being plotted is not a rule anyone can follow.
  rule: >-
    G13. A figure reads an artifact and never generates one. Generating and
    drawing are separate programs -- tools/emit_profile.py solves and writes,
    tools/plot_from_schema.py reads and draws, importing nothing from slay. A
    quantity a figure needs and no contract carries is a MISSING COLUMN to be
    added to a schema, never a solver call added to a plotter. Where a rule
    cannot be followed, fix the gap rather than the person.
  detect: test_the_plotter_imports_nothing_from_slay, test_the_five_panel_figure_draws_from_the_files_alone
  refs: [docs/SLAY_BUILD_INSTRUCTION.md, tools/plot_from_schema.py, tools/emit_profile.py, rebuild/slay/report/profile_schema.py]
  date: 2026-09-29

- id: L076
  area: measure
  class: ruling
  symptom: >-
    Designing the profile artifact, the obvious move was one big table. It
    does not work: geometry belongs to samples along the pipe, strain belongs
    to ELEMENTS and is piecewise constant over their extents, and a roller
    belongs to neither and does not move when the pipe does. One table forces
    either a discriminator column -- three tables pretending to be one -- or
    duplicating a node's coordinates onto every element that touches it.
  cause: >-
    Treating "a profile" as a single grain when it is three.
  rule: >-
    One table per grain, one sidecar per table, one version across all three,
    joined by case_id. Declare the grain on every field (Field.per: case,
    position, sample) and make it CHECKABLE: profile.write refuses a file
    whose per=case column is not constant, or whose per=position column moves
    within a step. Both failures would otherwise parse cleanly and draw a
    plausible figure of the wrong thing.
  detect: test_write_refuses_a_case_column_that_moves, test_write_refuses_a_position_column_that_moves_within_a_step, test_grains_are_what_they_claim
  refs: [rebuild/slay/report/profile_schema.py, rebuild/slay/report/profile.py]
  date: 2026-09-29

- id: L077
  area: plot
  class: defect
  symptom: >-
    The first figure drawn from the artifact had panels 2 and 5 running
    right-to-left while panels 1, 3 and 4 ran left-to-right, and no roller
    appeared in the close-up at all.
  cause: >-
    set_xlim(max, min) reversed two panels, and the rollers were drawn at
    zorder 2, under the pipe-wall fill at zorder 3. Both looked entirely
    plausible: a mirrored close-up of a curve is still a curve, and "no roller
    in this window" is a thing that can legitimately happen.
  rule: >-
    Every panel on a shared quantity runs the same direction, and anything
    drawn ON the pipe goes ABOVE the fills that represent it. A mirrored axis
    is the same class of error as getting the world sign backwards (L070) --
    it produces a picture that cannot be told from the right one by eye.
  detect: test_every_panel_runs_the_same_way_along_x, test_the_rollers_are_drawn_above_the_pipe_fills
  refs: [tools/plot_from_schema.py, rebuild/tests/test_plot_from_profile.py]
  date: 2026-09-29

- id: L078
  area: measure
  class: ruling
  symptom: >-
    body_peak_strain was 0.0 for every GD-SH case, with step -1 and a blank
    station, for the family whose pipe carries the HIGHEST strain in the
    dataset. It parsed, it plotted, and it was wrong in the one direction
    nobody checks: a zero reads as nothing happening.
  cause: >-
    report.passage.body_peaks asks the junction rows which elements are on
    the body, because for a section-changing component that IS a question
    about sections. A shroud steps no section, so the answer was "none". The
    whole point-probe apparatus -- junction, +/- 2/4/6 x OD -- has nothing to
    probe AT on a body whose effect is spread over its length.
  rule: >-
    A body that steps no section needs a reporting unit that is a REGION, not
    a point. Five of them, after the reference: the catenary-side taper and
    beyond, the deep section in thirds from the catenary side, then the
    vessel-side taper and beyond. The body peak for such a body is taken over
    its FOOTPRINT, tapers included. GD-SH then reports 0.6868 pct instead of
    0.0.
  detect: test_the_peak_lands_in_X2, test_case_columns_are_all_declared, test_a_section_changing_body_has_no_regions
  refs: [rebuild/slay/report/regions.py, rebuild/tests/test_regions.py, tools/dataset.py]
  date: 2026-09-30

- id: L079
  area: measure
  class: finding
  symptom: >-
    The region ratios did not match the reference at first look. X3/X2 came
    out 0.784 against its stated 65-75 pct band, and it was tempting to
    report that as a disagreement.
  cause: >-
    Mesh, not physics. At the ruled 2xOD density (G10) a third of the deep
    section is 1.354 m and an element is 0.813 m, so X2 and X3 hold TWO
    elements each and X4 holds ONE. A ratio between regions of one and two
    elements is reporting the mesh.
  rule: >-
    A region scheme must carry its element count. Refined 2xOD -> 1xOD ->
    0.5xOD the ratio runs 0.784 -> 0.749 -> 0.744, converging INSIDE the
    reference band, and X4/X2 holds at about 0.70 throughout. Record
    n_elements per region and say so where it is thin, rather than quoting a
    ratio the mesh chose. Separately, refinement moves the model peak off X2
    onto the catenary-side taper inside X1 (frac_of_x2 1.022 at 0.5xOD),
    which is why each region peak also records whether it landed on the
    shroud footprint -- X1 lumps a taper together with plain pipe.
  detect: test_case_columns_are_all_declared
  refs: [rebuild/slay/report/regions.py, docs/TRIAL_LOG.yaml]
  date: 2026-09-30

- id: L080
  area: process
  class: defect
  symptom: >-
    DATASET.md stated "Date | 28 September 2026" on a file produced on the
    30th, and reported the matrix as taking 0.17 h when it had taken 1.06 h
    of solving. Both numbers were in the header a reader would quote.
  cause: >-
    The date was a hardcoded string. The elapsed time was wall clock of the
    run that happened to write the file, so every --resume reset it and the
    figure was wrong by however many times the run had been interrupted.
    Neither was noticed while the runner completed in one pass; resume made
    the second one visible and the first was never true.
  rule: >-
    A file states its own provenance from the run, never from a literal. Time
    that must survive a resume is summed from the per-case `seconds` column,
    which is carried forward with the rows, not measured from the start of
    the current process. A file that states its provenance wrongly is worse
    than one that omits it, because the wrong value gets quoted.
  detect: '-'
  refs: [tools/dataset.py, docs/dataset/DATASET.md]
  date: 2026-09-30

- id: L081
  area: solve
  class: ruling
  symptom: >-
    Three of the 200 matrix cases died with CUTBACK EXHAUSTED at lam=0.0000,
    all in one corner: 168.3 mm pipe, 12 m spacing, 160 MT, R = 60-70 m.
    Smallest pipe, widest spacing, highest tension, tightest radius -- every
    axis pushing the same way.
  cause: >-
    `solve` ramps the contact targets by lam but hands over tension and
    gravity at FULL VALUE from Newton iteration 1, because the kernel does
    not scale loads and that is deliberate (L050). So a cutback shrinks the
    targets and nothing else, and lam=0.0000 means the very first step was
    already beyond reach. On a straight unstressed pipe there is no
    geometric stiffness to react a lay tension with, and ramping cannot
    create any.
  rule: >-
    Bend the pipe onto the rollers FIRST, then load it. Three elastic steps
    carrying state forward -- every roller held with no loads, then the ruled
    one-sided set with gravity, then tension -- and chain the real solve onto
    that. This is the first three steps of the staged sequence that
    reproduces the reference to within 1.7 pct (T5 5e). The OPPOSITE order
    was tried and rejected: settling the loads first with the targets held
    diverges above about 15 MT (L050/L051). Seeding is a FALLBACK, applied
    only where the direct solve failed and only where there is no carried
    state, so a case that converged before keeps its exact load path -- 7
    sampled cases reproduce to 0.00e+00 pct. The seed is elastic throughout
    because J2 is path-dependent and yielding during seeding would write a
    history the real load path never took.
  detect: test_the_hard_corner_fails_without_a_seed, test_the_hard_corner_converges_with_a_seed, test_a_case_that_converges_directly_is_untouched, test_the_seed_is_elastic_throughout
  refs: [rebuild/slay/study/sweep.py, rebuild/slay/scene/scene.py, rebuild/tests/test_seed_state.py]
  date: 2026-09-30

- id: L082
  area: model
  class: finding
  symptom: >-
    The three frame archetypes -- ILS-EAST, ILS-EASB, ILS-ILT -- fail with
    the same CUTBACK EXHAUSTED message as the R=60/70 corner, which invited
    treating them as the same defect. Seeding does not fix them.
  cause: >-
    Not the same defect at all. ILS-EAST fails at seeding STEP 1, with every
    roller held, elastic, and NO LOADS APPLIED, and the kernel warns "Matrix
    is exactly singular". A singular stiffness matrix under zero load is a
    MECHANISM in the model -- an unconstrained degree of freedom -- not a
    load the solver cannot reach. Its model carries GD-Con connector and ST
    stalk elements that the pipeline-only archetypes do not.
  rule: >-
    Read the failure, not the message. Two defects sharing a status string
    are still two defects, and a fix aimed at the wrong one would have been
    reported as a partial success. The test that separates them is cheap:
    strip every load and see whether it still fails.
  detect: '-'
  refs: [rebuild/slay/study/sweep.py, docs/dataset/dataset_components.csv]
  date: 2026-09-30

- id: L083
  area: solve
  class: finding
  symptom: >-
    After seeding fixed two of the three corner cases, T060 still failed --
    and an earlier check had appeared to show it converging. That check was
    wrong: it ran PLAIN PIPE with T060's stinger parameters, while T060 is a
    gd-tp case with a component. The label said T060 and the run was not.
  cause: >-
    T060 is not reachable. At 160 MT on a 168.3 x 11.0 mm section the lay
    tension ALONE is 80.2 pct of first yield (289 of 360 MPa); add the
    bending a 60 m radius imposes and the elastic demand is 162 pct. The
    section is fully plastic and has no bending stiffness left to react the
    load. That is plastic collapse, a physical limit, not a solver defect.
    The baseline case sits at 12.9 pct for comparison.
  rule: >-
    Name a check after what it actually runs, and compute the physical
    reason rather than quoting the solver's. slay.physics.capacity annotates
    a failure with its membrane utilisation where that utilisation is high,
    and SAYS NOTHING where it is not -- the silence is the load-bearing
    half, because it keeps a genuine solver defect visible as one. The three
    frame archetypes fail at 12.9 pct and get no message, which is how they
    stay separated from this (L082).
  detect: test_the_hard_corner_gets_a_physical_explanation, test_a_comfortable_case_gets_NOTHING, test_the_threshold_separates_the_matrix_as_it_actually_ran
  refs: [rebuild/slay/physics/capacity.py, rebuild/tests/test_capacity.py, tools/dataset.py]
  date: 2026-09-30

- id: L084
  area: solve
  class: defect
  symptom: >-
    No lay position of any EA archetype had ever converged. ILS-EAST,
    ILS-EASB and ILS-ILT all reported CUTBACK EXHAUSTED at lam=0.0000 with
    the kernel warning "Matrix is exactly singular", even with every roller
    held, elastic, and no loads applied at all.
  cause: >-
    TWO defects stacked, either fatal alone and both looking identical from
    outside. First, Problem splits connectors out of `elements` into
    `connectors`, and mesh_of_problem builds the kernel mesh from `elements`
    alone -- correct, since a corotational beam would take its stiffness from
    its own length and a connector's length is geometry -- but nothing put
    the connectors back, so their 6x6 was never assembled. Second, a
    connector element has its OWN two nodes and ASSOCIATIONS are what fasten
    them to the real pipeline and frame nodes; solve.newton applies them and
    solve.passage never did. Between them the frame was 18 elements attached
    to nothing.
  rule: >-
    A Problem must carry everything a solver needs to pose it. It gained
    part_index so associations can be resolved into DOFs without a Model, and
    solve.passage now assembles connector stiffness and applies the declared
    ties through the SAME constraint_rows code the static solver uses -- one
    rule read once, rather than two solvers enforcing different joints on the
    same geometry. solve.newton already named the symptom in its own error
    text: "a Group B model with its associations unapplied looks exactly like
    this". Reading that would have saved the diagnosis.
  detect: test_every_EA_archetype_now_solves_its_first_position, test_the_ties_exist_and_reach_both_bodies, test_constraint_rows_agree_between_the_model_and_problem_paths, test_a_model_without_a_frame_has_neither_connectors_nor_ties
  refs: [rebuild/slay/solve/passage.py, rebuild/slay/solve/kernel.py, rebuild/slay/solve/constraints.py, rebuild/slay/physics/problem.py, rebuild/tests/test_passage_connectors.py]
  date: 2026-09-30

- id: L085
  area: solve
  class: defect
  symptom: >-
    Adding connector stiffness, the first attempt moved the penalty scale to
    AFTER the connectors -- "so the penalty is scaled against the stiffness
    the structure actually has". The first residual came out at 1.0e18 and
    the solve returned NaN.
  cause: >-
    A connector's 6x6 is built at 1 x OD, so its diagonal is about 1.3e10
    against the beams' 3e6. Folding it into p_scale multiplied the penalty by
    four orders of magnitude. penalty.py's multiplier was tuned by sweep
    against the BEAM stiffness and means nothing against any other basis.
  rule: >-
    A tuned constant carries its basis with it. Changing what a multiplier
    multiplies is changing the constant, even when the new basis is the more
    defensible one. p_scale is taken before the connectors are added.
  detect: test_the_penalty_is_scaled_on_the_BEAM_stiffness, test_every_EA_archetype_now_solves_its_first_position
  refs: [rebuild/slay/solve/passage.py, rebuild/slay/solve/penalty.py, rebuild/tests/test_passage_connectors.py]
  date: 2026-09-30

- id: L086
  area: plot
  class: defect
  symptom: >-
    The first EA-ST stinger figure had a strain trace that zig-zagged
    violently between 0 and 0.92 pct either side of the connectors, looking
    like a numerical instability in the solve.
  cause: >-
    Two structures drawn as one line. The sections table carried every
    element of the problem, and an EA frame's 18 members solve on the same
    axis as the pipe; sorted by material coordinate they interleave. The
    table had section_owner, which says whose SECTION an element carries,
    and a frame member carries the PIPE's section -- so the column that
    looked like it would separate them could not.
  rule: >-
    Whose section an element carries and which body it belongs to are two
    different questions, and a profile must answer both. The sections table
    gained `owner`, and a trace filters on that. The solve was never wrong;
    only the drawing was.
  detect: test_owner_and_section_owner_are_different_questions, test_a_trace_filtered_on_owner_drops_the_frame
  refs: [rebuild/slay/report/profile_schema.py, rebuild/slay/report/profile.py, tools/plot_from_schema.py, rebuild/tests/test_profile_schema.py]
  date: 2026-09-30

- id: L087
  area: measure
  class: defect
  symptom: >-
    The members table wrote every coordinate as the literal text
    np.float64(-9.619599858094242), and the plotter refused the file.
  cause: >-
    _fmt used repr() for floats, and under numpy 2 a numpy scalar's repr is
    np.float64(x) rather than x. Rows built from a displacement array carry
    numpy scalars without anyone noticing; the geometry table had escaped it
    only because its values happened to be cast through float() at the call
    site.
  rule: >-
    Coerce at the WRITER, once, not by remembering to call float() at every
    site that builds a row. A serialiser that trusts repr() is trusting
    every upstream type to have a stable one.
  detect: test_numpy_scalars_serialise_as_plain_numbers, test_a_members_row_round_trips_as_numbers
  refs: [rebuild/slay/report/profile.py, rebuild/tests/test_profile_schema.py]
  date: 2026-09-30

- id: L088
  area: process
  class: defect
  symptom: >-
    A new study for the reference's EA-SB cases was written to
    tools/study_easb.py, which ALREADY EXISTED and holds a different study
    -- ILS-EASB through every connection system, exercising the zero-length
    connector. The file was overwritten and four tests in test_easb.py broke.
  cause: >-
    Not checking whether the name was taken. The write tool reported
    "updated successfully" rather than "created", which said so plainly, and
    the docs/TOOLCHAIN.md tool table listed study_easb.py among the
    archetype studies. Both signals were there to read.
  rule: >-
    Before writing a new file, check the name is free -- and read what the
    write tool says it did. "Updated" for a file you meant to create is a
    destroyed file, and the only reason this one was recoverable is that it
    was committed. The new study is study_easb_cases.py and says in its own
    docstring which of the two it is not.
  detect: test_ps_is_a_passenger_here_too, test_ea_sb_shields_its_pipe_less_than_ea_st
  refs: [tools/study_easb.py, tools/study_easb_cases.py]
  date: 2026-09-30

- id: L089
  area: measure
  class: defect
  symptom: >-
    The X_c / X_i / X_e regions were implemented from the reference's
    FIGURES without checking its stated definitions. X_c was given a half
    width of 1.5 D, chosen as about two elements at the ruled mesh; sections
    VII.B and VIII.B both say "2 x Pipe OD on either side of the connector
    point".
  cause: >-
    A band width picked for the mesh rather than read from the source. It
    happened to change nothing -- every peak already sat within 1.5 D of a
    connector, so all eight case results are identical at 2 D -- which is
    exactly why it would have survived indefinitely.
  rule: >-
    A published convention is read from the publication, not inferred from
    its pictures or chosen to suit the discretisation. A definition that
    makes no difference today still has to be right, because the day it
    starts mattering is not announced.
  detect: test_X_c_is_two_diameters_either_side, test_a_single_connector_has_no_interior
  refs: [tools/study_f2.py, tools/study_easb_cases.py, rebuild/tests/test_regions.py]
  date: 2026-10-01

- id: L090
  area: measure
  class: finding
  symptom: >-
    The reference's prose and its own figures disagree about where X_e
    stops. The text says X_e "refers to pipeline outside the structures";
    Figs 27 and 38 draw X_e's arrow running right up to where X_c begins,
    which includes pipe lying UNDER the structure but outboard of its
    connectors -- for EA-SB, the taper, where strain concentrates.
  cause: >-
    Reading the prose literally and 'correcting' the implementation to
    match it. That moved X_e from -10 to -48 pct against the reference's own
    numbers.
  rule: >-
    Where a source contradicts itself, MEASURE BOTH READINGS and let its own
    published numbers decide. Bucketing the under-structure pipe separately:
    X_e abutting X_c gives -19.4 / -10.1 / -10.5 pct on the three cases that
    can tell the readings apart, against -48.4 / -44.3 / -45.0 for X_e
    outside the body. The figure wins. The fourth case cannot distinguish
    them -- its connectors sit on the body's own edges -- and saying which
    cases are evidence matters as much as the verdict.
  detect: '-'
  refs: [tools/study_f2.py]
  date: 2026-10-01

- id: L091
  area: solve
  class: ruling
  symptom: >-
    A PS layout could not be run at all. The S connector was kept out of
    build_model's supported set and refused by the passage solver, so EA-ST
    and EA-SB were F-only.
  cause: >-
    Not an oversight -- a declared absence. constraints.py carried it as
    "WHAT IS NOT HERE: the co-rotating frame", because an S restrains one
    translation and releases the perpendicular one, so its row belongs in an
    axis that turns with the pipe. Every rig solved before this was
    horizontal, where local IS global exactly, and G9 kept S out until the
    frame landed.
  rule: >-
    A joint that releases ONE translation needs a frame; one that ties
    everything (F, W) or frees only rotation (P) does not. The row is a
    single general constraint n.(u_a - u_b) = 0 along the local normal, NOT a
    set of per-component rows -- flattening it per component is exactly the
    error the frame exists to prevent, so skewed rows are produced
    separately from constraint_rows. The frame is rebuilt from the current
    displacement every Newton iteration: the undeformed pipe is straight, so
    the slope is something the SOLUTION creates, and a frame computed once
    from the mesh would be the identity.
  detect: test_the_slot_slides_along_and_is_held_across, test_the_frame_follows_the_displacement, test_the_skewed_tie_is_one_row_not_three, test_a_deadband_is_still_refused
  refs: [rebuild/slay/solve/passage.py, rebuild/slay/solve/constraints.py, rebuild/slay/solve/kernel.py, rebuild/tests/test_skew_frame.py]
  date: 2026-10-06

- id: L092
  area: measure
  class: finding
  symptom: >-
    The co-rotating frame was expected to move the answer, since the slot
    sits up to 8.2 deg off horizontal by the last position and a global row
    would misread sin(theta) = 14 pct of it. Peak strain is IDENTICAL to
    four decimals with the frame and with global axes, on both archetypes.
  cause: >-
    The frame is necessary for the JOINT to behave as a joint -- measured,
    the slot slides 10.3 mm along itself and is held to 5e-15 m across it --
    but the S connector's misalignment does not propagate to the governing
    pipe strain in these layouts. The P connector ties both translations and
    carries the restraint that sets the peak.
  rule: >-
    Measure what a correctness fix BUYS, and report zero when that is the
    answer. The frame is still required -- without it an S is an F in all
    but name, which is what G9 forbids -- but claiming it changed the
    numbers would have been false, and a reader deciding whether to trust
    earlier F-only results deserves to know these two are unaffected.
  detect: '-'
  refs: [rebuild/slay/solve/passage.py, rebuild/tests/test_skew_frame.py]
  date: 2026-10-06

- id: L093
  area: process
  class: defect
  symptom: >-
    Asked whether a comparison table against the source papers existed, the
    answer was no -- the material was spread over four documents and two
    tools that printed to stdout and persisted nothing. Consolidating it
    found a table whose tension was never stated, run at 120 MT and read
    against a 100 MT target, and the conclusion drawn from it reversed: the
    X3/X2 ratio converges to 0.767 at the paper's tension, just OUTSIDE the
    stated 65-75 pct band, not to 0.744 inside it.
  cause: >-
    The ratio looks tension-insensitive at the ruled 2xOD mesh -- 0.800
    against 0.784 -- so the substitution survived the obvious check. The gap
    holds under refinement and 0.75 is exactly where the band's edge sits,
    so the two tensions settle on opposite sides of it. Nothing about the
    wrong-tension comparison read as wrong; it read as agreement.
  rule: >-
    Keep ONE consolidated comparison, one row per published case, naming the
    program that produced each number -- and treat an unlabelled
    configuration as a defect, not untidiness. A missing tension does not
    leave a reader guessing, it silently recruits the wrong run into a
    comparison that still reads plausibly. Corollary: check a sensitivity
    claim at the REFINED mesh, not the ruled one, before relying on it.
  detect: test_the_header_count_matches
  refs: [docs/validation/VALIDATION_v1.0_2026-10-06.md, docs/modules/T9_physics_sequence.md, rebuild/tests/test_build_lessons.py]
  date: 2026-10-06

- id: L094
  area: process
  class: defect
  symptom: >-
    Nine Series 3 cases ran to convergence at the paper's configuration,
    wrote nine profile artifacts and reported nine peak strains. They were
    three numbers repeated three times -- 0.7132 / 0.5546 / 0.4214 pct at
    R = 70 / 85 / 100 for every wall thickness. --t-ratio and --L-OD had
    been silently dropped by emit_profile's command line for weeks.
  cause: >-
    `emit` picks between two builders by asking whether any EA dimension was
    supplied: any(v is not None for v in (P_c1, kT, L_top, system, extra)).
    `main` always built `extra` as a dict of four Nones, and a dict of Nones
    is TRUTHY, so the EA branch won on every invocation and the plain
    component branch -- the only one that reads t_ratio and L_OD -- was
    unreachable from the CLI. Every run used the archetype's default 42 mm
    wall.
  rule: >-
    A FLAG IS PART OF THE MODEL, so it gets a test like any other part of
    the model. And never let an emptiness test turn on a container's
    truthiness when the container is always constructed: collapse an
    all-None mapping to None at the boundary, where the decision is made.
  detect: test_no_EA_flags_means_None_not_a_dict_of_Nones, test_t_ratio_reaches_the_built_component, test_three_wall_thicknesses_build_three_different_stiffnesses
  refs: [tools/emit_profile.py, rebuild/tests/test_emit_profile_cli.py]
  date: 2026-10-06

- id: L095
  area: physics
  class: defect
  symptom: >-
    With contact_surface='bottom' made the default, SR7's contact slot asked
    for material at s = 54.3197 m in a model that ended at 54.0000 m.
    `_bracket` clamps at the ends, so it returned the last node's pair and
    the target was applied 0.32 m from the right steel. SR7 is the station
    that BEARS THE LAY TENSION.
  cause: >-
    `build_scene`'s own comment says the stinger end "needs nothing, because
    material LEAVES the model there", and under 'centreline' that is exactly
    right -- s_material IS s_arc, and the model is built to span exactly the
    stations. Under a surface that rides the pipe at R + r_roller + OD/2 the
    slot sits (R_eff - R) * theta outboard of its station, so the mesh has
    to be LONGER than the station span. Nothing enforced that, and clamping
    is silent.
  rule: >-
    A constraint whose position is computed must be CHECKED against the mesh
    it is applied to, not assumed inside it. `contact_targets` now refuses a
    slot outside the meshed span and names the margin it needs.
    `material_margin` sizes it, `build_scene` takes `margin_stinger`, and
    the scene layer takes the number as an argument because it sits below
    physics and cannot compute a contact property.
  detect: test_the_default_is_the_physical_surface, test_there_is_no_unconstrained_overhang
  refs: [rebuild/slay/physics/contact.py, rebuild/slay/scene/scene.py, rebuild/tests/test_contact_surface.py]
  date: 2026-10-06

- id: L096
  area: solve
  class: defect
  symptom: >-
    A 6 in passage (R = 70, 12 m, 160 MT) given a stinger margin sized for
    16 in pipe -- 0.32 m allocated where 0.17 m was needed -- went from 7/7
    positions converged to failing at position 0 with CUTBACK EXHAUSTED at
    lam=0.0000. The same case with a matched margin converges.
  cause: >-
    The margin exists to hold the terminal slot. Size it with a different OD
    than the targets use and the model no longer ends ON that slot. TOO
    LITTLE is caught outright by L095's guard. TOO MUCH is the dangerous
    one: the surplus is unconstrained pipe past the last contact, which is
    exactly the free cantilever D6 removed, and lay tension on a free
    cantilever is the original M1 divergence (L050, L051). It returns
    silently, as a convergence failure that looks like a hard corner.
  rule: >-
    The stinger margin and the OD are a HARD PAIR, like dn and the material
    position before them. `sweep.run` recomputes the required margin from the
    OD and surface it is about to use and REFUSES a scene that does not
    match, because `scene_for` and `run` are called separately and nothing
    else pairs their arguments. Too much room is not the safe direction.
  detect: test_the_hard_corner_converges_with_a_seed, test_the_swept_length_is_added_at_the_vessel_end_only
  refs: [rebuild/slay/study/sweep.py, rebuild/tests/test_seed_state.py]
  date: 2026-10-06

- id: L097
  area: measure
  class: defect
  symptom: >-
    Paper 1's Series 4 R = 70 / T = 120 MT configuration reported X3 =
    0.0000 pct in all three of its cases, while X2 and X4 either side read
    0.85 and 0.68 pct. It went into a comparison table as a measurement.
  cause: >-
    That configuration has L1 = 5 D, so each reporting third is 0.677 m
    against an 0.813 m element at the ruled 2xOD density -- X3 contains no
    element MIDPOINT at all. `region_peaks` initialises every region to 0.0
    and reports whatever it still holds, so an unmeasured region is
    indistinguishable from a quiet one.
  rule: >-
    AN ABSENCE IS NOT A ZERO. Every region now carries `measured`, false
    where it holds no elements or no position contributed, and readers print
    a dash rather than a number. `frac_of_x2` is suppressed when X2 itself is
    unmeasured, because a ratio against an absence reads as "this region is
    quiet". This is `body_peaks`' own defect in a second place -- its
    docstring already said why it matters: a zero reads as "nothing happening
    here", and nobody checks a quiet number.
  detect: test_an_unmeasured_region_is_flagged_not_zeroed, test_frac_of_x2_is_not_computed_against_an_unmeasured_X2, test_the_thirds_can_be_shorter_than_one_element
  refs: [rebuild/slay/report/regions.py, tools/emit_profile.py, rebuild/tests/test_region_empty.py]
  date: 2026-10-06

- id: L098
  area: solve
  class: finding
  symptom: >-
    ILS-EASB runs all 30 positions of its passage with
    contact_surface='centreline' and truncates at position 7 with
    contact_surface='bottom', failing CUTBACK EXHAUSTED at lam=0.0000 at
    shift 2.032 m of a 10.128 m travel -- 20 pct of the passage. Both F2 and
    PS truncate at the same position.
  cause: >-
    Not diagnosed. The contact surface raises R_eff by 0.59 pct and moves
    every slot (R_eff - R) * theta outboard, which is a small change
    everywhere else -- plain pipe moved under 1 pct, Series 3 under 2 pct,
    the EA-ST cases under 1 pct. ILS-EASB ships P_v = 1.6256 m, 4 D, a 3.5 D
    lift, the most severe geometry in the repo, and it is the only case where
    the change costs CAPABILITY rather than accuracy. Both connection systems
    failing at the same position says the cause is the structure's geometry
    and not the joint.
  rule: >-
    Report a capability regression as loudly as a wrong number, and mark the
    results it produces as lower bounds rather than quietly tabulating a
    truncated envelope beside a full one. A 7/8 envelope and a 30/30 envelope
    are not the same quantity. First thing to try: the staged seeding that
    rescued the R = 60/70 corner, since this fails at the FIRST increment of a
    position the previous one reached comfortably.
  detect: '-'
  refs: [docs/validation/VALIDATION_v2.0_2026-10-06.md, tools/slide.py]
  date: 2026-10-06

- id: L099
  area: measure
  class: defect
  symptom: >-
    The stinger figures drew the pipe centreline passing through the roller
    axles. Spotted by eye from the plot, not by any check. Measured: the
    solved centreline sat 18 to 72 mm off the roller-centre arc where it
    should sit 503 mm above it, and `off_arc` -- the column whose schema says
    "0 means sitting on the rollers" -- read about 0 for a pipe that was
    sitting on them.
  cause: >-
    `LayPath.R` is measured to the roller CENTRELINE, so `path.position` is
    where the axles are. `report.profile` compared the solved centreline
    against that locus and called the difference `off_arc`. The pipe rests on
    the roller TOPS, r_roller + OD/2 further out, and nothing added it back.
    The analysis was never wrong: contact targets deepen by exactly
    R_eff / R = 1.00592, so curvature carries the roller radius as
    `physics.contact` documents. What was missing was the DATUM the result is
    reported against.
  rule: >-
    A reported geometry must be one a reader can check against the physical
    object. The strain was right and the picture was impossible, and only the
    picture could reveal it -- no numeric test compares an elevation to
    anything. Fixed in reporting, NOT in the solve: every station carries the
    same roller radius, so lifting the pipe by r_roller + OD/2 is a RIGID
    TRANSLATION and produces no strain, which is the same argument
    physics.contact makes for keeping the radius in the curvature. The
    translation is guarded -- differing station radii raise, because then it
    is not a translation and would bend the pipe.
  detect: test_the_schema_declares_the_contact_offset, test_the_arc_columns_are_documented_as_the_AXLE_locus, test_differing_roller_radii_are_refused_not_averaged, test_the_contact_targets_still_carry_the_radius_through_curvature
  refs: [rebuild/slay/report/profile.py, rebuild/slay/report/profile_schema.py, tools/plot_from_schema.py, rebuild/tests/test_contact_datum.py]
  date: 2026-10-06

- id: L100
  area: physics
  class: defect
  symptom: >-
    A roller sitting on an in-line component could not bear on it. Measured
    on a 20 D thick pipe at R = 85: SR2 bearing at s_material 6.208 was
    bracketed by the component's END nodes 8.128 m apart, so its contact
    target was applied as a weighted blend of two points four metres either
    side of the roller, and the body's nine interior nodes were held by NO
    CONTACT CONSTRAINT AT ALL. The component bridged.
  cause: >-
    `contact.header_nodes` chose the nodes a roller may bear on by
    `e.owner == 'pipeline'`. An in-line body REPLACES a length of pipe: GD-TP's
    elements carry owner 'TP' because the SECTION differs, but line_id
    'pipeline' because the run is continuous through them. Filtered on owner
    the chain had a hole exactly where the component sat, and `_bracket`
    spanned the hole. Frames and connectors have their own line_id and were
    correctly excluded either way, which is what the docstring always said
    the function meant.
  rule: >-
    Ask what a node IS PART OF, not who owns it. `line_id` says which
    continuous run a node belongs to; `owner` says which part supplies its
    section, and they differ precisely for the bodies that matter. Found
    from a FIGURE -- the drawn component was a straight chord between its
    junctions, which is the same filter in the reporting path -- after the
    numbers had been believed for weeks.
  detect: test_no_bracket_spans_more_than_an_element, test_a_roller_ON_the_body_brackets_within_the_body, test_the_header_chain_runs_through_an_in_line_body
  refs: [rebuild/slay/physics/contact.py, rebuild/slay/report/profile.py, rebuild/tests/test_inline_body_contact.py]
  date: 2026-10-06

- id: L101
  area: measure
  class: defect
  symptom: >-
    Five of the seven TABLE XXXII / XXXIII shroud cases never finished the
    passage, and the results were tabulated and compared against the paper
    anyway. Measured, as "fraction of the shroud that actually crossed SR2
    before the sweep stopped": S2-1 100%, S2-4 100%, S2-2 38.4%, S2-7 25.4%,
    S2-3 16.9%, S2-6 6.9%, S2-8 6.3%. The sweep is sized at
    L_comp + 1 m + 1 m, so S2-8 needed 23.946 m of travel and got 2.438 m.
    The two cases that DID complete are the two that agree with the paper
    (+9.8% and +15.1%); every case that disagrees is a case that stopped
    early. Spotted by eye from the S2-6 figure -- the shroud is drawn still
    sitting short of SR2 -- not by any check.
  cause: >-
    `study.sweep.run` breaks out of the position loop on the first
    non-converged position, which is right: mode A chains state, so every
    later position would start from a diverged one. The defect is downstream.
    `report.profile` WRITES the diverged position, exactly as its schema
    says it should, but it is the only row carrying `converged=false` and
    nothing above it looks. `tools/study_table_xxxii.py` reads the sections
    table filtered on `in_band`, which the diverged position fails, so the
    truncation was invisible in the very table built to judge the case. The
    envelope is then a maximum over a partial passage and is reported with
    no mark distinguishing it from one taken over a complete one.
  rule: >-
    A study tool must assert the passage COMPLETED before it compares an
    envelope to anything. "It ran and produced numbers" is not verification
    (G8), and a partial passage produces numbers that look entirely ordinary
    -- same columns, same magnitudes, plausible bending moments within a
    2.1% band across all seven cases. The check is cheap and arithmetic:
    max(shift over converged positions) must equal
    sweep_length(L_comp) = L_comp + clear_before + clear_after, and any
    shortfall is reported as a shortfall, not absorbed into a percentage
    difference against a published table.
  rule_detail: >-
    This supersedes, for TABLE XXXII, the region-classification reading
    recorded alongside the S2-6 figure in commit d07b07a. That observation
    stands on its own -- the S2-6 peak at s_material 7.225 does sit inside
    the shroud footprint and is still labelled X1 -- but it is not what
    drives the disagreement with the paper, and attributing the gap to it
    was wrong. The shroud had travelled 1.626 m of a required 10.128 m when
    that peak was recorded.
  detect: test_a_passage_that_stops_at_a_diverged_position_is_not_complete, test_every_position_converging_is_not_enough, test_the_fraction_is_of_travel_not_of_positions, test_the_reader_reports_a_truncated_passage_and_refuses_comparison, test_a_file_from_before_the_columns_existed_reads_UNKNOWN_not_complete, test_the_schema_declares_the_three_status_columns
  refs: [rebuild/slay/study/sweep.py, rebuild/slay/report/profile.py, rebuild/slay/report/profile_schema.py, tools/profile_status.py, tools/study_table_xxxii.py, rebuild/tests/test_passage_completion.py]
  date: 2026-10-06

- id: L102
  area: solve
  class: finding
  symptom: >-
    Every passage in this scene family stops at the same point, and the point
    is a TRAVEL, not a case property. Plain pipe, R = 70, 9 m spacing, 100 MT,
    solved fresh at a ladder of shifts: converges to 2.3 m and diverges from
    2.4 m out to the full 10.128 m sweep, in four scenes built for components
    of 2.642, 4.877, 8.128 and 21.946 m alike. The failure is always
    `CUTBACK EXHAUSTED at lam=0.0000` -- the FIRST increment cannot be taken
    at any step size. Residual stalls at ~7.4e6 N on the nodes bracketing
    SR2 and is independent of lam: halving the increment seven times
    reproduces the same plateau to three figures (7.131, 7.302, 7.388, 7.430,
    7.451, 7.459, 7.464 e6) while the correction grows 0.04 -> 0.05 -> 0.49
    -> 8.6 m.
  cause: >-
    FOUND, and recorded in full as L105: `lay_tension` took no `shift`, so
    the lay tension stayed on the same material while the terminal contact
    walked inboard, leaving a free cantilever of length `shift` with 100 MT
    on its tip. The eliminations below stand as the record of what was ruled
    out on the way, each measured rather than argued:
    (1) not an iteration or step-size shortage -- n_increments 20 -> 100 ->
    400, MAX_NEWTON 30 -> 200, cutback floor 1/64 -> 1/4096, pen_mult 1e3 /
    1e5 / 1e6, reg_mult 1e-9 / 1e-7 all die identically at lam=0.0000, and
    MAX_NEWTON is not even a failure path in `solve.passage` (an exhausted
    Newton loop commits its increment); (2) not the component -- plain pipe
    in the same scene fails at the same shift, and the shroud's own contact
    surface is irrelevant; (3) not the anchor failing to follow the sweep --
    re-pinning the FIXED restraint on the node whose material is under VR5
    at that shift changes nothing; (4) not one bad station -- dropping each
    of the eleven contact targets in turn still diverges; (5) not a mesh
    count -- the cliff is 2.68, 2.19, 2.47 and 2.78 m at element lengths
    0.41, 0.79, 1.24 and 1.59 m, so cliff/element runs 6.75 down to 2.00
    while the cliff in metres barely moves. The problem data itself is
    nearly identical across the cliff: at shift 0 against shift 6 every
    field of the `Problem` compares equal except the contact targets, and
    those differ ONLY in bracketing nodes and interpolation weights -- every
    `dn` is unchanged.
  rule_detail: >-
    Two measurements point at the free pipe the sweep leaves past the
    terminal slot, and one appears to contradict them; all three are
    recorded because the contradiction is not resolved. FOR: shifting by
    whole elements holds every slot's phase almost fixed (SR7 w_lo 1.0000,
    0.9936, 0.9871, 0.9807) while the free length grows 0, 0.79, 1.59, 2.38
    m -- and the cliff falls exactly there, at 2.38. FOR: the threshold
    moves the way a load-carrying limit should and not the way an
    arithmetic bug would -- R 70/85/120/200 m gives 2.3/2.7/3.2/4.4 m,
    tension 50/100/150/200 MT gives 3.8/2.3/1.6/1.3 m, spacing 6/9/12 m
    gives 3.5/2.3/2.3 m. AGAINST: giving a shift-0 model the same free
    length by hand, through `margin_stinger + extra`, converges at 1, 2,
    2.4, 2.5, 3 and 4 m of overhang. That test also re-meshes the scene,
    and `_required_stations` then puts a node exactly on the terminal slot,
    so it is not a clean control and does not settle it.
  rule: >-
    A sweep must assert what it leaves behind. `sweep.py` says "Material
    leaves the model at the stinger end and needs nothing there" and
    `check_reach` guards only the vessel end; the stinger end has no
    equivalent check, and the mesh is built once at shift 0 so the material
    past the terminal slot grows by exactly the travel. Whatever the
    mechanism turns out to be, the asymmetry is real and undefended. Until
    it is fixed, NO shroud or long-component case in this scene family
    produces a comparable envelope, and `completion` (L101) is what stops
    one being read as though it did.
  detect: '-'
  refs: [rebuild/slay/study/sweep.py, rebuild/slay/solve/passage.py, rebuild/slay/physics/contact.py]
  date: 2026-10-07

- id: L103
  area: measure
  class: finding
  symptom: >-
    `report.profile._world` places a sample at `(-(s + shift + ux), y + uy)`,
    advancing the pipe by adding `shift` to a STRAIGHT reference. Read
    quickly that looks like a horizontal translation, which would be wrong
    on the stinger, where the pipe runs at up to 44 degrees and material
    advances along its own axis. It is not wrong, and the claim that it was
    -- made in commit 8a2af25's message and in this session's chat -- is
    withdrawn.
  cause: >-
    The straight reference is the DECK, which is horizontal, and the
    reference is indexed by STATION, not by material. `arc_target_by_projection`
    is the authority and says so in one line -- `ux, uy = -(x - (-s)), y`
    with `(x, y) = path.position(s)` and `s` the station arc. So `dn` is the
    normal displacement from the reference point at `(-s, 0)` to the path
    point at `s`, and a material point that has advanced by `shift` bears on
    a station whose reference sits `shift` further along that horizontal
    line. `_world` adding `shift` is what keeps the report in the same frame
    the targets were built in. All the curvature lives in the displacement,
    which is the point of a corotational formulation; nothing is translated
    along the arc because nothing needs to be.
  rule_detail: >-
    MEASURED, not argued. If the placement drifted with travel, `off_arc`
    at a FIXED station would walk by roughly `shift * n_x` -- about 0.7 of
    the travel at SR7. Over S2-4's complete 6.877 m passage, twelve
    positions, `off_arc` at each station reads:
    SR4 35.5 .. 37.3 mm, SR5 63.8 .. 66.2, SR6 100.0 .. 103.5,
    SR7 126.4 .. 136.9. Flat to about 10 mm over 6.9 m of travel, against
    a predicted 4.8 m if the frame were wrong. SR3 swings 16 -> 71 -> 18 mm
    and is the component passing over it, which is the signal, not drift.
  rule: >-
    A frame question is answered by holding something fixed and sweeping the
    variable, not by reading the expression. The expression here is
    ambiguous to the eye and unambiguous to the test, and the test costs one
    run of a case that already exists.
  detect: '-'
  refs: [rebuild/slay/report/profile.py, rebuild/slay/physics/contact.py]
  date: 2026-10-07

- id: L104
  area: measure
  class: defect
  symptom: >-
    Every stinger roller showed the pipe lifted off it, in a sequence that
    grew down the stinger: at S2-6 shift 0, `off_arc` read SR2 3.9 mm,
    SR3 16.3, SR4 37.3, SR5 65.0, SR6 103.6, SR7 125.9 -- on a column whose
    schema says "0 means sitting on the rollers". The solver disagreed. At
    those same positions every one of SR2..SR7 was ACTIVE with a constraint
    residual of 0.00 mm. Spotted from the figure by eye, asked as "is this
    correct?", and it was not.
  cause: >-
    L099's magnitude was right and its DIRECTION was wrong. The reported
    centreline was lifted by `contact_offset * n`, along the LOCAL normal.
    `arc_target(R_eff, theta)` is the normal offset from a straight
    reference at arc length `R_eff * theta`, so by the projection identity
    the solved shape is a circle of radius R_eff TANGENT TO THE DECK, centre
    (0, R_eff); the roller-top locus is a circle of the same radius
    CONCENTRIC WITH THE AXLE ARC, centre (0, R). Those differ by (0, R-R_eff)
    at every angle and by nothing else, so the recovery is a rigid VERTICAL
    translation. Along the local normal it instead carries the pipe past the
    top by `contact_offset * (1 - cos theta)` -- 0 at SR1, 142 mm at SR7 on a
    70 m stinger -- and that overshoot is what `off_arc` reported as
    lift-off.
  rule: >-
    A rigid translation has a direction as well as a size, and the direction
    is the half that a deck-side check cannot see. Every test L099 shipped
    sat at theta = 0, where `contact_offset * n` and the vertical ARE the
    same vector, so all five passed against the defect for a day. A datum
    test must be written where the candidates disagree. Measured after the
    fix, `off_arc` at SR2..SR6 reads within 3 mm of zero at every converged
    position and SR7 within 17 mm, against 4 to 126 mm before.
  rule_detail: >-
    The solve was never touched and never wrong, which the numbers confirm
    from both ends: the constraint residual was already 0.00 mm, and the two
    circles differ by a rigid translation, which produces no strain. What
    moved is `x` and `y` on the geometry table, and `off_arc` with them --
    profile schema 1.6.0. Figures redrawn; no strain, moment or envelope
    anywhere in the ledger changes.
  detect: test_the_two_circles_differ_by_a_VERTICAL_translation, test_a_lift_along_the_LOCAL_NORMAL_overshoots_the_roller_top, test_at_theta_zero_the_two_lifts_agree, test_the_writer_lifts_vertically_not_along_the_normal
  refs: [rebuild/slay/report/profile.py, rebuild/slay/report/profile_schema.py, rebuild/tests/test_contact_datum.py]
  date: 2026-10-07

- id: L105
  area: physics
  class: defect
  symptom: >-
    THE L102 CLIFF, and its cause. Every passage in every scene stopped at
    the same TRAVEL -- plain pipe at R = 70, 9 m spacing, 100 MT converges to
    2.3 m and diverges from 2.4 m out to the full sweep, identically in
    scenes built for components of 2.642, 4.877, 8.128 and 21.946 m. Always
    `CUTBACK EXHAUSTED at lam=0.0000`: the first increment could not be taken
    at any step size, and no solver setting touched it -- n_increments 20 to
    400, MAX_NEWTON 30 to 200, cutback floor 1/64 to 1/4096, pen_mult 1e3 to
    1e6, reg_mult 1e-9 and 1e-7 all died the same way. Traced iteration by
    iteration, the Newton correction that blew up was ALWAYS the last node's:
    node 137 at s_material 54.388, the stinger end of the mesh, every time,
    at the solvable shift as well as the unsolvable one.
  cause: >-
    `lay_tension` took no `shift`. It chose its node by
    `|n.s - st.s_arc|` -- MATERIAL coordinates against a STATION arc -- so
    the full lay tension stayed bolted to the same piece of steel for an
    entire passage while the terminal contact slot walked inboard by the
    travel. Measured: at shift 0 the load node and the SR7 slot are both at
    s_material 54.388; at shift 6 the slot is at 48.388 and the load is
    still on 54.388, six metres outboard of the last contact. From the first
    position onward the model therefore carried a FREE CANTILEVER of length
    `shift`, unconstrained, with 100 MT on its unsupported tip in a fixed
    direction. Past about 2.4 m that configuration has no equilibrium, which
    is why the failure is at lam=0.0000 and why no numerical knob reaches it.
  rule: >-
    A station is a place on the STINGER; the pipe slides through it. Anything
    a station does to the pipe -- bear on it, pull on it -- acts on the
    material under it NOW, which is `station_material(...)[name] - shift`.
    That is the mapping `contact_targets` brackets its slots with and
    `study.sweep.critical_shifts` reads, and there must be ONE answer to
    "what steel is under this station", asked the same way by all three.
    `lay_tension` was the one caller that never asked. A function that takes
    no `shift` in a module whose every other shift-dependent quantity takes
    one is the shape of this defect, and worth grepping for.
  rule_detail: >-
    The threshold moved like a load-carrying limit and not like an
    arithmetic error, which is what made it look physical: R 70/85/120/200 m
    gave 2.3/2.7/3.2/4.4 m, tension 50/100/150/200 MT gave 3.8/2.3/1.6/1.3 m,
    spacing 6/9/12 m gave 3.5/2.3/2.3 m. All three are exactly how the
    critical length of a tip-loaded cantilever should move, and reading them
    as evidence of real physics was the wrong inference from the right
    numbers. After the fix the same ladders converge over the whole sweep.
    AT SHIFT 0 NOTHING MOVES -- the material under the LOAD station is the
    node the old code picked -- so no single-position result changes, but
    EVERY SWEPT RESULT AT SHIFT > 0 DOES, and the whole validation ledger is
    stale until it is re-run.
  rule_detail_2: >-
    TWO HALVES, and the second only shows in a chained sweep. Making the load
    follow the station fixed every FRESH solve -- the convergence ladder goes
    from a cliff at 2.3 m to the full 10.128 m sweep at R 70/85/120, tension
    100/120/200 MT and spacing 6/9/12 m alike -- but the load was still
    SNAPPED to the nearest node, so it jumped a whole element between
    positions. `solve.passage` applies loads at full value from the first
    Newton iteration and cutback scales only the contact targets, so a jump
    of 100 MT across an element is unrampable by construction. It is now
    interpolated across the bracketing nodes, through the same `_bracket` and
    `header_nodes` the contact slots use, because there must be one
    bracketing rule and not two (L048, L095).
  rule_detail_3: >-
    `differs_only_in_contact` had to be widened, and it is worth saying why
    that is not a weakening. It asserted that two Problems at different
    shifts share every load. Read as a rule about the LOAD VECTOR that is
    what froze the tension; read as a rule about the MODEL it should always
    have admitted the one load a STATION applies. The predicate now allows
    the lay tension to move along the pipe, requires its RESULTANT to be
    unchanged, and still requires every other load -- self weight, an ILS's
    point masses -- to be identical.
  detect: test_the_tension_node_moves_with_the_sweep, test_the_tension_slides_between_nodes_instead_of_jumping, test_at_shift_zero_the_tension_lands_where_it_always_did, test_the_tension_lands_on_the_terminal_contact_not_past_it, test_the_passage_no_longer_dies_at_two_and_a_half_metres
  refs: [rebuild/slay/physics/loads.py, rebuild/slay/physics/problem.py, rebuild/slay/study/sweep.py, rebuild/tests/test_passage_completion.py]
  date: 2026-10-07

- id: L106
  area: solve
  class: defect
  symptom: >-
    With L105 fixed, EVERY shroud case sweeps its full travel in mode B --
    S2-8's 23.946 m included -- and mode A, the chained path every study
    actually runs, still truncates. Measured, as travel swept: plain pipe
    100/100%, S2-4 100/100%, S2-1 35/100%, S2-3 24/100%, S2-6 16/100%,
    S2-8 10/100% (mode A / mode B). S2-1 is a REGRESSION: it completed its
    4.642 m before L105 and now stops at 1.626 m. Mode B completing every
    case is what makes this a solver failure and not a modelling one -- an
    equilibrium exists at every position and mode A cannot reach it.
  cause: >-
    The carried PLASTIC STATE, isolated by substitution rather than
    inferred. Solving S2-6's position 5 from position 4's full state gives
    CUTBACK EXHAUSTED at lam=0.0000; from the same displacements with
    `plastic=None` it converges in 20 increments with no cutbacks; from
    virgin state, in 40. Resetting the active set, dropping to PEN_FIRST and
    raising n_increments to 200 all change nothing. The residual sits at
    nodes 78 to 80, s_material 6.8 to 8.4 m -- the shroud's own taper, where
    the carried plastic strain peaks at 0.728% as V = 2 D forces the pipe
    over it. Past that hinge the tangent is soft and Newton OVERSHOOTS: the
    corrections run 0.04, 0.05, 0.49, 8.5 m.
  rule_detail: >-
    A STEP CAP WAS TRIED, REJECTED ON ONE CASE, AND THEN KEPT, and the whole
    sequence is recorded because the error in the middle is the instructive
    part. Limiting a Newton correction that exceeds DIVERGENCE_DU to half of
    it, engaged only where the old code failed outright, moves S2-6 from
    lam=0.0000 to lam=0.1000 after 213 capped steps and no further. Measured
    on S2-6 ALONE that reads as "buys one increment, not a passage", and it
    was removed on that reading while the sweep commissioned to judge it was
    still running. The sweep then said: mode A goes from two of six cases
    complete to four of six -- S2-3 from 24% to 100% and S2-8 from 10% to
    100%, with S2-1 and S2-6 unmoved. S2-6 is one of the two it does not
    help. The cap was restored. A change is judged on the set it was
    measured against, not on the first case to hand.
  rule_detail_4: >-
    THE CAP DOES CHANGE WHAT NEEDS A SEED, which had to be established and
    not assumed. It made `test_seed_state`'s 160 MT corner converge directly,
    so three tests asserting that case needs the seed became false. A 54-point
    grid over OD (168.3 / 273.1 / 406.4 mm), R (50 / 60 / 70 m), spacing
    (9 / 12 m) and tension (160 / 200 / 260 MT) leaves 14 corners still
    failing a direct solve, so `seed_state` is not dead code and the tests
    were repointed at 200 MT -- the same corner one notch further in --
    rather than deleted.
  rule: >-
    EVERY LOAD PATH NEEDS A CUTBACK, and this one had none. `solve` cuts back
    `lam`, which scales the contact targets alone; what MOVES those targets
    is the advance between two positions, and nothing below the study layer
    knows a sweep is happening, so nothing below it can shorten that advance.
    The sweep owns the schedule, so the sweep owns the cutback: a chained
    position that fails now gets the midpoint inserted and is retried from
    the same state, down to a floor of step/64. The guessed remedies -- line
    search, arc-length control, re-applying plastic strain from a virgin
    restart -- were all aimed at the Newton loop, and none of them was
    needed. The question "which quantity is too large, and who is allowed to
    shrink it" came first and answered it.
  rule_detail_5: >-
    THREE MEASUREMENTS BEFORE ANY CODE, each ruling out a different suspect.
    (1) The committed state is a true equilibrium, so this was not a
    state-commit bug: re-posing position 4's own problem and re-solving from
    the state it returned reconverges at residual 1.6e-07 with |dU| 1e-06 m.
    (2) The kernel forms a CONSISTENT elastoplastic tangent,
    E_t = E H / (E + H), so it was not a wrong-tangent problem. (3)
    Bisecting the one failing advance, 1.6256 -> 2.4384 m: one step of
    0.8128 m fails, two of 0.4064 m reach the same position, as do four,
    eight and sixteen. Independently, a uniform schedule at 1 x OD instead
    of 2 x OD carries S2-6 the whole 10.128 m in 29 positions with no code
    change at all.
  rule_detail_6: >-
    AFTER, every case completes in BOTH modes: plain pipe, S2-1, S2-4, S2-3,
    S2-6 and S2-8 all 100% of their travel, against 100/35/100/24/16/10% in
    mode A before. A halved position is KEPT, not used as scaffolding -- the
    pipe passes through it -- so the envelope is taken over more of the
    passage rather than less, while `completion` still measures travel and a
    sweep that needed sub-steps reports the same total as one that did not.
  detect: test_a_failed_advance_is_halved_and_retried, test_the_halved_positions_are_KEPT_not_scaffolding, test_bisection_stops_at_the_floor_instead_of_halving_forever, test_mode_B_does_not_bisect
  refs: [rebuild/slay/study/sweep.py, rebuild/slay/solve/passage.py, rebuild/tests/test_passage_completion.py]
  date: 2026-10-07

- id: L107
  area: process
  class: defect
  symptom: >-
    EVERY Paper 2 number recorded in the ledger before 7 Oct 2026 was
    computed at 120 MT lay tension. Paper 2 states `Pipeline Tension 100 mT`
    in all three of its parameter blocks -- EA-ST (Sec. VII.A), EA-SB
    (Sec. VIII.A) and the branch study. Six published cases and six PS
    predictions, all run at a fifth too much tension. Found by reading the
    paper on the day it was supplied, not by any check in the repository.
  cause: >-
    `tools/study_f2.py` and `tools/study_easb_cases.py` both carried
    `tension = arg('--tension', float, 120.0)`. 120 MT is the Paper 1
    figure and was copied across when the Paper 2 runners were written from
    the Paper 1 ones. Nothing in the repository knew what Paper 2's tension
    was, because the paper itself was not in the repository -- only the case
    tables had been transcribed, and a case table does not carry the
    parameter block. So the wrong default was unfalsifiable here: no test
    could have caught it, and the agreement figures it produced were
    plausible (-3.5% on EA-ST Case 1) rather than obviously broken.
  cause_detail: >-
    THE SIZE OF THE ERROR IS NOT THE POINT. Re-running at 100 MT moves
    EA-ST Case 1 from -3.5% to -5.3% and Case 2 from +13.5% to +8.8%, so the
    EA-ST band TIGHTENS from (-3.5, +13.5) to (-5.3, +8.8); all four EA-SB
    cases move 2-5 points further negative (F2 Case 2 -9.6 -> -14.4%, F2
    Case 1 -42.4 -> -45.4%, F2 Case 3 -40.4 -> -42.8%, F1 Case 1
    -59.1 -> -61.3%). The EA-SB scatter -- -14.4% beside -45.4%, -42.8% and
    -61.3% -- is UNCHANGED in character, so the tension was never the cause
    of it. Every one of those twelve numbers was nonetheless being compared
    against a paper it did not correspond to.
  rule: >-
    A VALIDATION PARAMETER THAT CAME FROM A PAPER MUST NAME THE PAPER AND
    THE PLACE IN IT. A bare numeric default in a runner is an unsourced
    claim, and when the source document is absent from the repository it is
    an unfalsifiable one. The two Paper 2 runners now default to 100.0 with
    the three parameter-block locations in a comment beside them. More
    generally: transcribing the case tables out of a paper is not
    transcribing the paper -- the parameter block that every case shares is
    exactly the part a per-case table omits, and is therefore the part most
    likely to be carried over wrong from whichever runner was copied.
  rule_detail: >-
    THE TRANSCRIPTION AUDIT CAME BACK CLEAN, which is why this entry is
    about the parameter block and not the tables. Against the supplied PDF:
    EA-ST F2 (P_c1 10D/20D, kT 2.22/2.85, published 0.936/0.043/0.732 and
    1.41/0.075/1.021), EA-SB F1 Case 1 (P_l1 5D, P_l2 2.5D, P_v 2D, kB 3.2,
    published 2.30/1.41) and EA-SB F2 Cases 1-3 (2.24/0.086/1.45,
    2.40/0.086/1.52, 2.53/0.085/1.60) all match the ledger exactly. The
    paper also confirms two conventions the ledger had listed as open:
    "Nominal Strains at element integration points are reported here", and
    that bulkheads and thick inline components are intentionally not
    modelled, so "Reported strains are for relative comparison (pattern
    recognition), not absolute code compliance."
  detect: '-'
  refs: [tools/study_f2.py, tools/study_easb_cases.py, docs/validation/VALIDATION_v3.0_2026-10-06.md]
  date: 2026-10-07

- id: L108
  area: process
  class: defect
  symptom: >-
    `emit_profile._extra` stopped matching EVERY upper-case flag at once --
    `--V`, `--L1`, `--L2`, `--P-v`, `--P-l1`, `--kB-ratio` -- and returned
    None instead. `emit` reads None as "no dimensions were asked for" and
    answers with the archetype's default geometry, so a shroud run asked for
    V = 2 D, L1 = 25 D would have solved V = 1 D, L1 = 10 D and reported a
    peak strain for it with nothing on the artifact to say which geometry it
    was. Three runners pass exactly those flags: `study_table_xxxi.py`,
    `study_table_xxxii.py` and `study_table_xxxix.py`.
  cause: >-
    Introduced at b5e2b79 with the dotted component names. `TP.centre_x` has
    to read as `--tp-centre-x`, so the flag was built with
    `k.replace('_','-').replace('.','-').lower()` -- and the `.lower()` was
    applied to the FLAG while `argv` was left as the caller wrote it. Every
    dimension whose name carries a capital stopped matching. The dotted
    names it was added for kept working, because they are lower case after
    the transform anyway, so the change looked correct in exactly the cases
    it was written for.
  cause_detail: >-
    LIVE FOR TWO AND A HALF HOURS AND IT COST NOTHING, by coincidence rather
    than by design, which is the only reason this is a near-miss and not a
    retraction. The one campaign run inside that window was TABLE XXXIX and
    XLI (85c6c0a), and `study_table_xxxix.py` holds the shroud at
    SH = (V 1 D, L1 10 D, L2 2.5 D) = (0.4064, 4.064, 1.016) m, which is
    EXACTLY the ILS-SH fixture default. Verified rather than assumed: the
    two code paths the bug chooses between -- `build_component_ils` on the
    defaults, and `_ea_ils` with the three values supplied -- were built
    side by side and compared, and they agree on extent, pipe OD, wall and
    every component field. TABLE XXXI and XXXII, which DO ask for
    non-default V, L1 and L2 (up to V = 2 D, L1 = 50 D), were both run
    before b5e2b79. No published number in the ledger is affected.
  rule: >-
    A FLAG IS PART OF THE MODEL (L094's rule) AND SO IS ITS SPELLING. `_extra`
    now lower-cases a copy of `argv` and matches against that, so a dimension
    answers to any case the caller writes -- `--V`, `--v`, `--TP-CENTRE-X`.
    The generic rule is narrower than it looks: a silent default-fallback is
    the failure mode to design against, because `_extra` returning None is
    indistinguishable from a caller that asked for nothing. Three tests now
    hold it: every dimension round-trips through the dot-and-underscore
    spelling, every dimension round-trips in three cases, and the exact
    mixed-case command line the three shroud runners send is asserted
    verbatim. That last one is the point -- L108 survived its own commit
    because every existing test built its flags with the same generic
    expression the code did, so code and test were wrong together, and no
    test used the spelling a real caller sends.
  detect: test_a_flag_matches_whatever_case_it_is_written_in, test_the_flags_the_shroud_RUNNERS_ACTUALLY_PASS_are_picked_up, test_every_component_dimension_has_a_flag_that_round_trips
  refs: [tools/emit_profile.py, rebuild/tests/test_emit_profile_cli.py]
  date: 2026-10-07

- id: L109
  area: solve
  class: defect
  symptom: >-
    `sweep.run` forced the feedstock buffer elastic and supported with two
    `setdefault` calls on `problem_kw`. A caller passing its own
    `elastic_spans` therefore REPLACED the buffer's span rather than adding
    to it, and the buffer became plastic. Latent until 8 Oct 2026, because
    no caller had ever passed one -- GD-Simple's elastic body is the first.
  cause: >-
    `setdefault` reads as "the buffer unless the caller has an opinion", and
    the buffer is not an alternative to anything the caller wants: it is 20 m
    of feedstock that is not part of the answer. Four tools re-posed the same
    problem for reporting with the same two values hard-coded, so the same
    assumption was made in five places and could be broken in five places.
  cause_detail: >-
    WHAT IT WOULD HAVE COST, had it fired: a plastic hinge in the buffer,
    carried forward by mode A's chained state into every later position, and
    visible nowhere. `sweep`'s own docstring already said why the buffer must
    stay elastic -- "a plastic hinge in the buffer would be carried forward
    into every later position by the chained state" -- so the requirement was
    written down correctly and implemented in a way that could silently drop
    it. It would also have broken the reporting re-pose against the solve:
    `differs_only_in_contact` compares `elastic_spans`, so the two would
    rightly be judged different problems.
  rule: >-
    THE BUFFER IS ADDED, NEVER DEFAULTED. `sweep.with_buffer(scene,
    problem_kw, **more)` is now the single place both values are merged --
    spans de-duplicated, so it is idempotent and order-free -- and every site
    that poses a problem for a scene goes through it: `sweep.run` and the
    four reporting re-poses in `slide.py`, `emit_profile.py` and
    `plot_stinger.py` (twice). `emit_profile.emit` gained one `problem_kw`
    passthrough reaching BOTH its sweep and its re-pose, because handing the
    two different spans or different moduli makes them different problems.
    Generally: where a driver adds something the physics requires, merge it
    with what the caller asked for; `setdefault` silently makes the two
    alternatives.
  detect: test_with_buffer_ADDS_the_buffer_span_instead_of_replacing_it, test_with_buffer_is_idempotent_and_order_free, test_the_kernel_gets_THREE_materials_the_body_elastic_at_its_own_E
  refs: [rebuild/slay/study/sweep.py, tools/slide.py, tools/emit_profile.py, tools/plot_stinger.py, rebuild/tests/test_simple_component.py]
  date: 2026-10-08

- id: L110
  area: model
  class: ruling
  symptom: >-
    GD-Simple was specified as a new component type -- an elastic pipe body
    of the pipeline's own section, with a free modulus, over an offset
    shroud -- and "ils_builder needs to include this component". It cannot,
    here.
  cause: >-
    `component_spec.py`, `ils_builder.py` AND
    `fixtures/standard_ils_layouts.json` are all mirrored from
    Slay-ILS-Designer-V1.0 and hashed in `fixtures/mirror_provenance.json`
    (G7). A new component class, a new builder branch and a new archetype in
    the fixture are each a guardrail violation, caught by
    `test_config_ownership.py`. The fixture being mirrored DATA is the part
    easy to miss: adding an archetype looks like configuration, not code.
  rule: >-
    GD-SIMPLE IS A COMPOSITE DECLARED IN `slay/define/simple.py`, out of two
    codes the mirror already has, handed to the mirrored builder. No mirrored
    file is touched and `ils_builder` stays the author of what a component
    IS. The pipe body is a NEUTRAL GD-TP -- `t_comp == t_pipe` exactly, which
    `ThickPipeBody.validate` was relaxed from `>` to `>=` on 5 Sep 2026
    expressly to allow: "EQUAL is now legal and means a NEUTRAL section". It
    owns the section over its span without stepping it, which is what gives
    the body an `owner` tag for the modulus and an extent for the regions.
    Ownership must be LOWEST, not STRICT, since body and shroud both claim
    contact where they overlap.
  rule_detail: >-
    THE TWO HALVES GD-SIMPLE NEEDS ARE NOT IN THE MIRROR AND MUST NOT BE
    FAKED WITH `stiffness_ratio`. A ratio scales EA and EI together on an
    UNCHANGED yield surface -- right for a structural member that is only
    ever a stiffness, wrong for a body whose modulus moves while its steel
    keeps its strength, because the yield STRAIN would move with it. So the
    modulus is a per-owner override in `physics.sections` (`E_by_owner`) and
    the constitutive law comes from `Problem.elastic_spans`, which the kernel
    already keys materials by -- `(E, elastic)` -- so NO kernel change was
    needed and G6 stands. Supplying both a ratio and an explicit modulus for
    one owner is refused rather than multiplied, and an override matching no
    element is refused rather than ignored: it would otherwise leave the body
    on the pipeline modulus and report a number for the wrong material.
  rule_detail_2: >-
    THE REGION SCHEME IS Xb / Xe AND IT IS DRAWN ON THE BODY, NOT THE SHROUD.
    `L_body` and the shroud's `L1`/`L2` are independent by decision, so
    keying Xb on the shroud would report the elastic span as whatever the
    shroud happened to be. `SimpleGeometry` subclasses `OffsetGeometry` so
    the inherited four `s_*` fields stay the SHROUD footprint that
    `body_peaks` and the `peak_on_shroud` column already read, and only
    `bounds` differs. Xe appears TWICE in that partition, once each side, and
    is kept that way: it is the complement of Xb, so no single interval names
    it and `region_peaks` carries both in `spans`. `body_covers_shroud` says
    whether Xb contains the whole elevated zone; FALSE means part of the lift
    is in Xe and the two regions are no longer "component" and "pipeline".
  rule_detail_3: >-
    THE CONTROL IS E = STEEL_E AT A RADIUS THAT DOES NOT YIELD, and the
    obvious control is wrong. At the pipeline's own modulus the body differs
    from plain pipe in one way only -- it cannot yield -- so where nothing
    yields it must vanish: measured Xb 0.2031% against Xe 0.2031%, ratio
    1.000, at R = 250 m. The SAME case at R = 85 m gives Xb 0.3161% against
    Xe 1.1110%, ratio 0.285, and that is a RESULT and not a defect: the pipe
    either side is plastic at 1.1% with its tangent collapsed to E*H/(E+H),
    while the body stays on the full 210 GPa, becomes the far stiffer member,
    takes more moment (1451 against 1361 kN.m) and sheds curvature outboard.
    A bare shroud of the same V, L1 and L2 peaks at 0.8223%, so inserting a
    non-yielding body of the pipeline's OWN section makes the adjacent pipe
    35% worse. Xb < Xe is therefore the normal reading once the line is
    plastic. `tools/study_simple.py` said the opposite when first written and
    was corrected the same day; a docstring that calls a real result a defect
    is worse than no docstring.
  detect: test_the_body_carries_the_PIPELINE_section_and_steps_nothing, test_at_E_equal_to_the_pipeline_and_no_yielding_the_body_vanishes, test_a_shroud_with_a_THICK_body_in_it_is_not_a_GD_Simple, test_an_override_that_matches_no_element_is_REFUSED_not_ignored
  refs: [rebuild/slay/define/simple.py, rebuild/slay/physics/sections.py, rebuild/slay/report/regions.py, tools/study_simple.py, rebuild/tests/test_simple_component.py]
  date: 2026-10-08

- id: L111
  area: model
  class: ruling
  symptom: >-
    A simplified ILS was wanted: take any real layout, reduce it to an
    equivalent GD-Simple, and explore it before the hardware exists. The
    exact equivalent of a GD-TP is a shroud with NO taper, and L2 = 0 cannot
    be built.
  cause: >-
    `OffsetShroud.validate` refuses it -- "GD-SH: V, L1 and L2 must be
    positive" -- in `component_spec.py`, which is MIRRORED (G7). The floor
    cannot be moved here. Confirmed against the mirror directly rather than
    inferred: L2 = 0 raises GeometryRuleError, L2 = 1e-9 is accepted.
  rule: >-
    `TAPER_MIN = 1.0e-4` m, which is `report.regions.FLAT_TOL` reused rather
    than a second number chosen for the same job -- "far below any geometry
    we model and far above float noise". A 0.1 mm taper is a step at every
    scale the model works at, and `simple_geometry` measures such a shroud
    as all-flat, which is the intent. A zero taper needs raising upstream;
    `parameters(L2=0)` refuses with that reason attached, so the next reader
    does not re-derive it.
  rule_detail: >-
    THREE EQUIVALENCES, AND THE THIRD DOES NOT HOLD. Length is exact and
    depth is exact. Stiffness is exact in BENDING only: setting
    E = E_steel * I_comp / I_pipe reproduces EI on the pipeline section, and
    EA then comes out as E * A_pipe, which is not E_steel * A_comp because
    A_comp/A_pipe and I_comp/I_pipe are different ratios. One modulus cannot
    match two stiffnesses. The axial error is carried on the result
    (`EA_error`) rather than left to be discovered, and it GROWS WITH THE
    WALL because area grows faster than the second moment that sets E_equiv:
    +6.2% at 32 mm, +12.0% at 42, +18.8% at 53, +26.6% at 65. EI is the one
    matched because the overbend is displacement-controlled bending.
  rule_detail_2: >-
    EVERYTHING IS MEASURED OFF THE BUILT ASSEMBLY, never read from the spec
    -- `section_at` for the section and its owner, `contact_at` for the
    surface a roller would touch. The same rule `report.regions` follows,
    and for the same reason: `ils_builder` is the author of what a component
    IS (G7), so a reduction computed from the definition would describe the
    component asked for rather than the one built. The payoff is that the
    depth rule needs no formula: `contact_at` returns 235.2 mm for the 53 mm
    wall, which IS OD_comp/2, without this module writing that down -- so
    the same code reduces whatever the builder actually made.
  rule_detail_3: >-
    REFUSED RATHER THAN APPROXIMATED, each by name: a tapered body (GD-TT
    carries 1005 diameters over its span, and which average is right depends
    on where the curvature is), two section-owning bodies (combining
    stiffnesses in series along the pipe has no implemented rule), a layout
    with no section owner (a bare GD-SH or an EA structure -- nothing to
    reduce), and a body that owns a section but no contact (ILS-SHTP's thick
    pipe sits inside a shroud, so its depth is not what a roller touches and
    reducing it as though it were would put the stand-in at the wrong
    elevation). Each refusal names the missing rule, not just the failure.
  rule_detail_4: >-
    TWO FIGURE DEFECTS, BOTH FROM NOT MEASURING THE INSTRUMENT. The
    reduction's self-check compared the built lifted length against the
    asked length with a budget of two tapers plus FLAT_TOL, and refused a
    CORRECT 2.5 D build that came back 0.508 mm short -- the budget left out
    the sampling grid, whose two end samples each sit up to one interval
    (0.254 mm) inside the true edge. The check was tighter than the
    instrument. Separately the figure computed its own vertical exaggeration
    as the reciprocal, from an axes box read BEFORE `tight_layout` moved it,
    and printed "x0"; it is now measured after layout, and reported as a
    scale ratio because on the 2.5 D cases it is 0.6 -- COMPRESSED, where
    the word "exaggeration" would have been wrong.
  detect: test_depth_is_the_bodys_OWN_contact_surface, test_bending_stiffness_is_reproduced_exactly, test_axial_stiffness_is_WRONG_and_reported, test_a_zero_taper_is_refused_with_the_reason, test_a_body_that_owns_no_contact_is_refused
  refs: [rebuild/slay/define/simplify.py, tools/simplify_ils.py, tools/plot_simple_ils.py, rebuild/tests/test_simplify.py]
  date: 2026-10-08

- id: L112
  area: measure
  class: finding
  symptom: >-
    An EA-ST cannot be reduced the way a GD-TP is. `simplify.equivalent`
    refuses it -- "nothing in this assembly owns a section" -- because its
    stiffness is in a FRAME tied to the pipe at two connectors and
    `section_at` returns the plain pipeline everywhere along it. There is no
    section to read EI off.
  cause: >-
    Two structurally different reductions, not one with a wider input. A
    GD-TP changes the pipe wall; an EA structure changes nothing about the
    pipe and adds stiffness in parallel, through discrete attachments.
  rule: >-
    MEASURE IT WITH A RIG (`tools/stiffness_rig.py`). Pure bending over the
    span between the two pipeline-side connector nodes: equal and opposite
    token moments, rigid-body restraint only, gravity off, no lay tension,
    linear elastic. The span then carries constant M, so EI_eq = M*L/dtheta
    IN CLOSED FORM. No search loop: one that stopped when the rotation
    "almost" matched would be choosing its own tolerance where an exact
    inverse exists. Measured EA-ST F2: 8.415 x EI_pipe at P_c1 = 10 D
    (E_eq 1767 GPa) and 12.168 x at 20 D (E_eq 2555 GPa).
  rule_detail: >-
    THREE CHECKS, ALL PRINTED, NONE ASSUMED. Linearity: EI at 2M against EI
    at M, -0.029% and -0.073%, so the connectors are not slipping and one
    equivalent E is meaningful. Boundary: a clamped end against the
    self-equilibrating pair agrees to -0.000%, so the clamp imposes no local
    restraint the span can feel. Control: plain pipe through the same rig
    against analytic E*I. A rig that cannot reproduce a known answer proves
    nothing about an unknown one.
  rule_detail_2: >-
    THE QUADRATURE IS NOT THE DEFAULT, and the obvious correction is wrong.
    `solve`'s default polar scheme -- the B31-equivalent angular integration
    the reference runs use -- reads the plain-pipe control 0.2955% LOW, a
    fixed bias independent of length and mesh. SELF-CALIBRATING IT AWAY
    OVER-CORRECTS: taking the ILS stiffness as a ratio to the rig's own
    plain-pipe figure gives 8.436 where the truth is 8.415, because the
    frame members are not the pipe section and do not carry the same bias. A
    bias is only cancellable by a ratio when it is COMMON to both terms. Use
    `polar=False, n_fibres=20`, the converged Cartesian scheme, which reads
    the control to +0.0002%.
  rule_detail_3: >-
    AN EA-ST NEEDS NO SHROUD, measured rather than assumed: `contact_at` on
    an ILS-EAST returns the plain pipe 0.2032 m with owner 'pipe' at every
    station. A top structure changes nothing a roller touches, so there is
    no lift to reproduce, and a shroud put there anyway would need V = OD/2
    for zero lift -- a component doing nothing while still owning contact.
    `define.simple` and `report.regions.simple_geometry` both gained a
    body-only path; V, L1 and L2 are now all-three-or-none, because two of
    them is a half-stated component and defaulting the third would invent
    geometry nobody asked for. Without a shroud the inherited `s_*`
    footprint fields are set to the BODY deliberately, since `body_peaks`
    and `peak_on_shroud` read them as "the component's footprint" and for a
    body-only GD-Simple the body is the whole footprint.
  detect: test_a_top_structure_changes_nothing_a_roller_touches, test_a_body_only_GD_Simple_builds_and_has_no_shroud, test_the_body_only_case_still_gets_Xb_and_Xe, test_a_half_stated_shroud_is_refused
  refs: [tools/stiffness_rig.py, rebuild/slay/define/simple.py, rebuild/slay/report/regions.py, docs/simple/RESULTS_EAST_F2_2026-10-08.txt]
  date: 2026-10-08

- id: L113
  area: measure
  class: finding
  symptom: >-
    The simplified model's ~2% low bias on peak strain, recorded as Sec. 6
    limit 5 and unexplained there, does NOT appear in the EA-ST family.
  cause: >-
    Measured across twelve cases spanning EI/EI_pipe from 1.664 to 12.168.
    The GD-TP family sits at -2.10, -2.07 and -2.33 per stiffness group --
    FLAT across a factor of 2.6 in stiffness -- with all nine on the same
    side. The two EA-ST cases STRADDLE ZERO (-0.8 and +3.8). So the offset
    does not follow the modulus; it follows the FAMILY.
  rule: >-
    TWO THINGS ARE NOW ESTABLISHED AND ONE IS A HYPOTHESIS.
    Established: accuracy does not degrade with stiffness ratio -- over a
    factor of seven in EI the peak error stays inside +/-4%, which was the
    obvious thing to fear and is not happening. Established: the bias is a
    property of the GD-TP reduction and not of the method, so Sec. 6 limit 5
    should not be read as a blanket "simplified strains run 2% low".
    HYPOTHESIS, on two points and untested: what differs between the
    families is the SHROUD. The GD-TP stand-in has one, to reproduce lift;
    the EA-ST stand-in has none, because a top structure lifts nothing. So
    MATCHED DEPTH IS NOT MATCHED CONTACT GEOMETRY -- a GD-TP presents the
    roller a CYLINDER of radius 235.2 mm while the shroud presents a FLAT at
    the same depth, and as the pipe rotates through a roller the two do not
    track the same effective lift. Small, one-signed, present only where a
    shroud is used: the right signature. It is labelled a hypothesis
    wherever it appears and must not be cited as a cause until tested.
  withdrawn: >-
    REFUTED 8 Oct 2026, the same day, by EA-SB F2 -- see L114. EA-SB HAS a
    shroud and biases +8.37%, the OPPOSITE WAY from GD-TP's -2.17%. One
    mechanism in the shroud cannot produce a bias that is negative in one
    family and positive in another. The two ESTABLISHED halves of this entry
    stand: accuracy does not degrade with stiffness ratio, and the -2% bias
    is a GD-TP family property rather than the method's. Only the proposed
    CAUSE is withdrawn.
  detect: '-'
  refs: [docs/simple/RESULTS_EAST_F2_2026-10-08.txt, docs/validation/VALIDATION_v3.0_2026-10-06.md]
  date: 2026-10-08

- id: L114
  area: measure
  class: finding
  symptom: >-
    Three component families reduced to ILS-SIMPLE now show three DIFFERENT
    error signatures on peak strain, and they do not line up with anything
    simple. GD-TP (nine cases, shroud present): mean -2.17%, band -3.3 to
    -1.0, every one LOW. EA-ST (two, no shroud): -0.8 and +3.8, straddling
    zero. EA-SB (three, shroud present): mean +8.37%, band +6.5 to +10.2,
    every one HIGH.
  cause: >-
    Not established. What IS established is what it is not: L113's proposed
    cause -- the shroud's flat standing in for the original's cylinder at
    matched depth -- is REFUTED. GD-TP and EA-SB both carry a shroud and
    bias in OPPOSITE directions, and one mechanism cannot do that. The
    hypothesis was recorded one commit earlier on two EA-ST points and was
    killed by the first family that tested it, which is the correct
    lifetime for a hypothesis but a short one.
  cause_detail: >-
    EA-SB IS THE FIRST GENUINELY COMBINED REDUCTION and the first case where
    `body_covers_shroud` is FALSE on real geometry: the stiffened span is the
    connector span (5 D, 10 D) while the lifted footprint is 13.7 D or
    18.7 D, and the two are independent rather than coincident as they are
    for a GD-TP. Both measurements behaved: the rig's linearity check ran
    +0.011 to +0.032% and its boundary check -0.000% on all three, and the
    rig correctly read Case 3 as LESS stiff than Case 2 (6.289 against
    7.870 x EI_pipe) at the same connector span and kB, because its base is
    longer and that is a different frame. So the offset is not an artefact
    of the extraction.
  rule: >-
    TWO CANDIDATES REMAIN, BOTH UNTESTED, AND NEITHER MAY BE CITED AS A
    CAUSE. (1) THE LOAD PATH, which differs only for EA-SB: in the real
    structure the roller bears on the FRAME and reaches the pipe only at the
    two connectors, while in the stand-in the shroud is clamped to the pipe
    and transfers roller load CONTINUOUSLY along 13.7 D. That has no
    counterpart in the GD-TP family, where the body IS the pipe and transfer
    is continuous in both. (2) THE STIFFENED SPAN: the reduction stiffens
    only between the connectors, right for a top structure attached at two
    points, and it is not established whether a base structure bearing along
    its whole length puts bending stiffness into the pipe outside that span.
    Until one is tested, a simplified EA-SB peak should be read as running
    roughly 8% HIGH -- which is the usable statement, and the opposite
    direction to the GD-TP correction.
  rule_detail: >-
    THE GENERAL LESSON IS ABOUT THE SHAPE OF THE EVIDENCE. Nine GD-TP cases
    all low looked like one cause; two EA-ST cases straddling zero looked
    like the cause was the shroud; three EA-SB cases all high showed it was
    not. A tight one-signed band within a family says there is one mechanism
    IN THAT FAMILY; it says nothing about which. Reducing a second family is
    what tests a cause, and reducing a third is what killed the answer the
    second one suggested.
  detect: '-'
  refs: [docs/simple/RESULTS_EASB_F2_2026-10-08.txt, docs/simple/RESULTS_EAST_F2_2026-10-08.txt, docs/validation/VALIDATION_v3.0_2026-10-06.md]
  date: 2026-10-08

- id: L115
  area: process
  class: ruling
  symptom: >-
    The four-step staged sequence -- the cross-check that reproduces the
    reference `run_slay` within 1.7% and is quoted in RESULTS.md, two
    validation ledgers, T5 and this register -- lived entirely in
    `tools/stage_run.py`. Nothing but that script could call it,
    `check_layers` did not police it, and it carried THREE copies of library
    code to work.
  cause: >-
    It was written as a driver and grew into a workflow without moving. The
    copies: `all_bidirectional`, which `scene.scene` already had and which
    `study.sweep` already imported; the reporting window `report_zone`; and
    the constant `DROP_AT_TIP`. THE COPIES WERE NOT EQUIVALENT --
    `report.passage.zone` RAISES on a scene with too few stinger rollers,
    where the copy silently indexed `sr[-3]` -- so the weaker of each pair
    was the one in use. `scene.all_bidirectional`'s own docstring already
    cited "step 1 of the staged sequence", so the library knew about the
    workflow that had never adopted it.
  rule: >-
    `study` IS WHERE AN ORDERED SERIES OF PROBLEMS SOLVED WITH CHAINED STATE
    LIVES. That is what `sweep.run` is and the staged sequence has the same
    shape; it differs only in what varies between steps -- a sweep moves the
    pipe, this turns loads and the material on. It is now
    `slay.study.staged` (Mode S), and `_layers.py` says so rather than
    naming only sweeps. The split that remained: the CLI, the printing and
    `station_profile` stayed in `tools/stage_run.py`, because presenting
    `result.strains` for a reader is a tool's job and measuring is not.
  rule_detail: >-
    THE LAYER RULE DID THE DESIGN WORK. `report` is ABOVE `study`, so
    `study.staged` CANNOT call `report.passage.zone`. That is why the
    duplicate window was DELETED rather than moved: it was never this
    layer's to own. The sequence returns posed Problems and Results and the
    caller reports them, exactly as `sweep.run` does. A rule that forces a
    better shape is worth more than one that merely forbids a worse one.
  rule_detail_2: >-
    POSING IS SEPARATE FROM SOLVING. `problems()` returns the four Problems
    unsolved, so the sequence can be inspected, diffed or re-posed without a
    solver -- and that is what made the new assertions possible: steps 3 and
    4 differ ONLY in the material, checked field by field, where before
    "everything else held" was a docstring claim nobody could test. `STEPS`
    is a tuple rather than a function body so a caller can read what is
    about to run.
  rule_detail_3: >-
    THE ACCEPTANCE TEST EXISTED BEFORE THE REFACTOR, which is what made it
    safe rather than speculative. `test_stage_run.py` pins the numbers that
    reproduce `run_slay`. Baseline captured first at R = 70, 85 and 105;
    afterwards all three were BIT-IDENTICAL -- 0.519722%, 0.388478%,
    0.287668% at the same s to six decimals, with the same active-set counts
    per step. The six gate tests were repointed at the library for what
    moved and still assert every number they did before.
  detect: test_the_module_reports_nothing, test_it_uses_the_LIBRARY_all_bidirectional, test_steps_three_and_four_differ_ONLY_in_the_material, test_it_reproduces_the_reference_program
  refs: [rebuild/slay/study/staged.py, tools/stage_run.py, rebuild/tests/test_staged.py, rebuild/tests/test_stage_run.py, rebuild/slay/_layers.py]
  date: 2026-10-09

- id: L116
  area: process
  class: ruling
  symptom: >-
    Four tools -- `slide`, `emit_profile`, `plot_stinger` and `study_simple`
    -- each re-posed a solved sweep position by hand, with the same two
    calls: `build_model(..., extra_stations=sweep._required_stations(scene))`
    and `build_problem(..., **sweep.with_buffer(...))`. Six of those
    imported a PRIVATE function across a layer boundary into unpoliced code.
  cause: >-
    The re-pose is a workflow step and was never given a name, so each
    caller rebuilt it. It is the same class as L115's staged sequence: a
    `study`-layer operation living in `tools/`.
  cause_detail: >-
    THE COST IS NOT HYPOTHETICAL AND IS ALREADY IN THIS REGISTER. L109 --
    the buffer's elastic span being REPLACED rather than merged, which would
    have let feedstock yield and carried a plastic hinge forward through
    every later position -- took a FOUR-SITE fix, and the four sites are
    exactly these four tools. One function would have made it one site. The
    re-pose also has a second way to go wrong that nothing would have
    caught: mesh the re-pose at a different density than the sweep solved
    on and every element index names a different element, so the sections
    table carries strains against the wrong ones, silently and plausibly.
  rule: >-
    `sweep.passage_model(scene, ils, s_centre, **mesh_kw)` builds the mesh
    the sweep solved on; `sweep.repose(model, scene, shift, s_centre,
    problem_kw, ils, **kw)` poses one position on it with the buffer merged.
    Both in `study`, where the sweep they must agree with already lives. The
    private crossing is gone: `_required_stations` is now called only from
    inside its own module.
  rule_detail: >-
    THE EXTRACTION IS NARROWER THAN THE REVIEW THAT PROPOSED IT, which is
    worth recording because the first shape would have been wrong. The
    review described the repeated idiom as the whole chain -- scene_for,
    start_centre, run, measure, envelope, then the re-pose -- and reading
    the four call sites showed only the RE-POSE is genuinely common. The
    outer chain differs by caller for real reasons: `slide` carries modes
    and clearances, `emit_profile` caches per shift, `study_simple` takes
    mesh and modulus flags. Forcing those into one function would have
    invented a shape none of them has. Two small functions, not one big one.
  rule_detail_2: >-
    BIT-IDENTICAL, PROVEN BEFORE AND AFTER on a 2.5 D GD-TP at R = 85: all
    four profile-artifact sha256 hashes unchanged (geometry, sections,
    stations, members), the envelope unchanged to fifteen decimals, and
    `slide.passage`'s first Problem unchanged by full `to_json` digest. A
    refactor of a re-pose is exactly the kind that can move a number without
    failing anything, so the digest was the gate rather than the test suite
    alone.
  detect: test_passage_model_meshes_as_the_sweep_does, test_repose_merges_the_buffer_rather_than_replacing_it, test_repose_reproduces_a_hand_posed_problem_exactly
  refs: [rebuild/slay/study/sweep.py, tools/slide.py, tools/emit_profile.py, tools/plot_stinger.py, tools/study_simple.py, rebuild/tests/test_sweep.py]
  date: 2026-10-09

- id: L117
  area: process
  class: ruling
  symptom: >-
    `tools/plot_stinger.py` is 1349 lines, imports numpy and matplotlib at
    module scope, and is documented in TOOLCHAIN as SUPERSEDED for figures
    (G13). Ten other modules imported it anyway -- five tools and five
    tests -- and between them used four of its twenty-four definitions:
    `build_component_ils` (x17 call sites), `FIXTURE` (x2), `_rel` (x2) and
    `TON` (x1). Two of those four were private.
  cause: >-
    `build_component_ils` was written where it was first needed. It reads
    the mirrored archetype fixture and hands the definition to the mirrored
    `ils_builder` -- that is `define`-layer work, with no drawing in it --
    but it was never moved out of the figure tool it was born in.
  cause_detail: >-
    THE LAYER LINTER COULD NOT SEE THIS. `tools/` is not policed by
    `check_layers.py`, so a `define`-layer function sitting in a tool is
    invisible to the gate that exists to catch exactly this. The private
    crossings are the symptom that gives it away: `_rel` was being called
    from two other tools, which means the module had no enforced surface at
    all, only a convention nobody was checking. The second cost is paid on
    every import: a test that wants one archetype built loads numpy and
    matplotlib to get it.
  rule: >-
    `slay/define/archetypes.py` owns `FIXTURE`, `definitions()` and
    `build_component_ils`. The ten callers import the library. `plot_stinger`
    imports both names back (`FIXTURE = archetypes.FIXTURE`), so the figure
    tool's own surface is unchanged and nothing that pointed at it broke.
    `_rel` was the other half of the problem and is now public `rel`,
    because it is presentation -- it belongs to the plotter, it just has to
    say so.
  rule_detail: >-
    `definitions()` RE-READS THE FIXTURE ON EVERY CALL and is deliberately
    not cached. The fixture is mirrored data hashed under G7; a module-level
    cache would hold a stale copy across a re-sync, which is precisely the
    silent drift the guardrail exists to catch. The cost is one small JSON
    read per build and it is worth paying.
  rule_detail_2: >-
    BIT-IDENTICAL, PROVEN BEFORE AND AFTER by eleven fingerprints captured
    from the old call path and replayed through the new one: all seven
    published archetypes, three dimensioned variants (`OD`/`t_wall`,
    `L_OD`, `t_ratio`), and the refusal path -- the `ValueError` text for
    `L_OD` on a bare `ILS-SH`, compared as a string. The refusal is in the
    fingerprint set on purpose: a relative dimension applied to
    `components[0]` instead of to the component that HAS the attribute
    would re-dimension the wrong body and still build, so the error message
    is as much a result as the geometry is.
  rule_detail_3: >-
    ONE SELF-INFLICTED BREAK, WORTH RECORDING. The migration was done with
    a regex over the ten callers, and in `test_simple_component.py` the
    import being replaced was FUNCTION-LOCAL, not top-level. Substituting a
    module-level import block at that indentation produced an
    `IndentationError` at line 364 -- caught by the suite, not by the
    fingerprints, because the file never imported. A mechanical edit across
    ten files needs the suite run as the gate, not just the equivalence
    check the refactor was designed around.
  detect: test_every_published_archetype_builds, test_a_dimension_goes_to_the_component_that_HAS_it, test_a_dimension_no_component_carries_is_refused, test_the_fixture_is_read_per_call_not_cached
  refs: [rebuild/slay/define/archetypes.py, tools/plot_stinger.py, tools/emit_profile.py, tools/simplify_ils.py, rebuild/tests/test_simplify.py, docs/TOOLCHAIN.md]
  date: 2026-10-09

- id: L118
  area: measure
  class: finding
  symptom: >-
    The EA-SB family's simplified models bias +8.4% high with ONE SIGN across
    all three published cases, and after L113 was withdrawn the two surviving
    candidates were both about the load path. Neither had been tested, and a
    third possibility had not even been stated: that the error scales with
    how deep the structure holds the pipe.
  cause: >-
    It does not. `P_v` swept 1 D to 4 D on F2 Case 2 -- a SEVENFOLD change in
    lift, 0.5 D to 3.5 D, with `P_l1`, `P_l2`, `P_c1`, `kB` and the
    connection system all held exactly -- moves the bias from +5.8% to +6.4%
    and no further. Band 0.6 POINTS. Over the same sweep the quantity being
    predicted moves by a FACTOR OF 2.60: real X_c 1.305% to 3.390%,
    simplified peak 1.3809% to 3.5864%, multiplying by 2.598 and 2.597.
  cause_detail: >-
    WHAT THAT ELIMINATES is any mechanism whose magnitude scales with the
    offset depth, the lift, the taper severity or the lifted footprint. All
    four move substantially across the sweep -- lift x7, taper footprint
    `L2` 1.249 to 2.187 D (+75%), total footprint 12.494 to 14.370 D -- and
    the bias does not. The contact geometry over the lifted span is
    specifically ruled out: a flat standing in for a cylinder is a FIXED
    geometric difference, but its consequence would have to grow with how
    much pipe is sitting on it, and it does not.
  cause_detail_2: >-
    WHAT IT DOES NOT TOUCH is either surviving candidate, and this is the
    part to be careful with. The load path (continuous transfer along a
    clamped shroud against two discrete connectors) and the stiffened span
    (between the connectors only, against a base bearing along its whole
    length) are both about WHERE load enters the pipe. Neither predicts any
    `P_v` dependence, so a flat bias is CONSISTENT WITH them and is not
    EVIDENCE FOR them. Separating those two needs `P_c1` swept against
    `P_l1`; it has not been run.
  rule: >-
    A characterisation sweep moves ONE parameter and runs BOTH models at
    every point. Four runs per row here -- the stiffness rig and the contact
    profile on the real ILS, then a full passage on each of the real and the
    simplified model -- and the real side goes through
    `study_easb_cases.run_case` UNCHANGED rather than a copy, so the
    reference column is the same code path Sec. 5's table was produced by.
    The published point is included as a CONTROL, not skipped as already
    known.
  rule_detail: >-
    TWO SIDE FINDINGS, both from instruments that were not asked the
    question. The rig reads the frame stiffness as NOT MONOTONIC in `P_v`:
    it peaks at 2.5 D (7.913 x EI_pipe) and falls off both ways, 7.177 at
    1 D and 7.725 at 4 D, because `P_l2` is fixed at 2.5 D while the depth
    the taper must climb grows -- past about 2.5 D the frame pays more in
    taper angle than it gains in depth. The range is only +10%
    low-to-peak, which is what makes the table readable as a lift sweep at
    near-constant stiffness. Separately X_i moves +10% while X_c moves
    +160%, so the pipe between the connectors is nearly indifferent to the
    structure's depth -- what "shielded by the frame" should mean, measured
    across a depth range for the first time.
  rule_detail_2: >-
    THE CONTROL'S LAST DIGIT WAS CHASED RATHER THAN WAVED THROUGH. The 2 D
    row printed a simplified 2.1854% against 2.1855% on record. It is the
    INPUTS: the recorded row was run from the measurement table's PRINTED
    values (E = 1653 GPa, L1 = 9.996 D, L2 = 1.875 D), the sweep from the
    measurement's own floats. Run both ways on this build -- rounded
    2.185482%, measured 2.185435%, 4.7e-5 points apart, with E low by 0.386
    GPa. `sweep.repose` (L116) had landed one commit earlier and a re-pose
